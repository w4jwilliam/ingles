<html lang="pt-BR">
<head>

<style>
:root{
  --roxo:#7C3AED;
  --roxo2:#A78BFA;
  --rosa:#EC4899;
  --rosa2:#F472B6;
  --laranja:#F97316;
  --laranja2:#FB923C;
  --amarelo:#FACC15;
  --verde:#10B981;
  --verde2:#34D399;
  --azul:#3B82F6;
  --azul2:#60A5FA;
  --ciano:#06B6D4;
  --preto:#0F0F1A;
  --cinza1:#1A1A2E;
  --cinza2:#25253D;
  --cinza3:#34344F;
  --branco:#FFFFFF;
  --texto:#F4F4F5;
  --texto2:#A1A1AA;
  --grad-principal:linear-gradient(135deg,#7C3AED 0%,#EC4899 50%,#F97316 100%);
  --grad-azul:linear-gradient(135deg,#3B82F6,#06B6D4);
  --grad-verde:linear-gradient(135deg,#10B981,#06B6D4);
  --grad-rosa:linear-gradient(135deg,#EC4899,#A78BFA);
  --grad-laranja:linear-gradient(135deg,#F97316,#FACC15);
  --disp:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --corpo:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--preto);
  color:var(--texto);
  font-family:var(--corpo);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  background-image:
    radial-gradient(circle at 20% 10%, rgba(124,58,237,.15), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(236,72,153,.12), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(249,115,22,.08), transparent 50%);
  background-attachment:fixed;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:16px}
.app{max-width:560px;margin:0 auto;padding:18px 16px 24px}
.oculto{display:none !important}

h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0 0 14px;line-height:1.1;color:var(--branco)}
h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2;color:var(--branco)}
h3{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0;color:var(--branco)}
.rotulo{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--texto2);font-weight:500}
.dado{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;color:var(--branco)}
.pt{color:var(--texto2);font-size:13.5px;line-height:1.45}

.topo{display:flex;align-items:center;gap:11px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.06)}
.selo-nivel{background:var(--grad-principal);color:var(--branco);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;line-height:1.1;min-width:46px;box-shadow:0 4px 14px rgba(124,58,237,.4)}
.selo-nivel .n{font-family:var(--mono);font-size:16px;font-weight:700}
.selo-nivel .l{font-family:var(--mono);font-size:7.5px;letter-spacing:.12em;opacity:.85;margin-top:1px}
.topo-info{flex:1;min-width:0}
.topo-info .nome{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--branco)}
.metricas{display:flex;gap:14px;margin-top:4px;flex-wrap:wrap}
.metricas span{font-family:var(--mono);font-size:10.5px;color:var(--texto2)}
.metricas b{color:var(--branco);font-weight:700}

.carta{background:rgba(26,26,46,.6);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;margin-bottom:11px;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.carta.destaque{background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(236,72,153,.15));border-color:rgba(124,58,237,.4);box-shadow:0 8px 24px rgba(124,58,237,.2)}
.carta-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}

.btn{display:block;width:100%;text-align:center;background:var(--grad-principal);color:var(--branco);border-radius:12px;padding:14px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(124,58,237,.35);transition:transform .15s ease,box-shadow .15s ease;letter-spacing:-.01em}
.btn:active{transform:scale(.97);box-shadow:0 3px 10px rgba(124,58,237,.25)}
.btn:disabled{opacity:.4;cursor:default}
.btn.secundario{background:rgba(255,255,255,.05);color:var(--branco);border:1px solid rgba(255,255,255,.12);box-shadow:none;font-weight:600}
.btn.secundario:active{background:rgba(255,255,255,.1)}
.btn.verde{background:var(--grad-verde);box-shadow:0 6px 18px rgba(16,185,129,.35)}
.btn.azul{background:var(--grad-azul);box-shadow:0 6px 18px rgba(59,130,246,.35)}
.btn.rosa{background:var(--grad-rosa);box-shadow:0 6px 18px rgba(236,72,153,.35)}
.btn.laranja{background:var(--grad-laranja);box-shadow:0 6px 18px rgba(249,115,22,.35)}
.btn.pequeno{padding:9px 14px;font-size:13px;width:auto;display:inline-block}
button:focus-visible{outline:2.5px solid var(--roxo2);outline-offset:2px}

.barra{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--grad-principal);border-radius:99px;transition:width .4s ease}

.semana{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.dia{aspect-ratio:1;border-radius:8px;border:1.5px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;color:var(--texto2);background:rgba(255,255,255,.02)}
.dia.feito{background:var(--grad-verde);border-color:transparent;color:var(--branco);font-weight:700;box-shadow:0 3px 10px rgba(16,185,129,.3)}
.dia.hoje{border-color:var(--laranja);border-width:2px;color:var(--branco)}

.sessao-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.blocos{display:flex;gap:4px;margin-bottom:16px}
.blocos i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.08)}
.blocos i.ativo{background:var(--grad-principal)}
.blocos i.pronto{background:var(--grad-verde)}
.cronometro{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--texto2);background:rgba(255,255,255,.05);padding:5px 10px;border-radius:8px}
.cronometro.estourou{color:var(--rosa);background:rgba(236,72,153,.15)}

.pergunta{font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.25;margin:6px 0 4px;color:var(--branco)}
.pergunta.en{font-size:24px;font-family:var(--mono)}
.opcoes{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opc{text-align:left;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:10px;padding:13px 14px;font-size:15px;color:var(--texto);transition:all .15s;width:100%}
.opc:active{background:rgba(255,255,255,.08);transform:scale(.99)}
.opc.certa{background:rgba(16,185,129,.18);border-color:var(--verde);color:var(--branco);animation:pulseOk .5s}
.opc.errada{background:rgba(236,72,153,.18);border-color:var(--rosa);color:var(--branco);animation:shakeErr .4s}

@keyframes shakeErr{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.campo:focus{border-color:var(--roxo2);background:rgba(255,255,255,.06)}
textarea.campo{min-height:90px;resize:vertical;line-height:1.45}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:8px;padding:9px 13px;font-size:14.5px;color:var(--texto);transition:all .12s}
.chip:active{background:rgba(255,255,255,.12);transform:scale(.97)}
.chip.usado{opacity:.25;pointer-events:none}
.linha-montada{min-height:48px;border-bottom:1.5px dashed rgba(255,255,255,.15);display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px;align-items:flex-start}

.retorno{border-radius:10px;padding:12px 14px;margin-top:13px;font-size:14px;line-height:1.45}
.retorno.ok{background:rgba(16,185,129,.15);border-left:3px solid var(--verde)}
.retorno.nao{background:rgba(236,72,153,.15);border-left:3px solid var(--rosa)}
.retorno .t{font-weight:700;display:block;margin-bottom:4px;color:var(--branco);font-size:13px;letter-spacing:.02em}

.som{width:104px;height:104px;border-radius:50%;background:var(--grad-azul);color:var(--branco);display:flex;align-items:center;justify-content:center;margin:16px auto;font-size:36px;box-shadow:0 8px 24px rgba(59,130,246,.4);transition:transform .15s}
.som:active{transform:scale(.92)}

.estampas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.estampa{position:relative;border:1.5px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 12px;background:rgba(255,255,255,.03);min-height:110px;display:flex;flex-direction:column;justify-content:space-between;transition:all .2s}
.estampa .num{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--texto2);font-weight:500}
.estampa .tit{font-weight:700;font-size:14.5px;letter-spacing:-.01em;margin-top:5px;color:var(--branco)}
.estampa.carimbada{border-color:var(--amarelo);border-style:double;border-width:3px;background:linear-gradient(135deg,rgba(250,204,21,.12),rgba(249,115,22,.08));animation:carimboPop .6s}
.estampa.carimbada .carimbo{position:absolute;right:8px;bottom:8px;transform:rotate(-12deg);border:1.5px solid var(--amarelo);color:var(--amarelo);border-radius:5px;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:3px 6px;text-transform:uppercase;background:rgba(250,204,21,.1)}
.estampa.atual{border-color:var(--roxo2);border-width:2px;background:linear-gradient(135deg,rgba(124,58,237,.1),rgba(236,72,153,.1))}
.estampa.travada{opacity:.4}

@keyframes carimboPop{0%{transform:scale(.85) rotate(-3deg);opacity:.5}60%{transform:scale(1.05) rotate(1deg)}100%{transform:scale(1) rotate(0);opacity:1}}

.conversa{display:flex;flex-direction:column;gap:9px;margin-bottom:13px}
.bolha{max-width:88%;padding:11px 14px;border-radius:14px;font-size:14.5px;line-height:1.45}
.bolha.eu{align-self:flex-end;background:var(--grad-principal);color:var(--branco);border-bottom-right-radius:5px;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.bolha.ia{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-bottom-left-radius:5px;color:var(--texto)}
.bolha .traducao{display:block;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:var(--texto2)}
.escrevendo{font-family:var(--mono);font-size:11.5px;color:var(--texto2);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.envio{display:flex;gap:8px;align-items:flex-end}
.envio .campo{flex:1}
.envio .btn{width:auto;padding:13px 18px}

.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,15,26,.85);border-top:1px solid rgba(255,255,255,.08);display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(20px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--texto2);min-height:48px;transition:color .15s}
.nav button .ic{font-size:18px;line-height:1;transition:transform .2s}
.nav button .tx{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.nav button.ativo{color:var(--branco)}
.nav button.ativo .ic{transform:scale(1.15)}
.nav button.ativo.painel{color:var(--azul2)}
.nav button.ativo.sessao{color:var(--roxo2)}
.nav button.ativo.passaporte{color:var(--verde2)}
.nav button.ativo.tutor{color:var(--laranja2)}
.nav button:focus-visible{outline:2px solid var(--roxo2);outline-offset:-2px}

.grid-conquistas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;margin-top:11px}
.conquista{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:11px;padding:11px 6px;text-align:center;transition:all .2s}
.conquista.bloq{opacity:.35}
.conquista.desb{border-color:var(--amarelo);background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(249,115,22,.1));box-shadow:0 4px 14px rgba(250,204,21,.2);animation:desbloqueia .7s}
.conquista .ico{font-size:24px;line-height:1;margin-bottom:6px}
.conquista .nm{font-weight:700;font-size:11px;letter-spacing:-.01em;color:var(--branco)}
@keyframes desbloqueia{0%{transform:scale(.7) rotate(-10deg);opacity:0}60%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:11px}
.stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:12px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad-principal)}
.stat.verde::before{background:var(--grad-verde)}
.stat.azul::before{background:var(--grad-azul)}
.stat.rosa::before{background:var(--grad-rosa)}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--branco)}
.stat .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--texto2);margin-top:3px;text-transform:uppercase;font-weight:500}

.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--grad-principal);color:var(--branco);padding:11px 18px;border-radius:12px;font-size:14px;z-index:100;max-width:90%;text-align:center;font-weight:700;box-shadow:0 10px 30px rgba(124,58,237,.4);animation:toastIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-15px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

.confetti{position:fixed;top:-10px;width:10px;height:14px;pointer-events:none;z-index:99;animation:fallConf 2.5s linear forwards}
@keyframes fallConf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

.rodape{text-align:center;margin-top:22px;color:var(--texto2);font-size:11.5px;font-family:var(--mono)}
.aviso{background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(249,115,22,.1));border:1px solid rgba(250,204,21,.3);border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.4;color:var(--texto)}

.install-banner{position:fixed;bottom:72px;left:10px;right:10px;max-width:540px;margin:0 auto;background:var(--grad-principal);color:var(--branco);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;z-index:15;box-shadow:0 8px 24px rgba(124,58,237,.4)}
.install-banner button{background:var(--branco);color:var(--roxo);border-radius:8px;padding:7px 12px;font-weight:700;font-size:12px}
.install-banner .x{padding:4px 8px;background:transparent;color:var(--branco);font-size:16px}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>

<script>
/* SISTEMA DE SONS */
let audioCtx=null;
let configSom={ligado:true,vibrar:true,toque:true};

function initAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function beep(freq,dur,tipo,vol){
  if(!configSom.ligado||!audioCtx)return;
  try{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type=tipo||'sine';
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(vol||.15,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start();osc.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function tocarToque(){if(configSom.toque)beep(800,.04,'square',.04);}
function somAcerto(perfeito){
  if(!configSom.ligado||!audioCtx)return;
  if(configSom.vibrar&&navigator.vibrate)navigator.vibrate(15);
  if(perfeito){beep(523,.1,'sine',.18);setTimeout(()=>beep(659,.1,'sine',.18),80);setTimeout(()=>beep(784,.15,'sine',.18),160);}
  else{beep(523,.12,'sine',.15);setTimeout(()=>beep(659,.15,'sine',.15),100);}
}
function somErro(){
  if(!configSom.ligado||!audioCtx)return;
  if(configSom.vibrar&&navigator.vibrate)navigator.vibrate([0,30,30,30]);
  beep(220,.1,'sawtooth',.1);setTimeout(()=>beep(180,.15,'sawtooth',.1),100);
}
function somConquista(){
  if(!configSom.ligado||!audioCtx)return;
  if(configSom.vibrar&&navigator.vibrate)navigator.vibrate([0,50,50,50,50,100]);
  beep(523,.1,'sine',.2);setTimeout(()=>beep(659,.1,'sine',.2),100);
  setTimeout(()=>beep(784,.1,'sine',.2),200);setTimeout(()=>beep(1047,.25,'sine',.2),300);
}
function somNivel(){
  if(!configSom.ligado||!audioCtx)return;
  if(configSom.vibrar&&navigator.vibrate)navigator.vibrate([0,80,40,80]);
  beep(392,.1,'sine',.18);setTimeout(()=>beep(523,.1,'sine',.18),120);
  setTimeout(()=>beep(659,.1,'sine',.18),240);setTimeout(()=>beep(784,.1,'sine',.18),360);
  setTimeout(()=>beep(1047,.4,'sine',.2),480);
}

function soltarConfete(){
  const cores=['#7C3AED','#EC4899','#F97316','#FACC15','#10B981','#3B82F6','#06B6D4'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=cores[Math.floor(Math.random()*cores.length)];
    c.style.animationDelay=Math.random()*.5+'s';
    c.style.animationDuration=(1.8+Math.random()*1.5)+'s';
    c.style.transform='rotate('+(Math.random()*360)+'deg)';
    if(Math.random()>.5)c.style.borderRadius='50%';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3500);
  }
}

/* CURRICULO - mantido identico */
const CURSO = [
{n:1,nome:"Primeiras palavras",desc:"Cumprimentar, se apresentar, falar de pessoas e numeros.",u:[
 {t:"Cumprimentos",
  v:[["hello","ola","Hello! How are you?","Ola! Como voce esta?"],["good morning","bom dia","Good morning, everyone.","Bom dia, pessoal."],["my name is","meu nome e","My name is Victor.","Meu nome e Victor."],["nice to meet you","prazer em conhecer voce","Nice to meet you, Ana.","Prazer em conhecer voce, Ana."],["thank you","obrigado","Thank you very much.","Muito obrigado."],["goodbye","tchau / adeus","Goodbye, see you tomorrow.","Tchau, ate amanha."]],
  g:{t:"Verbo TO BE (ser/estar)",e:"Em ingles todo mundo precisa do verbo TO BE. Sao tres formas no presente: I am (eu sou/estou), you are (voce e/esta), he/she/it is (ele/ela e/esta). E como o cinto de seguranca do carro: quase nenhuma frase sai sem ele.",
     ex:[["I am Victor.","Eu sou o Victor."],["You are my friend.","Voce e meu amigo."],["She is tired.","Ela esta cansada."]]},
  d:[["I ___ from Brazil.",["am","is","are"],0,"Eu sou do Brasil."],["She ___ my sister.",["am","is","are"],1,"Ela e minha irma."],["You ___ very kind.",["am","is","are"],2,"Voce e muito gentil."],["It ___ a good day.",["am","is","are"],1,"E um bom dia."]],
  p:{pt:"Escreva em ingles: Ola, meu nome e Victor. Prazer em conhecer voce.",en:"Hello, my name is Victor. Nice to meet you."}},
 {t:"Pessoas e familia",
  v:[["mother","mae","My mother works here.","Minha mae trabalha aqui."],["father","pai","His father is a driver.","O pai dele e motorista."],["brother","irmao","I have one brother.","Eu tenho um irmao."],["sister","irma","My sister is a student.","Minha irma e estudante."],["friend","amigo","She is my best friend.","Ela e minha melhor amiga."],["family","familia","My family is big.","Minha familia e grande."]],
  g:{t:"Artigos A / AN",e:"A e AN significam 'um/uma'. Use AN antes de som de vogal (a, e, i, o, u): an apple. Use A antes de consoante: a car. E so uma questao de a boca nao tropecar.",
     ex:[["a car","um carro"],["an apple","uma maca"],["an hour","uma hora (o H e mudo)"]]},
  d:[["I have ___ brother.",["a","an"],0,"Eu tenho um irmao."],["She is ___ engineer.",["a","an"],1,"Ela e engenheira."],["This is ___ house.",["a","an"],0,"Esta e uma casa."],["He wants ___ orange.",["a","an"],1,"Ele quer uma laranja."]],
  p:{pt:"Escreva em ingles: Minha familia e grande. Eu tenho um irmao e uma irma.",en:"My family is big. I have one brother and one sister."}},
 {t:"Numeros e cores",
  v:[["one","um","I need one ticket.","Eu preciso de um bilhete."],["two","dois","Two coffees, please.","Dois cafes, por favor."],["three","tres","Three days a week.","Tres dias por semana."],["red","vermelho","The red car is mine.","O carro vermelho e meu."],["blue","azul","I like the blue one.","Eu gosto do azul."],["black","preto","A black phone.","Um telefone preto."]],
  g:{t:"Plural com -S",e:"Para falar de mais de um, coloca -s no fim: car > cars. Palavras terminadas em s, x, ch, sh ganham -es: box > boxes. Diferente do portugues, o adjetivo NAO muda: two red cars (nao 'two reds cars').",
     ex:[["one car / two cars","um carro / dois carros"],["one box / three boxes","uma caixa / tres caixas"],["two blue doors","duas portas azuis"]]},
  d:[["I have two ___.",["car","cars"],1,"Eu tenho dois carros."],["Three ___ are here.",["boxes","boxs"],0,"Tres caixas estao aqui."],["She has one ___.",["sister","sisters"],0,"Ela tem uma irma."],["Two ___ phones.",["black","blacks"],0,"Dois telefones pretos."]],
  p:{pt:"Escreva em ingles: Eu tenho dois carros. Um e vermelho e um e azul.",en:"I have two cars. One is red and one is blue."}}
]},
{n:2,nome:"O dia a dia",desc:"Objetos, verbos basicos, rotina e perguntas simples.",u:[
 {t:"Objetos do dia a dia",
  v:[["phone","telefone","My phone is on the table.","Meu telefone esta na mesa."],["car","carro","The car is new.","O carro e novo."],["house","casa","Their house is near.","A casa deles e perto."],["key","chave","I lost my key.","Eu perdi minha chave."],["water","agua","I want water, please.","Eu quero agua, por favor."],["money","dinheiro","I need more money.","Eu preciso de mais dinheiro."]],
  g:{t:"THIS / THAT / THESE / THOSE",e:"THIS = este (perto, um). THAT = aquele (longe, um). THESE = estes (perto, varios). THOSE = aqueles (longe, varios). Pense em braco: o que voce alcanca e this/these; o que precisa apontar e that/those.",
     ex:[["This phone is mine.","Este telefone e meu."],["That car is fast.","Aquele carro e rapido."],["These keys are old.","Estas chaves sao velhas."]]},
  d:[["___ phone here is mine.",["This","That"],0,"Este telefone aqui e meu."],["___ cars over there are new.",["These","Those"],1,"Aqueles carros ali sao novos."],["___ keys in my hand.",["These","Those"],0,"Estas chaves na minha mao."],["___ house is far.",["That","These"],0,"Aquela casa e longe."]],
  p:{pt:"Escreva em ingles: Este e meu telefone. Aquele carro e novo.",en:"This is my phone. That car is new."}},
 {t:"Verbos basicos",
  v:[["to eat","comer","I eat at noon.","Eu como ao meio-dia."],["to drink","beber","She drinks coffee.","Ela bebe cafe."],["to work","trabalhar","I work with glass.","Eu trabalho com vidro."],["to live","morar","They live in Rio.","Eles moram no Rio."],["to want","querer","I want a break.","Eu quero uma pausa."],["to have","ter","We have two cars.","Nos temos dois carros."]],
  g:{t:"Presente simples e o -S do he/she/it",e:"O verbo so muda numa pessoa: he, she, it ganham -S. I work, you work, WE work, mas HE workS. Chame de 'imposto do he/she/it': so eles pagam a letra extra.",
     ex:[["I work every day.","Eu trabalho todo dia."],["He works every day.","Ele trabalha todo dia."],["She has a car.","Ela tem um carro."]]},
  d:[["He ___ coffee every morning.",["drink","drinks"],1,"Ele bebe cafe toda manha."],["I ___ in Sao Paulo.",["live","lives"],0,"Eu moro em Sao Paulo."],["She ___ two brothers.",["have","has"],1,"Ela tem dois irmaos."],["We ___ at 8 o'clock.",["start","starts"],0,"Nos comecamos as 8 horas."]],
  p:{pt:"Escreva em ingles: Eu trabalho todo dia e minha irma trabalha no sabado.",en:"I work every day and my sister works on Saturday."}},
 {t:"Tempo e rotina",
  v:[["morning","manha","I run in the morning.","Eu corro de manha."],["night","noite","I study at night.","Eu estudo a noite."],["today","hoje","Today is Monday.","Hoje e segunda-feira."],["tomorrow","amanha","See you tomorrow.","Ate amanha."],["always","sempre","I always drink coffee.","Eu sempre bebo cafe."],["never","nunca","He never arrives late.","Ele nunca chega atrasado."]],
  g:{t:"Perguntas com DO / DOES",e:"Para perguntar no presente, o ingles precisa de um ajudante na frente: DO (I/you/we/they) ou DOES (he/she/it). E atencao: quando DOES entra, o verbo perde o -S. O ajudante carrega o peso: Does he work? (nao 'Does he works').",
     ex:[["Do you work here?","Voce trabalha aqui?"],["Does she like coffee?","Ela gosta de cafe?"],["I don't understand.","Eu nao entendo."]]},
  d:[["___ you live in Brazil?",["Do","Does"],0,"Voce mora no Brasil?"],["___ he work on Sunday?",["Do","Does"],1,"Ele trabalha no domingo?"],["Does she ___ coffee?",["drink","drinks"],0,"Ela bebe cafe?"],["I ___ have time today.",["don't","doesn't"],0,"Eu nao tenho tempo hoje."]],
  p:{pt:"Escreva em ingles: Voce trabalha de manha? Eu sempre trabalho a noite.",en:"Do you work in the morning? I always work at night."}}
]},
{n:3,nome:"Lugares e direcoes",desc:"Se virar na cidade, dizer onde as coisas estao e dar instrucoes.",u:[
 {t:"Na cidade",
  v:[["street","rua","The store is on this street.","A loja fica nesta rua."],["store","loja","The store opens at nine.","A loja abre as nove."],["restaurant","restaurante","A good restaurant nearby.","Um bom restaurante perto."],["bank","banco","I go to the bank on Friday.","Eu vou ao banco na sexta."],["hospital","hospital","The hospital is far.","O hospital e longe."],["airport","aeroporto","My flight leaves from the airport.","Meu voo sai do aeroporto."]],
  g:{t:"THERE IS / THERE ARE",e:"E o 'ha / tem' do ingles. THERE IS para um (there is a bank). THERE ARE para varios (there are two banks). Note que o ingles separa o 'ter posse' (have) do 'ter existencia' (there is) - em portugues usamos 'tem' para os dois.",
     ex:[["There is a store here.","Tem uma loja aqui."],["There are three restaurants.","Tem tres restaurantes."],["Is there a bank near here?","Tem um banco perto daqui?"]]},
  d:[["___ a hospital on this street.",["There is","There are"],0,"Tem um hospital nesta rua."],["___ many cars outside.",["There is","There are"],1,"Tem muitos carros la fora."],["___ a bank near here?",["Is there","Are there"],0,"Tem um banco perto daqui?"],["There ___ two stores.",["is","are"],1,"Tem duas lojas."]],
  p:{pt:"Escreva em ingles: Tem um bom restaurante nesta rua.",en:"There is a good restaurant on this street."}},
 {t:"Onde as coisas estao",
  v:[["in","dentro de / em","The key is in my bag.","A chave esta na minha bolsa."],["on","sobre / em cima","The phone is on the table.","O telefone esta na mesa."],["at","em (ponto)","I am at work.","Eu estou no trabalho."],["near","perto","The store is near my house.","A loja e perto da minha casa."],["between","entre","Between the bank and the store.","Entre o banco e a loja."],["behind","atras","The car is behind the house.","O carro esta atras da casa."]],
  g:{t:"IN / ON / AT",e:"IN = dentro de um espaco (in the car, in Brazil). ON = em cima de uma superficie (on the table, on the street). AT = num ponto exato (at home, at work, at 8 o'clock). Pense em zoom: IN e a cidade, ON e a rua, AT e a porta.",
     ex:[["in the car","dentro do carro"],["on the table","em cima da mesa"],["at the airport","no aeroporto"]]},
  d:[["The keys are ___ the table.",["in","on","at"],1,"As chaves estao em cima da mesa."],["I live ___ Brazil.",["in","on","at"],0,"Eu moro no Brasil."],["She is ___ home now.",["in","on","at"],2,"Ela esta em casa agora."],["My office is ___ the bank.",["near","in"],0,"Meu escritorio e perto do banco."]],
  p:{pt:"Escreva em ingles: A chave esta em cima da mesa, perto do telefone.",en:"The key is on the table, near the phone."}},
 {t:"Direcoes",
  v:[["left","esquerda","Turn left at the corner.","Vire a esquerda na esquina."],["right","direita","The store is on the right.","A loja fica a direita."],["straight","reto","Go straight for two blocks.","Siga reto por dois quarteiroes."],["corner","esquina","Wait at the corner.","Espere na esquina."],["block","quarteirao","It is two blocks away.","Fica a dois quarteiroes."],["far","longe","Is it far from here?","E longe daqui?"]],
  g:{t:"Imperativo (dar instrucoes)",e:"Para mandar ou instruir, use o verbo puro, sem sujeito: Turn left. Go straight. Para negar, coloque DON'T na frente: Don't turn here. E o modo mais curto do ingles - e o mais usado em placa, receita e manual.",
     ex:[["Turn right.","Vire a direita."],["Don't stop here.","Nao pare aqui."],["Call me later.","Me ligue mais tarde."]]},
  d:[["___ left at the bank.",["Turn","Turns"],0,"Vire a esquerda no banco."],["___ open the door.",["Don't","Doesn't"],0,"Nao abra a porta."],["___ straight for one block.",["Go","Goes"],0,"Siga reto por um quarteirao."],["Please ___ me tomorrow.",["call","calls"],0,"Por favor, me ligue amanha."]],
  p:{pt:"Escreva em ingles: Siga reto e vire a direita na esquina.",en:"Go straight and turn right at the corner."}}
]},
{n:4,nome:"Trabalho e comunicacao",desc:"Falar do seu trabalho, do que esta acontecendo agora e do que voce sabe fazer.",u:[
 {t:"No trabalho",
  v:[["job","emprego / trabalho","I like my job.","Eu gosto do meu trabalho."],["meeting","reuniao","The meeting starts at ten.","A reuniao comeca as dez."],["team","time / equipe","My team has six people.","Meu time tem seis pessoas."],["report","relatorio","I am writing the report.","Eu estou escrevendo o relatorio."],["manager","gerente","My manager is in a meeting.","Meu gerente esta em reuniao."],["customer","cliente","The customer is waiting.","O cliente esta esperando."]],
  g:{t:"Presente continuo (agora)",e:"Para o que acontece NESTE momento: TO BE + verbo com -ING. I am working = eu estou trabalhando. E a diferenca entre 'eu trabalho aqui' (rotina, present simple) e 'eu estou trabalhando agora' (continuo).",
     ex:[["I am working now.","Eu estou trabalhando agora."],["She is writing a report.","Ela esta escrevendo um relatorio."],["They are not listening.","Eles nao estao ouvindo."]]},
  d:[["I ___ working right now.",["am","is","are"],0,"Eu estou trabalhando agora."],["She is ___ the report.",["write","writing"],1,"Ela esta escrevendo o relatorio."],["They ___ waiting outside.",["is","are"],1,"Eles estao esperando la fora."],["We ___ having a meeting.",["are","is"],0,"Nos estamos tendo uma reuniao."]],
  p:{pt:"Escreva em ingles: Eu estou escrevendo o relatorio agora. Meu gerente esta em reuniao.",en:"I am writing the report now. My manager is in a meeting."}},
 {t:"Comunicacao",
  v:[["to call","ligar","I will call you later.","Eu te ligo mais tarde."],["to send","enviar","Can you send the file?","Voce pode enviar o arquivo?"],["to ask","perguntar","Ask me anything.","Me pergunte qualquer coisa."],["to answer","responder","She answered my email.","Ela respondeu meu e-mail."],["to explain","explicar","Let me explain it again.","Deixa eu explicar de novo."],["to agree","concordar","I agree with you.","Eu concordo com voce."]],
  g:{t:"CAN / CAN'T",e:"CAN = poder ou saber fazer. Vantagem: nunca muda de forma e o verbo vem puro depois. He can speak (nunca 'he cans' nem 'he can speaks'). Para negar: can't. Para perguntar, inverte: Can you help me?",
     ex:[["I can speak English.","Eu sei falar ingles."],["He can't come today.","Ele nao pode vir hoje."],["Can you help me?","Voce pode me ajudar?"]]},
  d:[["___ you send the file?",["Can","Cans"],0,"Voce pode enviar o arquivo?"],["He can ___ Spanish.",["speak","speaks"],0,"Ele sabe falar espanhol."],["I ___ come tomorrow.",["can't","don't can"],0,"Eu nao posso vir amanha."],["She can ___ the report today.",["finish","finishes"],0,"Ela consegue terminar o relatorio hoje."]],
  p:{pt:"Escreva em ingles: Voce pode me enviar o relatorio? Eu nao consigo abrir o arquivo.",en:"Can you send me the report? I can't open the file."}},
 {t:"Quantidade",
  v:[["some","algum / um pouco","I need some help.","Eu preciso de alguma ajuda."],["any","algum (pergunta/negativa)","Do you have any questions?","Voce tem alguma pergunta?"],["many","muitos","Many people are waiting.","Muitas pessoas estao esperando."],["much","muito (nao contavel)","We don't have much time.","Nos nao temos muito tempo."],["a few","alguns poucos","A few customers called.","Alguns clientes ligaram."],["enough","suficiente","We have enough money.","Nos temos dinheiro suficiente."]],
  g:{t:"Contavel x nao contavel",e:"O ingles separa o que voce consegue contar no dedo (cars, people, questions) do que so se mede (water, time, money, information). Contavel usa many/a few; nao contavel usa much/a little. E cuidado: information e advice NAO tem plural em ingles.",
     ex:[["many cars","muitos carros"],["much water","muita agua"],["I have a few questions.","Eu tenho algumas perguntas."]]},
  d:[["We don't have ___ time.",["many","much"],1,"Nos nao temos muito tempo."],["___ customers called today.",["Many","Much"],0,"Muitos clientes ligaram hoje."],["Do you have ___ questions?",["some","any"],1,"Voce tem alguma pergunta?"],["I need ___ help.",["some","any"],0,"Eu preciso de alguma ajuda."]],
  p:{pt:"Escreva em ingles: Nos nao temos muito tempo, mas eu tenho algumas perguntas.",en:"We don't have much time, but I have a few questions."}}
]},
{n:5,nome:"Falar do passado",desc:"Contar o que aconteceu - verbos regulares, irregulares e perguntas.",u:[
 {t:"Passado regular",
  v:[["worked","trabalhou / trabalhei","I worked late yesterday.","Eu trabalhei ate tarde ontem."],["lived","morou / morei","She lived in Canada.","Ela morou no Canada."],["started","comecou / comecei","The meeting started at ten.","A reuniao comecou as dez."],["finished","terminou / terminei","We finished the report.","Nos terminamos o relatorio."],["called","ligou / liguei","He called me twice.","Ele me ligou duas vezes."],["needed","precisou / precisei","They needed more time.","Eles precisaram de mais tempo."]],
  g:{t:"Passado simples com -ED",e:"A boa noticia: no passado o verbo e igual para todo mundo. I worked, he worked, they worked - um unico formato. So acrescenta -ED (ou -D se ja termina em E: live > lived).",
     ex:[["I worked yesterday.","Eu trabalhei ontem."],["She called me.","Ela me ligou."],["We started early.","Nos comecamos cedo."]]},
  d:[["I ___ late yesterday.",["work","worked"],1,"Eu trabalhei ate tarde ontem."],["She ___ in Canada in 2019.",["lived","lives"],0,"Ela morou no Canada em 2019."],["They ___ the meeting at ten.",["start","started"],1,"Eles comecaram a reuniao as dez."],["He ___ me twice.",["called","calls"],0,"Ele me ligou duas vezes."]],
  p:{pt:"Escreva em ingles: Eu trabalhei ate tarde ontem e terminei o relatorio.",en:"I worked late yesterday and finished the report."}},
 {t:"Passado irregular",
  v:[["went","foi / fui","I went to the bank.","Eu fui ao banco."],["saw","viu / vi","She saw the customer.","Ela viu o cliente."],["had","teve / tive","We had a meeting.","Nos tivemos uma reuniao."],["made","fez / fiz","He made a mistake.","Ele cometeu um erro."],["took","pegou / peguei","I took the car.","Eu peguei o carro."],["said","disse","She said no.","Ela disse nao."]],
  g:{t:"Irregulares e o DIDN'T",e:"Alguns verbos muito usados nao seguem regra: go>went, see>saw, have>had. Sao os 'teimosos', e so a repeticao resolve. Mas na negativa eles voltam ao normal: I didn't GO (nunca 'didn't went') - o DIDN'T ja carrega o passado.",
     ex:[["I went to the bank.","Eu fui ao banco."],["I didn't go to the bank.","Eu nao fui ao banco."],["She didn't see him.","Ela nao o viu."]]},
  d:[["I ___ to the airport yesterday.",["went","goed"],0,"Eu fui ao aeroporto ontem."],["He didn't ___ the file.",["send","sent"],0,"Ele nao enviou o arquivo."],["We ___ a long meeting.",["had","haved"],0,"Nos tivemos uma reuniao longa."],["She didn't ___ anything.",["say","said"],0,"Ela nao disse nada."]],
  p:{pt:"Escreva em ingles: Eu fui ao banco ontem, mas nao vi o gerente.",en:"I went to the bank yesterday, but I didn't see the manager."}},
 {t:"Contar uma historia",
  v:[["yesterday","ontem","Yesterday was busy.","Ontem foi corrido."],["last week","semana passada","We met last week.","Nos nos encontramos semana passada."],["ago","atras","Two days ago.","Dois dias atras."],["then","entao / ai","Then he called me.","Ai ele me ligou."],["after","depois de","After the meeting, I left.","Depois da reuniao, eu sai."],["before","antes de","Before lunch, I finished it.","Antes do almoco, eu terminei."]],
  g:{t:"Perguntas no passado com DID",e:"Mesma logica do DO/DOES, so que no passado e sem excecao: DID para todo mundo. E o verbo volta a forma pura: Did you go? Did she work? O DID ja avisa que e passado - o verbo nao precisa avisar de novo.",
     ex:[["Did you call him?","Voce ligou para ele?"],["Did she finish the report?","Ela terminou o relatorio?"],["What did you do yesterday?","O que voce fez ontem?"]]},
  d:[["___ you call the customer?",["Did","Do"],0,"Voce ligou para o cliente?"],["Did she ___ the report?",["finish","finished"],0,"Ela terminou o relatorio?"],["What ___ you do yesterday?",["did","do"],0,"O que voce fez ontem?"],["I saw him two days ___.",["ago","before"],0,"Eu o vi dois dias atras."]],
  p:{pt:"Escreva em ingles: Voce ligou para o cliente ontem? Eu liguei depois da reuniao.",en:"Did you call the customer yesterday? I called after the meeting."}}
]},
{n:6,nome:"Futuro e planos",desc:"Falar de planos, previsoes e compromissos.",u:[
 {t:"Planos",
  v:[["to plan","planejar","We plan to grow this year.","Nos planejamos crescer este ano."],["to travel","viajar","I am going to travel in July.","Eu vou viajar em julho."],["to move","mudar (de lugar)","They are going to move offices.","Eles vao mudar de escritorio."],["to learn","aprender","I am going to learn English.","Eu vou aprender ingles."],["to try","tentar","I will try again.","Eu vou tentar de novo."],["to decide","decidir","We decided to wait.","Nos decidimos esperar."]],
  g:{t:"GOING TO (plano ja decidido)",e:"Use TO BE + going to + verbo para o que ja esta decidido ou e visivel no horizonte: I am going to study tonight. E o futuro 'com data marcada na cabeca' - bem parecido com o nosso 'eu vou estudar'.",
     ex:[["I am going to study tonight.","Eu vou estudar hoje a noite."],["She is going to travel.","Ela vai viajar."],["It is going to rain.","Vai chover."]]},
  d:[["I ___ going to study tonight.",["am","is"],0,"Eu vou estudar hoje a noite."],["She is going to ___ in July.",["travel","travels"],0,"Ela vai viajar em julho."],["They ___ going to move.",["are","is"],0,"Eles vao mudar."],["It is going ___ rain.",["to","for"],0,"Vai chover."]],
  p:{pt:"Escreva em ingles: Eu vou aprender ingles este ano.",en:"I am going to learn English this year."}},
 {t:"Previsoes",
  v:[["maybe","talvez","Maybe he will come.","Talvez ele venha."],["probably","provavelmente","She will probably agree.","Ela provavelmente vai concordar."],["sure","certo / certeza","I am sure about that.","Eu tenho certeza disso."],["soon","logo","I will call you soon.","Eu te ligo logo."],["later","mais tarde","Let's talk later.","Vamos conversar mais tarde."],["next","proximo","Next week is better.","Semana que vem e melhor."]],
  g:{t:"WILL (decisao na hora e previsao)",e:"WILL e o futuro de quem acabou de decidir ou de quem acha que vai acontecer: I'll help you. Nunca muda de forma e o verbo vem puro. Comparando: 'going to' e plano de agenda; 'will' e palpite ou promessa do momento.",
     ex:[["I will help you.","Eu vou te ajudar."],["It will be fine.","Vai dar certo."],["He won't come today.","Ele nao vira hoje."]]},
  d:[["I ___ call you later.",["will","am"],0,"Eu te ligo mais tarde."],["She will ___ tomorrow.",["arrive","arrives"],0,"Ela vai chegar amanha."],["He ___ come today.",["won't","doesn't will"],0,"Ele nao vira hoje."],["It ___ probably rain.",["will","wills"],0,"Provavelmente vai chover."]],
  p:{pt:"Escreva em ingles: Eu te ligo mais tarde. Provavelmente vamos terminar amanha.",en:"I will call you later. We will probably finish tomorrow."}},
 {t:"Compromissos e viagem",
  v:[["appointment","compromisso / consulta","I have an appointment at three.","Eu tenho um compromisso as tres."],["ticket","passagem / bilhete","I bought the ticket online.","Eu comprei a passagem online."],["flight","voo","My flight is at seven.","Meu voo e as sete."],["hotel","hotel","The hotel is near the airport.","O hotel e perto do aeroporto."],["schedule","agenda / cronograma","Check my schedule, please.","Confira minha agenda, por favor."],["luggage","bagagem","My luggage is heavy.","Minha bagagem esta pesada."]],
  g:{t:"Continuo com valor de futuro",e:"Para compromisso ja marcado, o ingles usa o presente continuo: I am meeting the client at 3. Soa mais natural que 'will' aqui. E o futuro que ja esta na agenda, com hora e tudo.",
     ex:[["I am meeting him at three.","Eu vou encontra-lo as tres."],["We are flying on Monday.","Nos voamos na segunda."],["She is arriving tonight.","Ela chega hoje a noite."]]},
  d:[["I ___ meeting the client at three.",["am","will"],0,"Eu vou encontrar o cliente as tres."],["We are ___ on Monday.",["flying","fly"],0,"Nos voamos na segunda."],["My flight ___ at seven.",["is","are"],0,"Meu voo e as sete."],["She is ___ tonight.",["arriving","arrive"],0,"Ela chega hoje a noite."]],
  p:{pt:"Escreva em ingles: Meu voo e as sete. Eu vou encontrar o cliente amanha.",en:"My flight is at seven. I am meeting the client tomorrow."}}
]},
{n:7,nome:"Comparar e opinar",desc:"Descrever, comparar, dar opiniao e falar de sentimentos.",u:[
 {t:"Adjetivos uteis",
  v:[["cheap","barato","This one is cheaper.","Este e mais barato."],["expensive","caro","That car is expensive.","Aquele carro e caro."],["easy","facil","The test was easy.","A prova foi facil."],["difficult","dificil","English is not difficult.","Ingles nao e dificil."],["fast","rapido","He works fast.","Ele trabalha rapido."],["slow","devagar / lento","The system is slow.","O sistema esta lento."]],
  g:{t:"Comparativo (-ER / MORE)",e:"Palavra curta ganha -ER: cheap > cheaper. Palavra longa (3+ silabas) usa MORE na frente: expensive > more expensive. E o 'do que' e THAN. Regra do bolso: se a palavra e curta, ela mesma carrega o peso; se e longa, pede ajuda.",
     ex:[["This is cheaper than that.","Este e mais barato que aquele."],["It is more expensive.","E mais caro."],["Better than yesterday.","Melhor que ontem."]]},
  d:[["This car is ___ than mine.",["faster","more fast"],0,"Este carro e mais rapido que o meu."],["That hotel is ___ expensive.",["more","most"],0,"Aquele hotel e mais caro."],["Today is better ___ yesterday.",["than","that"],0,"Hoje esta melhor que ontem."],["The test was ___ than I thought.",["easier","more easy"],0,"A prova foi mais facil do que eu pensava."]],
  p:{pt:"Escreva em ingles: Este carro e mais rapido, mas aquele e mais barato.",en:"This car is faster, but that one is cheaper."}},
 {t:"Dar opiniao",
  v:[["I think","eu acho","I think it works.","Eu acho que funciona."],["in my opinion","na minha opiniao","In my opinion, it is late.","Na minha opiniao, esta tarde."],["I agree","eu concordo","I agree with Ana.","Eu concordo com a Ana."],["I disagree","eu discordo","I disagree, sorry.","Eu discordo, desculpe."],["because","porque","Because we need time.","Porque nos precisamos de tempo."],["however","porem","However, it is expensive.","Porem, e caro."]],
  g:{t:"Superlativo (THE -EST / THE MOST)",e:"Para dizer 'o mais de todos', use THE: the cheapest, the most expensive. O THE e obrigatorio - se so existe um campeao, o ingles exige o artigo definido.",
     ex:[["the cheapest option","a opcao mais barata"],["the most expensive car","o carro mais caro"],["the best solution","a melhor solucao"]]},
  d:[["This is ___ option we have.",["the cheapest","cheapest"],0,"Esta e a opcao mais barata que temos."],["It is the ___ expensive one.",["most","more"],0,"E o mais caro."],["He is ___ person on the team.",["the best","best"],0,"Ele e a melhor pessoa do time."],["I think it is ___ way.",["the fastest","the most fast"],0,"Eu acho que e o jeito mais rapido."]],
  p:{pt:"Escreva em ingles: Na minha opiniao, esta e a melhor opcao porque e mais barata.",en:"In my opinion, this is the best option because it is cheaper."}},
 {t:"Sentimentos",
  v:[["tired","cansado","I am tired today.","Eu estou cansado hoje."],["worried","preocupado","She is worried about it.","Ela esta preocupada com isso."],["excited","animado","We are excited about the trip.","Nos estamos animados com a viagem."],["bored","entediado","He was bored in the meeting.","Ele ficou entediado na reuniao."],["proud","orgulhoso","I am proud of my team.","Eu tenho orgulho do meu time."],["upset","chateado","The customer was upset.","O cliente ficou chateado."]],
  g:{t:"-ED x -ING nos adjetivos",e:"-ED descreve como VOCE esta: I am bored (eu estou entediado). -ING descreve como a COISA e: the meeting is boring (a reuniao e chata). Trocar isso gera a frase mais engraçada do ingles: 'I am boring' = eu sou chato.",
     ex:[["I am bored.","Eu estou entediado."],["The movie is boring.","O filme e chato."],["She is interested in the project.","Ela esta interessada no projeto."]]},
  d:[["I am ___ today.",["tired","tiring"],0,"Eu estou cansado hoje."],["This meeting is ___.",["boring","bored"],0,"Esta reuniao e chata."],["We are ___ about the trip.",["excited","exciting"],0,"Nos estamos animados com a viagem."],["The news was ___.",["surprising","surprised"],0,"A noticia foi surpreendente."]],
  p:{pt:"Escreva em ingles: Eu estou cansado, mas estou animado com o projeto.",en:"I am tired, but I am excited about the project."}}
]},
{n:8,nome:"Experiencias",desc:"Present perfect, phrasal verbs e o ingles que soa natural.",u:[
 {t:"Ja / nunca / ainda",
  v:[["ever","alguma vez","Have you ever been to the US?","Voce ja esteve nos EUA?"],["never","nunca","I have never seen that.","Eu nunca vi isso."],["already","ja","I have already sent it.","Eu ja enviei."],["yet","ainda","He hasn't answered yet.","Ele ainda nao respondeu."],["just","acabou de","She has just arrived.","Ela acabou de chegar."],["since","desde","I have worked here since 2020.","Eu trabalho aqui desde 2020."]],
  g:{t:"Present perfect (HAVE + participio)",e:"HAVE/HAS + verbo no participio (done, seen, been). Serve para experiencia de vida sem data (I have been to Chile) e para o que comecou antes e continua (I have worked here since 2020). Pense numa ponte: liga o passado ao agora. Se voce disser a data exata, a ponte cai e vira past simple.",
     ex:[["I have finished the report.","Eu terminei o relatorio."],["She has never seen it.","Ela nunca viu isso."],["Have you ever worked abroad?","Voce ja trabalhou fora?"]]},
  d:[["I ___ already sent the file.",["have","has"],0,"Eu ja enviei o arquivo."],["She ___ never seen it.",["has","have"],0,"Ela nunca viu isso."],["He hasn't answered ___.",["yet","already"],0,"Ele ainda nao respondeu."],["Have you ___ been to London?",["ever","never"],0,"Voce ja esteve em Londres?"]],
  p:{pt:"Escreva em ingles: Eu ja enviei o relatorio, mas ele ainda nao respondeu.",en:"I have already sent the report, but he hasn't answered yet."}},
 {t:"Phrasal verbs",
  v:[["look for","procurar","I am looking for my keys.","Eu estou procurando minhas chaves."],["give up","desistir","Don't give up now.","Nao desista agora."],["find out","descobrir","We found out yesterday.","Nos descobrimos ontem."],["come back","voltar","She comes back on Monday.","Ela volta na segunda."],["turn on","ligar (aparelho)","Turn on the light, please.","Acenda a luz, por favor."],["take care of","cuidar de","I take care of the reports.","Eu cuido dos relatorios."]],
  g:{t:"Phrasal verbs separaveis",e:"Verbo + preposicao forma um significado novo: look = olhar, mas look for = procurar. Alguns aceitam o objeto no meio: turn the light on = turn on the light. Mas se o objeto for pronome, ele SEMPRE fica no meio: turn it on (nunca 'turn on it').",
     ex:[["Turn on the TV. / Turn it on.","Ligue a TV. / Ligue ela."],["I am looking for my phone.","Estou procurando meu telefone."],["Don't give up.","Nao desista."]]},
  d:[["I am looking ___ my keys.",["for","at"],0,"Estou procurando minhas chaves."],["Turn ___ the light, please.",["on","in"],0,"Acenda a luz, por favor."],["Please turn ___ on.",["it","on it"],0,"Por favor, ligue ele."],["Don't give ___ now.",["up","out"],0,"Nao desista agora."]],
  p:{pt:"Escreva em ingles: Eu estou procurando o relatorio. Nao desista, nos vamos descobrir.",en:"I am looking for the report. Don't give up, we will find out."}},
 {t:"Vida e carreira",
  v:[["abroad","no exterior","She works abroad.","Ela trabalha no exterior."],["experience","experiencia","I have five years of experience.","Eu tenho cinco anos de experiencia."],["opportunity","oportunidade","This is a great opportunity.","Esta e uma grande oportunidade."],["challenge","desafio","It was a big challenge.","Foi um grande desafio."],["mistake","erro","I made a mistake.","Eu cometi um erro."],["achievement","conquista","That was my best achievement.","Essa foi minha maior conquista."]],
  g:{t:"Present perfect x past simple",e:"Se a frase traz quando aconteceu (yesterday, in 2019, last week), use past simple: I worked there in 2019. Se nao importa quando, ou ainda esta rolando, use present perfect: I have worked there. Regra pratica: apareceu data, ponte cai.",
     ex:[["I have worked here for five years.","Eu trabalho aqui ha cinco anos."],["I worked there in 2019.","Eu trabalhei la em 2019."],["Have you finished? / Did you finish yesterday?","Voce terminou? / Voce terminou ontem?"]]},
  d:[["I ___ there in 2019.",["worked","have worked"],0,"Eu trabalhei la em 2019."],["I ___ here for five years.",["have worked","worked"],0,"Eu trabalho aqui ha cinco anos."],["___ you finish it yesterday?",["Did","Have"],0,"Voce terminou isso ontem?"],["She ___ just arrived.",["has","did"],0,"Ela acabou de chegar."]],
  p:{pt:"Escreva em ingles: Eu trabalho aqui ha cinco anos e foi um grande desafio.",en:"I have worked here for five years and it was a big challenge."}}
]},
{n:9,nome:"Ingles de trabalho",desc:"Reunioes, negociacao e o vocabulario que separa o basico do fluente.",u:[
 {t:"Reunioes",
  v:[["to bring up","levantar (um assunto)","She brought up a good point.","Ela levantou um bom ponto."],["to follow up","dar seguimento","I will follow up tomorrow.","Eu darei seguimento amanha."],["to catch up","colocar em dia","Let's catch up on Friday.","Vamos nos atualizar na sexta."],["to run late","estar atrasado","I am running late.","Eu estou atrasado."],["to reach out","entrar em contato","I reached out to the client.","Eu entrei em contato com o cliente."],["update","atualizacao","Any update on the project?","Alguma novidade no projeto?"]],
  g:{t:"Primeiro condicional (IF + presente, WILL)",e:"Para consequencia real: If we finish today, we will send it tomorrow. Detalhe que derruba muita gente: depois do IF o verbo fica no PRESENTE, mesmo falando do futuro. Nunca 'if we will finish'.",
     ex:[["If we finish today, we will send it.","Se terminarmos hoje, nos enviaremos."],["If it rains, I will stay home.","Se chover, eu ficarei em casa."],["I will call you if I have time.","Eu te ligo se eu tiver tempo."]]},
  d:[["If we ___ today, we will send it.",["finish","will finish"],0,"Se terminarmos hoje, enviaremos."],["If it rains, I ___ stay home.",["will","would"],0,"Se chover, eu ficarei em casa."],["I will call you if I ___ time.",["have","will have"],0,"Eu te ligo se tiver tempo."],["Let's ___ up on Friday.",["catch","reach"],0,"Vamos nos atualizar na sexta."]],
  p:{pt:"Escreva em ingles: Se nos terminarmos hoje, eu entro em contato com o cliente amanha.",en:"If we finish today, I will reach out to the client tomorrow."}},
 {t:"Negociacao",
  v:[["offer","oferta","We made a good offer.","Nos fizemos uma boa oferta."],["discount","desconto","Can you give a discount?","Voce pode dar um desconto?"],["budget","orcamento","It is over our budget.","Esta acima do nosso orcamento."],["quote","cotacao / orcamento","Send me a quote, please.","Me envie uma cotacao, por favor."],["to approve","aprovar","The manager approved it.","O gerente aprovou."],["to deliver","entregar","We deliver on Friday.","Nos entregamos na sexta."]],
  g:{t:"Segundo condicional (IF + passado, WOULD)",e:"Para hipotese, situacao imaginada: If I had more time, I would study. Perceba a troca de degrau: o passado aqui nao fala de ontem, ele marca que aquilo e imaginacao. E o mesmo truque do nosso 'se eu tivesse'.",
     ex:[["If I had more time, I would study.","Se eu tivesse mais tempo, eu estudaria."],["If we had a bigger budget, we would hire.","Se tivessemos mais orcamento, contratariamos."],["What would you do?","O que voce faria?"]]},
  d:[["If I ___ more time, I would study.",["had","have"],0,"Se eu tivesse mais tempo, eu estudaria."],["If we had a budget, we ___ hire.",["would","will"],0,"Se tivessemos orcamento, contratariamos."],["Can you give us a ___?",["discount","budget"],0,"Voce pode nos dar um desconto?"],["It is over our ___.",["budget","offer"],0,"Esta acima do nosso orcamento."]],
  p:{pt:"Escreva em ingles: Se voces nos derem um desconto, nos aprovaremos a proposta hoje.",en:"If you give us a discount, we will approve the offer today."}},
 {t:"Conectar ideias",
  v:[["actually","na verdade","Actually, it is cheaper.","Na verdade, e mais barato."],["however","no entanto","However, we need time.","No entanto, precisamos de tempo."],["therefore","portanto","Therefore, we decided to wait.","Portanto, decidimos esperar."],["although","embora","Although it is late, let's start.","Embora seja tarde, vamos comecar."],["in fact","de fato","In fact, sales went up.","De fato, as vendas subiram."],["at least","pelo menos","At least we finished on time.","Pelo menos terminamos no prazo."]],
  g:{t:"Ordem da frase em ingles",e:"O ingles e rigido: Sujeito + Verbo + Objeto, e o sujeito nunca some. Em portugues dizemos 'esta chovendo' sem sujeito; em ingles tem que ter: IT is raining. Adverbios de frequencia ficam antes do verbo (I always work) mas depois do to be (I am always late).",
     ex:[["It is raining.","Esta chovendo."],["I always arrive early.","Eu sempre chego cedo."],["She is always busy.","Ela esta sempre ocupada."]]},
  d:[["___ is raining today.",["It","Is"],0,"Esta chovendo hoje."],["I ___ arrive early.",["always","am always"],0,"Eu sempre chego cedo."],["She ___ busy on Mondays.",["is always","always is"],0,"Ela esta sempre ocupada nas segundas."],["___, we need more time.",["However","Although"],0,"No entanto, precisamos de mais tempo."]],
  p:{pt:"Escreva em ingles: Na verdade, o preco e bom. No entanto, nos precisamos de mais tempo.",en:"Actually, the price is good. However, we need more time."}}
]}
];

<script>
/* ESTADO E MEMORIA */
const CHAVE='ingles30:progresso';
const CHAVE_IA='ingles30:credencial';
const CHAVE_SOM='ingles30:som';
const PADRAO={v:2,nivel:1,unidade:0,xp:0,streak:0,streakFreeze:0,ultimoDia:null,itens:{},sessoes:[],carimbos:{},prova:false,recado:"",tutorHist:[],voz:'',vel:0.95,conquistas:[]};
let E=JSON.parse(JSON.stringify(PADRAO));
let tela='painel',salvando=null;
let IA={chave:'',modelo:'claude-sonnet-5'};

const MEM={};
const Guarda={
  onde:'memoria',
  async ler(k){
    if(typeof window.storage!=='undefined'){try{const r=await window.storage.get(k);this.onde='claude';return r&&r.value?r.value:null;}catch(e){}}
    try{const v=localStorage.getItem(k);this.onde='navegador';return v;}catch(e){}
    return MEM[k]||null;
  },
  async gravar(k,v){
    MEM[k]=v;
    if(typeof window.storage!=='undefined'){try{await window.storage.set(k,v);return true;}catch(e){return false;}}
    try{localStorage.setItem(k,v);return true;}catch(e){}
    return false;
  }
};

async function carregar(){
  const bruto=await Guarda.ler(CHAVE);
  if(bruto){try{E=Object.assign(JSON.parse(JSON.stringify(PADRAO)),migrar(JSON.parse(bruto)));}catch(e){}}
  const cred=await Guarda.ler(CHAVE_IA);
  if(cred){try{IA=Object.assign(IA,JSON.parse(cred));}catch(e){}}
  const som=await Guarda.ler(CHAVE_SOM);
  if(som){try{configSom=Object.assign(configSom,JSON.parse(som));}catch(e){}}
}
function migrar(p){if(!p||typeof p!=='object')return p;if(p.v===2)return p;return Object.assign({},p,{v:2,conquistas:p.conquistas||[],streakFreeze:p.streakFreeze||0});}
function salvar(){clearTimeout(salvando);salvando=setTimeout(()=>Guarda.gravar(CHAVE,JSON.stringify(E)),400);}
function salvarSom(){Guarda.gravar(CHAVE_SOM,JSON.stringify(configSom));}
function temIA(){return !!IA.chave||typeof window.storage!=='undefined';}

const $=s=>document.querySelector(s);
const hoje=()=>new Date().toISOString().slice(0,10);
const embaralhar=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[.,!?;:'"()]/g,'').replace(/\s+/g,' ').trim();
function dist(a,b){const m=[];for(let i=0;i<=b.length;i++){m[i]=[i];for(let j=0;j<=a.length;j++){if(i===0)m[0][j]=j;else m[i][j]=b[i-1]===a[j-1]?m[i-1][j-1]:Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);}}return m[b.length][a.length];}
function nivelObj(n){return CURSO[Math.min(n,CURSO.length)-1];}
function unidadeAtual(){return nivelObj(E.nivel).u[Math.min(E.unidade,2)];}
function segundaDaSemana(d){const x=new Date(d);const dia=(x.getDay()+6)%7;x.setDate(x.getDate()-dia);return x.toISOString().slice(0,10);}

function vozesEN(){if(!('speechSynthesis' in window))return [];return speechSynthesis.getVoices().filter(v=>v.lang&&/^en/i.test(v.lang));}
function notaVoz(v){const n=(v.name||'')+' '+(v.voiceURI||'');let p=0;if(/natural|neural|premium|enhanced|online/i.test(n))p+=6;if(/google/i.test(n))p+=4;if(/samantha|ava|siri|aria|jenny|allison|nicky/i.test(n))p+=3;if(/^en-US/i.test(v.lang))p+=2;else if(/^en-GB/i.test(v.lang))p+=1;if(/compact|espeak|david|zira|mark/i.test(n))p-=3;return p;}
function melhorVoz(){const vs=vozesEN();if(!vs.length)return null;if(E.voz){const m=vs.find(v=>v.voiceURI===E.voz);if(m)return m;}return vs.slice().sort((a,b)=>notaVoz(b)-notaVoz(a))[0];}
let filaVoz=null;
function falar(txt,taxa){initAudio();if(!('speechSynthesis' in window))return;clearTimeout(filaVoz);speechSynthesis.cancel();filaVoz=setTimeout(()=>{const u=new SpeechSynthesisUtterance(String(txt).replace(/\s+/g,' ').trim());const v=melhorVoz();if(v){u.voice=v;u.lang=v.lang;}else{u.lang='en-US';}u.rate=taxa||E.vel||0.95;speechSynthesis.speak(u);},60);}
if('speechSynthesis' in window){speechSynthesis.getVoices();setTimeout(()=>speechSynthesis.getVoices(),300);}

function novoItem(){return {reps:0,lapsos:0,estabilidade:1,dificuldade:5,intervalo:1,due:Date.now()};}
function agendar(it,acertou){it.reps++;if(!acertou){it.lapsos++;it.estabilidade=Math.max(.5,it.estabilidade*.5);it.intervalo=1;}else{it.dificuldade=Math.max(1,it.dificuldade-.1);it.estabilidade*=1+(10-it.dificuldade)/20;it.intervalo=Math.max(1,Math.round(it.estabilidade));}it.due=Date.now()+it.intervalo*864e5;return it;}
function registrar(chave,acertou){let it=E.itens[chave];if(!it)it=novoItem();E.itens[chave]=agendar(it,!!acertou);salvar();}
function devidos(){const agora=Date.now();return Object.keys(E.itens).filter(k=>E.itens[k].due<=agora).sort((a,b)=>E.itens[a].due-E.itens[b].due);}
function palavrasAprendidas(){return Object.values(E.itens).filter(it=>it.reps>=3&&it.lapsos<it.reps/2).length;}
function taxaAcerto(){const t=Object.values(E.itens);if(!t.length)return 0;const tot=t.reduce((a,it)=>a+it.reps,0),err=t.reduce((a,it)=>a+it.lapsos,0);return tot?Math.round((1-err/tot)*100):0;}
function itemPorChave(k){const p=k.split('.');const niv=CURSO[+p[0]-1];if(!niv)return null;const un=niv.u[+p[1]];if(!un)return null;if(p[2][0]==='g'){const d=un.d[+p[2].slice(1)];return d?{tipo:'g',d,un,niv}:null;}const v=un.v[+p[2]];return v?{tipo:'v',v,un,niv}:null;}
function dominio(nivel){let tot=0,bons=0;CURSO[nivel-1].u.forEach((u,ui)=>u.v.forEach((v,vi)=>{tot++;const it=E.itens[nivel+'.'+ui+'.'+vi];if(it&&it.reps>=2&&it.lapsos<it.reps)bons++;}));return tot?bons/tot:0;}

const CONQUISTAS=[
  {id:'primeiro',nome:'Primeiro passo',ico:'1',cond:()=>E.sessoes.length>=1},
  {id:'semana',nome:'5 dias',ico:'5',cond:()=>E.streak>=5},
  {id:'quinzena',nome:'14 dias',ico:'14',cond:()=>E.streak>=14},
  {id:'mes',nome:'30 dias',ico:'30',cond:()=>E.streak>=30},
  {id:'xp100',nome:'100 XP',ico:'100',cond:()=>E.xp>=100},
  {id:'xp500',nome:'500 XP',ico:'500',cond:()=>E.xp>=500},
  {id:'xp2000',nome:'2.000 XP',ico:'2k',cond:()=>E.xp>=2000},
  {id:'nivel3',nome:'Nivel 3',ico:'N3',cond:()=>E.nivel>=3},
  {id:'nivel6',nome:'Nivel 6',ico:'N6',cond:()=>E.nivel>=6},
  {id:'nivel9',nome:'Nivel 9',ico:'N9',cond:()=>E.nivel>=9},
  {id:'carimbo',nome:'Carimbo',ico:'OK',cond:()=>Object.keys(E.carimbos).length>=1},
  {id:'conversa',nome:'Tutor',ico:'AI',cond:()=>E.tutorHist.filter(m=>m.role==='user').length>=1}
];
function verificarConquistas(){const antes=E.conquistas.length;CONQUISTAS.forEach(c=>{if(!E.conquistas.includes(c.id)&&c.cond()){E.conquistas.push(c.id);setTimeout(()=>{somConquista();soltarConfete();toast('Conquista: '+c.nome);},100);}});if(antes!==E.conquistas.length)salvar();}
function toast(msg){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3000);}

function distratores(certo,fonte,n){const pool=embaralhar(fonte.filter(x=>x!==certo)).slice(0,n);return embaralhar(pool.concat([certo]));}
function todasTrad(){const r=[];CURSO.forEach(n=>n.u.forEach(u=>u.v.forEach(v=>r.push(v[1]))));return r;}
function todasPal(){const r=[];CURSO.forEach(n=>n.u.forEach(u=>u.v.forEach(v=>r.push(v[0]))));return r;}

function exVocab(c,v,modo){if(modo==='pt2en'){const ops=distratores(v[0],todasPal(),3);return {t:'mc',chave:c,pergunta:v[1],rotulo:'Como se diz em ingles?',opcoes:ops,correta:ops.indexOf(v[0]),som:v[0],exemplo:v[2],exemploPt:v[3]};}if(modo==='en2pt'){const ops=distratores(v[1],todasTrad(),3);return {t:'mc',chave:c,pergunta:v[0],en:true,rotulo:'O que significa?',opcoes:ops,correta:ops.indexOf(v[1]),som:v[0],exemplo:v[2],exemploPt:v[3]};}return {t:'digitar',chave:c,pergunta:v[1],rotulo:'Escreva em ingles',resposta:v[0],som:v[0],exemplo:v[2],exemploPt:v[3]};}
function exOuvir(c,v){const ops=distratores(v[1],todasTrad(),3);return {t:'ouvir',chave:c,frase:v[2],fraseTrad:v[3],rotulo:'Ouca e escolha',opcoes:ops,correta:ops.indexOf(v[1]),som:v[2],dica:v[0]};}
function exGram(c,d){return {t:'mc',chave:c,pergunta:d[0],en:true,rotulo:'Complete a frase',opcoes:d[1].slice(),correta:d[2],traducao:d[3],som:d[0].replace('___',d[1][d[2]])};}
function exOrd(c,f,t){return {t:'ordenar',chave:c,frase:f,traducao:t,rotulo:'Monte a frase',som:f};}

let S=null;
function exRevisao(max){const dv=devidos().slice(0,max),out=[];dv.forEach(k=>{const it=itemPorChave(k);if(!it)return;if(it.tipo==='v')out.push(exVocab(k,it.v,Math.random()<.5?'pt2en':'en2pt'));else out.push(exGram(k,it.d));});return out;}
function montarSessao(){const niv=E.nivel,ui=Math.min(E.unidade,2),un=nivelObj(niv).u[ui];const cv=i=>niv+'.'+ui+'.'+i,cg=i=>niv+'.'+ui+'.g'+i;let rev=exRevisao(8);if(rev.length<4){const extras=[];nivelObj(niv).u.forEach((u,x)=>{if(x<ui)u.v.forEach((v,i)=>extras.push(exVocab(niv+'.'+x+'.'+i,v,'en2pt')));});rev=rev.concat(embaralhar(extras).slice(0,4-rev.length));}
const vocab=[];un.v.forEach((v,i)=>vocab.push({t:'ensinar',chave:cv(i),v}));un.v.forEach((v,i)=>vocab.push(exVocab(cv(i),v,'pt2en')));embaralhar(un.v.map((v,i)=>[v,i])).slice(0,4).forEach(p=>vocab.push(exVocab(cv(p[1]),p[0],'en2pt')));embaralhar(un.v.map((v,i)=>[v,i])).slice(0,3).forEach(p=>vocab.push(exVocab(cv(p[1]),p[0],'digitar')));
const gram=[{t:'regra',g:un.g}];un.d.forEach((d,i)=>gram.push(exGram(cg(i),d)));un.g.ex.slice(0,2).forEach((e,i)=>gram.push(exOrd(cg(i),e[0],e[1])));
const esc=embaralhar(un.v.map((v,i)=>[v,i])).slice(0,4).map(p=>exOuvir(cv(p[1]),p[0]));
const prod=[{t:'escrever',pt:un.p.pt,en:un.p.en,chave:niv+'.'+ui+'.p'}];
S={niv,ui,inicio:Date.now(),acertos:0,total:0,xp:0,blocos:[{nome:'Aquecimento',min:5,ex:rev.length?rev:[{t:'aviso',txt:'Primeira sessao - nada para revisar.'}]},{nome:'Vocabulario',min:8,ex:vocab},{nome:'Gramatica',min:7,ex:gram},{nome:'Escuta',min:5,ex:esc},{nome:'Producao',min:5,ex:prod}],b:0,i:0,resposta:null};}
function exAtual(){return S.blocos[S.b].ex[S.i];}
function avancar(){S.i++;if(S.i>=S.blocos[S.b].ex.length){S.b++;S.i=0;}if(S.b>=S.blocos.length){if(S.prova)finalizarProva();else if(S.revisao)finalizarRevisao();else finalizarSessao();return;}S.resposta=null;render();}
function pontuar(ok,chave){S.total++;if(ok){S.acertos++;S.xp+=10;E.xp+=10;}if(chave)registrar(chave,ok);salvar();}

function finalizarSessao(){const min=Math.round((Date.now()-S.inicio)/60000);const prec=S.total?S.acertos/S.total:0;E.sessoes.push({d:hoje(),min,xp:S.xp,ac:S.acertos,tot:S.total,niv:S.niv,un:S.ui});const ontem=new Date(Date.now()-864e5).toISOString().slice(0,10);if(E.ultimoDia!==hoje()){if(E.ultimoDia===ontem)E.streak++;else if(E.streakFreeze>0){E.streakFreeze--;E.streak++;toast('Freeze usado');}else E.streak=1;E.ultimoDia=hoje();}
let rec='';if(prec>=0.7){if(E.unidade<2){E.unidade++;rec='Unidade '+Math.round(prec*100)+'%. Proxima liberada!';}else{E.prova=true;rec='Unidades fechadas! Teste liberado.';}}else rec='Voce fez '+Math.round(prec*100)+'%. Repetir e normal.';
E.recado=rec;salvar();S.fim={min,prec,recado:rec};if(prec>=0.7){somNivel();setTimeout(soltarConfete,200);}render();verificarConquistas();}

function finalizarRevisao(){const min=Math.round((Date.now()-S.inicio)/60000);const prec=S.total?S.acertos/S.total:0;E.sessoes.push({d:hoje(),min,xp:S.xp,ac:S.acertos,tot:S.total,niv:E.nivel,un:E.unidade,rev:1});const ontem=new Date(Date.now()-864e5).toISOString().slice(0,10);if(E.ultimoDia!==hoje()){E.streak=(E.ultimoDia===ontem)?E.streak+1:(E.streakFreeze>0?function(){E.streakFreeze--;return E.streak+1;}():1);E.ultimoDia=hoje();}E.recado='Revisao: '+Math.round(prec*100)+'%';salvar();S.fim={min,prec,recado:E.recado};render();}

function montarProva(){const niv=E.nivel,itens=[];nivelObj(niv).u.forEach((u,ui)=>{u.v.forEach((v,i)=>itens.push(exVocab(niv+'.'+ui+'.'+i,v,Math.random()<.5?'pt2en':'en2pt')));u.d.forEach((d,i)=>itens.push(exGram(niv+'.'+ui+'.g'+i,d)));});S={prova:true,niv,inicio:Date.now(),acertos:0,total:0,xp:0,blocos:[{nome:'Teste',min:12,ex:embaralhar(itens).slice(0,16)}],b:0,i:0,resposta:null};}
function finalizarProva(){const prec=S.total?S.acertos/S.total:0;if(prec>=0.8){E.carimbos[E.nivel]={d:hoje(),p:Math.round(prec*100)};E.xp+=200;if(E.nivel<CURSO.length){E.nivel++;E.unidade=0;E.prova=false;E.recado='Aprovado! Nivel '+E.nivel;}else{E.prova=false;E.recado='Curso completo! Parabens.';}setTimeout(()=>{somNivel();soltarConfete();},100);}else{let pior=0,piorTaxa=2;nivelObj(E.nivel).u.forEach((u,ui)=>{let a=0,t=0;u.v.forEach((v,i)=>{const it=E.itens[E.nivel+'.'+ui+'.'+i];if(it){a+=it.reps;t+=it.reps+it.lapsos;}});const tx=t?a/t:0;if(tx<piorTaxa){piorTaxa=tx;pior=ui;}});E.unidade=pior;E.prova=false;E.recado='Voce fez '+Math.round(prec*100)+'%. Tente de novo.';}salvar();S.fim={prec,prova:true,recado:E.recado};render();verificarConquistas();}

async function chamarIA(m,s){const cab={"Content-Type":"application/json"};let modelo="claude-sonnet-4-6";if(IA.chave){cab["x-api-key"]=IA.chave;cab["anthropic-version"]="2023-06-01";cab["anthropic-dangerous-direct-browser-access"]="true";modelo=IA.modelo||"claude-sonnet-5";}else if(typeof window.storage==='undefined')throw new Error("sem-credencial");const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:cab,body:JSON.stringify({model:modelo,max_tokens:1000,system:s,messages:m})});if(!r.ok){const t=await r.text();throw new Error(t.slice(0,200));}const d=await r.json();return d.content.filter(c=>c.type==="text").map(c=>c.text).join("\n").trim();}
function sistemaTutor(){const niv=nivelObj(E.nivel),un=unidadeAtual();return "Tutor de ingles do Victor, brasileiro, nivel "+E.nivel+" de 9 (tema: "+niv.nome+" - '"+un.t+"'). Converse EM INGLES bem simples. Responda no formato:\nEN: <resposta em ingles, max 2 frases, terminando com pergunta>\nPT: <traducao>\nSe houver erro de ingles, comece PT com [correcao: '...' -> '...']";}
async function enviarTutor(){const cx=$('#tutorTexto');const txt=cx.value.trim();if(!txt)return;initAudio();E.tutorHist.push({role:"user",content:txt});cx.value='';salvar();tutorPensando=true;render();try{const resp=await chamarIA(E.tutorHist.slice(-16),sistemaTutor());E.tutorHist.push({role:"assistant",content:resp});}catch(e){E.tutorHist.push({role:"assistant",content:"EN: (offline)\nPT: "+(String(e.message||'').indexOf('sem-credencial')>-1?'Falta a chave da API.':'Tutor offline.')});}if(E.tutorHist.length>40)E.tutorHist=E.tutorHist.slice(-40);tutorPensando=false;salvar();render();verificarConquistas();setTimeout(()=>{const c=$('#fimConversa');if(c)c.scrollIntoView({block:'end'});},60);}
let tutorPensando=false;
async function corrigirComTutor(pt,en,minha){const cx=$('#retornoIA');if(cx)cx.innerHTML='<span class="escrevendo">Conferindo...</span>';try{const r=await chamarIA([{role:"user",content:"Pedido: "+pt+"\nEsperado: "+en+"\nAluno: "+minha+"\n\nCorrija em portugues, max 3 linhas."}],"Professor corrigindo aluno iniciante.");if(cx)cx.innerHTML='<div class="retorno ok"><span class="t">Tutor</span>'+esc(r).replace(/\n/g,'<br>')+'</div>';}catch(e){if(cx)cx.innerHTML='<div class="retorno nao">Tutor offline.</div>';}}

if(E.recado)h+='<div class="carta destaque"><div class="rotulo">Recado</div><div style="margin-top:8px;font-size:14.5px;line-height:1.5">'+esc(E.recado)+'</div><button class="btn secundario pequeno" style="margin-top:10px" onclick="limparRecado()">Beleza</button></div>';
h+='<div class="carta destaque"><div class="carta-topo"><div><div class="rotulo" style="color:var(--roxo2)">'+(E.prova?'Prova liberada':'Proxima sessao - 30 min')+'</div><h2 style="margin-top:8px">'+esc(E.prova?('Teste nivel '+E.nivel):un.t)+'</h2><div class="pt" style="margin-top:6px">'+esc(E.prova?'16 questoes - 80% para passar':'Nivel '+E.nivel+' - U'+(E.unidade+1)+' de 3 - '+un.g.t)+'</div></div></div><button class="btn '+(E.prova?'laranja':'verde')+'" onclick="'+(E.prova?'comecarProva()':'comecarSessao()')+'">'+(E.prova?'Fazer o teste':'Comecar sessao')+'</button></div>';

const conquistadas=CONQUISTAS.map(c=>({...c,tem:E.conquistas.includes(c.id)}));
h+='<div class="carta"><div class="carta-topo"><div class="rotulo">Conquistas</div><span class="dado">'+E.conquistas.length+'/'+CONQUISTAS.length+'</span></div><div class="grid-conquistas">'+conquistadas.map(c=>'<div class="conquista '+(c.tem?'desb':'bloq')+'" title="'+esc(c.nome)+'"><div class="ico">'+(c.tem?c.ico:'X')+'</div><div class="nm">'+esc(c.nome)+'</div></div>').join('')+'</div></div>';
const tot=E.sessoes.length,min=E.sessoes.reduce((a,s)=>a+s.min,0);

function comecarSessao(){initAudio();montarSessao();tela='sessao';window.scrollTo(0,0);render();}

function comecarRevisao(){initAudio();let ex=exRevisao(14);if(!ex.length)ex=[{t:'aviso',txt:'Nada vencido hoje.'}];S={niv:E.nivel,ui:E.unidade,revisao:true,inicio:Date.now(),acertos:0,total:0,xp:0,blocos:[{nome:'Revisao',min:10,ex}],b:0,i:0,resposta:null};tela='sessao';window.scrollTo(0,0);render();}

function telaSessao(){if(!S)return '<div class="carta">Nenhuma sessao aberta.<button class="btn secundario pequeno" style="margin-top:10px" onclick="ir(\'painel\')">Voltar</button></div>';if(S.fim)return telaFimSessao();const b=S.blocos[S.b],ex=exAtual();const dec=Math.floor((Date.now()-S.inicio)/1000);const mm=String(Math.floor(dec/60)).padStart(2,'0'),ss=String(dec%60).padStart(2,'0');const alvo=S.prova?12:30;
let h='<div class="sessao-topo"><div><div class="rotulo">'+esc(b.nome)+(S.prova?'':' - '+b.min+' min')+'</div><div class="dado" style="font-size:12px;color:var(--texto2);margin-top:3px">'+(S.i+1)+' / '+b.ex.length+'</div></div><div class="cronometro'+(dec>alvo*60?' estourou':'')+'">'+mm+':'+ss+'</div></div>';

function corpoEx(ex){if(!ex)return '';const r=S.resposta;

if(ex.t==='regra')return '<div class="rotulo">Gramatica</div><h2 style="margin:8px 0 12px">'+esc(ex.g.t)+'</h2><div style="font-size:15px;line-height:1.55">'+esc(ex.g.e)+'</div><div style="margin-top:14px">'+ex.g.ex.map(e=>'<div style="padding:10px 0;border-top:1px solid rgba(255,255,255,.08)"><div style="font-size:15.5px">'+esc(e[0])+'</div><div class="pt">'+esc(e[1])+'</div></div>').join('')+'</div><button class="btn" style="margin-top:8px" onclick="avancar()">Entendi</button>';
if(ex.t==='mc'){let h='<div class="rotulo">'+esc(ex.rotulo)+'</div><div class="pergunta'+(ex.en?' en':'')+'">'+esc(ex.pergunta)+'</div>';if(ex.traducao)h+='<div class="pt">'+esc(ex.traducao)+'</div>';h+='<div class="opcoes">'+ex.opcoes.map((o,i)=>{let cl='opc';if(r!==null){if(i===ex.correta)cl+=r.i===i?' certa':' revelada';else if(r.i===i)cl+=' errada';}return '<button class="'+cl+'" '+(r!==null?'disabled':'')+' onclick="responderMC('+i+')">'+esc(o)+'</button>';}).join('')+'</div>';if(r!==null){h+='<div class="retorno '+(r.ok?'ok':'nao')+'"><span class="t">'+(r.ok?'Certo!':'Quase')+'</span>'+(ex.exemplo?esc(ex.exemplo)+'<div class="pt" style="margin-top:4px">'+esc(ex.exemploPt)+'</div>':(ex.traducao?esc(ex.opcoes[ex.correta]):''))+(r.ok?'':'<div style="margin-top:6px">Resposta: <b>'+esc(ex.opcoes[ex.correta])+'</b></div>')+'</div>';h+='<button class="btn" style="margin-top:12px" onclick="avancar()">Continuar</button>';}return h;}
