return '';}
function contarUso(ex,p,i){let u=ex.montada.filter(x=>x===p).length;let a=ex.chips.slice(0,i).filter(x=>x===p).length;return a<u;}
function porChip(i){const ex=exAtual();if(S.resposta!==null)return;const p=ex.chips[i];if(contarUso(ex,p,i))return;ex.montada.push(p);render();}
function tirarChip(i){const ex=exAtual();if(S.resposta!==null)return;ex.montada.splice(i,1);render();}
function responderMC(i){initAudio();const ex=exAtual();if(S.resposta!==null)return;const ok=i===ex.correta;S.resposta={i,ok,perfeito:ok};if(ok)somAcerto(true);else somErro();pontuar(ok,ex.chave);if(ex.som&&ok)falar(ex.som);render();}
function responderDigitar(){initAudio();const ex=exAtual();const v=$('#campoResp').value.trim();if(!v)return;const d=dist(norm(v),norm(ex.resposta));const ok=d<=1,quase=ok&&d===1;S.resposta={txt:v,ok,quase,perfeito:ok&&d===0};if(ok&&d===0)somAcerto(true);else if(ok)somAcerto(false);else somErro();pontuar(ok,ex.chave);if(ok)falar(ex.resposta);render();}
function responderOrdenar(){initAudio();const ex=exAtual();const ok=norm(ex.montada.join(' '))===norm(ex.frase);S.resposta={ok,perfeito:ok};if(ok)somAcerto(true);else somErro();pontuar(ok,ex.chave);if(ok)falar(ex.frase);render();}
function responderEscrever(){initAudio();const ex=exAtual();const v=$('#campoResp').value.trim();if(!v)return;const a=norm(v).split(' '),b=norm(ex.en).split(' ');const iguais=b.filter(w=>a.indexOf(w)>-1).length;const ok=iguais/b.length>=0.75;S.resposta={txt:v,ok};if(ok)somAcerto(false);else somErro();pontuar(ok,ex.chave);render();}
function telaFimSessao(){const f=S.fim,prec=Math.round(f.prec*100);let h='<div class="carta destaque" style="text-align:center;padding:26px 16px"><div class="rotulo">'+(f.prova?'Teste':'Sessao')+'</div><div class="dado" style="font-size:54px;line-height:1.1;margin:10px 0;color:var(--verde2)">'+prec+'%</div><div class="pt">'+S.acertos+'/'+S.total+(f.min?' - '+f.min+'min':'')+' - +'+S.xp+' XP</div></div>';h+='<div class="carta"><div class="rotulo">O que muda</div><div style="margin-top:8px;font-size:14.5px;line-height:1.5">'+esc(f.recado||E.recado)+'</div></div>';h+='<button class="btn verde" onclick="ir(\'painel\')">Painel</button>';if(!f.prova)h+='<button class="btn laranja" style="margin-top:10px" onclick="ir(\'tutor\')">Conversar com tutor</button>';return h;}

function telaPassaporte(){let h='<h1>Mapa</h1><div class="pt" style="margin-bottom:14px">9 niveis. Um carimbo cada. Voce consegue.</div>';
h+='<div class="estampas">'+CURSO.map(n=>{const c=E.carimbos[n.n],atual=n.n===E.nivel,travado=n.n>E.nivel;return '<div class="estampa '+(c?'carimbada ':'')+(atual?'atual ':'')+(travado?'travada':'')+'"><div><div class="num">NIVEL '+n.n+'</div><div class="tit">'+esc(n.nome)+'</div></div><div class="pt" style="font-size:12px;line-height:1.3">'+esc(n.desc)+'</div>'+(c?'<div class="carimbo">OK '+c.d.split('-').reverse().slice(0,2).join('/')+' - '+c.p+'%</div>':'')+'</div>';}).join('')+'</div>';
const ult=E.sessoes.slice(-10).reverse();h+='<div class="carta" style="margin-top:14px"><div class="rotulo">Ultimas sessoes</div>'+(ult.length?ult.map(s=>'<div style="display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,.06);align-items:center"><span class="dado" style="font-size:11.5px">'+s.d.split('-').reverse().join('/')+'</span><span style="font-size:13px;font-weight:600">N'+s.niv+'-U'+(s.un+1)+'</span><span class="dado" style="font-size:11.5px;color:var(--verde2)">'+Math.round(s.ac/Math.max(s.tot,1)*100)+'% - '+s.min+'min</span></div>').join(''):'<div class="pt" style="margin-top:8px">Nenhuma sessao ainda. Bora?</div>')+'</div>';
h+='<div class="carta"><div class="rotulo">Streak freeze</div><div style="margin-top:8px;font-size:14.5px">Voce tem <b style="color:var(--azul2)">'+E.streakFreeze+'</b> '+(E.streakFreeze===1?'freeze':'freezes')+'.</div><div class="pt" style="margin-top:5px">Cada 7 dias seguidos = 1 freeze novo.</div><button class="btn secundario pequeno" style="margin-top:12px" onclick="ganharFreeze()">+1 freeze (100 XP)</button></div>';
h+='<div class="carta"><div class="rotulo">Sons e vibracao</div><div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;padding:6px 0"><div><div style="font-weight:600">Sons do app</div><div class="pt" style="font-size:12.5px">Acertou, errou, conquistas...</div></div><button class="btn '+(configSom.ligado?'verde':'secundario')+' pequeno" onclick="toggleSom()">'+(configSom.ligado?'ON':'OFF')+'</button></div><div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.06)"><div><div style="font-weight:600">Vibrar</div><div class="pt" style="font-size:12.5px">Celular vibra ao acertar</div></div><button class="btn '+(configSom.vibrar?'verde':'secundario')+' pequeno" onclick="toggleVibrar()">'+(configSom.vibrar?'SIM':'NAO')+'</button></div><div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.06)"><div><div style="font-weight:600">Toque nos botoes</div><div class="pt" style="font-size:12.5px">Clique suave ao tocar</div></div><button class="btn '+(configSom.toque?'verde':'secundario')+' pequeno" onclick="toggleToque()">'+(configSom.toque?'SIM':'NAO')+'</button></div><button class="btn secundario pequeno" style="margin-top:12px" onclick="testarSons()">Testar todos os sons</button></div>';
const onde={claude:'Claude',navegador:'navegador'}[Guarda.onde]||'navegador';
h+='<div class="carta"><div class="rotulo">Memoria</div><div style="margin-top:8px;font-size:14px">Salvando em <b>'+onde+'</b>.</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn secundario pequeno" onclick="exportar()">Backup</button><button class="btn secundario pequeno" onclick="document.getElementById(\'arqBackup\').click()">Restaurar</button></div><input type="file" id="arqBackup" accept="application/json" class="oculto" onchange="importar(event)"><div id="statusBackup"></div></div>';
const vs=vozesEN().slice().sort((a,b)=>notaVoz(b)-notaVoz(a));const atual=melhorVoz();
h+='<div class="carta"><div class="rotulo">Voz</div>'+(vs.length?'<select class="campo" style="margin-top:10px" onchange="trocarVoz(this.value)">'+vs.map(v=>'<option value="'+esc(v.voiceURI)+'" '+(atual&&v.voiceURI===atual.voiceURI?'selected':'')+'>'+esc(v.name)+' - '+esc(v.lang)+(notaVoz(v)>=6?' [bom]':'')+'</option>').join('')+'</select><div class="rotulo" style="margin-top:14px">Velocidade: '+(E.vel||0.95).toFixed(2)+'x</div><input type="range" min="0.6" max="1.15" step="0.05" value="'+(E.vel||0.95)+'" style="width:100%;margin-top:6px" oninput="trocarVel(this.value)"><button class="btn azul pequeno" style="margin-top:10px" onclick="falar(\'Good morning. My name is Victor.\')">Testar</button>':'<div class="pt" style="margin-top:8px">Nenhuma voz em ingles.</div>')+'</div>';
h+='<div class="carta"><div class="rotulo">Tutor IA</div><div class="pt" style="margin-top:6px">Precisa de chave Anthropic. Fica so no seu celular.</div><input class="campo" id="campoChave" type="password" style="margin-top:10px" placeholder="sk-ant-..." value="'+esc(IA.chave)+'" autocomplete="off"><input class="campo" id="campoModelo" style="margin-top:6px" placeholder="claude-sonnet-5" value="'+esc(IA.modelo)+'" autocomplete="off"><div style="display:flex;gap:8px;margin-top:10px"><button class="btn secundario pequeno" onclick="salvarCred()">Salvar</button><button class="btn secundario pequeno" onclick="testarIA()">Testar</button></div><div id="statusIA"></div></div>';
h+='<div class="carta"><button class="btn secundario" onclick="zerar()">Apagar tudo</button></div>';return h;}
function toggleSom(){configSom.ligado=!configSom.ligado;salvarSom();render();if(configSom.ligado)somAcerto(true);}
function toggleVibrar(){configSom.vibrar=!configSom.vibrar;salvarSom();render();if(configSom.vibrar&&navigator.vibrate)navigator.vibrate(50);}
function toggleToque(){configSom.toque=!configSom.toque;salvarSom();render();if(configSom.toque)tocarToque();}
function testarSons(){initAudio();toast('Tocando sons...',1500);setTimeout(()=>somAcerto(true),300);setTimeout(()=>somErro(),900);setTimeout(()=>somNivel(),1500);setTimeout(()=>soltarConfete(),2200);}
function ganharFreeze(){initAudio();if(E.xp<100){toast('Precisa 100 XP. Tem '+E.xp+'.');return;}if(!window.confirm('Trocar 100 XP por 1 freeze?'))return;E.xp-=100;E.streakFreeze++;salvar();render();tocarToque();toast('+1 freeze!');}
function trocarVoz(uri){E.voz=uri;salvar();falar('New voice.');render();}
function trocarVel(v){E.vel=parseFloat(v);salvar();clearTimeout(window.tv);window.tv=setTimeout(()=>{falar('Nice to meet you.');render();},500);}
function exportar(){const b=new Blob([JSON.stringify({app:'ingles30',data:hoje(),progresso:E},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ingles30-'+hoje()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);const st=$('#statusBackup');if(st)st.innerHTML='<div class="retorno ok">Backup baixado!</div>';}
function importar(ev){const f=ev.target.files[0];if(!f)return;const l=new FileReader();l.onload=()=>{try{const p=JSON.parse(l.result);const dados=p.progresso||p;if(!dados||typeof dados.nivel!=='number')throw new Error();E=Object.assign(JSON.parse(JSON.stringify(PADRAO)),migrar(dados));salvar();render();const st=$('#statusBackup');if(st)st.innerHTML='<div class="retorno ok">Restaurado!</div>';}catch(e){const st=$('#statusBackup');if(st)st.innerHTML='<div class="retorno nao">Arquivo invalido.</div>';}};l.readAsText(f);}
async function salvarCred(){IA.chave=$('#campoChave').value.trim();IA.modelo=($('#campoModelo').value.trim())||'claude-sonnet-5';await Guarda.gravar(CHAVE_IA,JSON.stringify(IA));$('#statusIA').innerHTML='<div class="retorno ok">Chave salva!</div>';}
async function testarIA(){const st=$('#statusIA');if(st)st.innerHTML='<span class="escrevendo">Testando...</span>';await salvarCred();try{const r=await chamarIA([{role:'user',content:'Say OK.'}],'One word.');if(st)st.innerHTML='<div class="retorno ok">Conectado!</div>';}catch(e){const msg=String(e.message||'').indexOf('sem-credencial')>-1?'Falta a chave.':'Erro: '+esc(String(e.message).slice(0,140));if(st)st.innerHTML='<div class="retorno nao">'+msg+'</div>';}}
async function zerar(){if(!window.confirm('Apagar tudo?'))return;E=JSON.parse(JSON.stringify(PADRAO));await Guarda.gravar(CHAVE,JSON.stringify(E));tela='painel';render();}

function telaTutor(){const un=unidadeAtual();let h='<h1>Tutor IA</h1><div class="pt" style="margin-bottom:12px">Conversa em ingles no seu nivel. Ele corrige embaixo.</div>';if(!temIA())h+='<div class="carta"><div class="rotulo">Falta chave</div><div style="margin-top:6px;font-size:13.5px">Configure no Mapa.</div><button class="btn secundario pequeno" style="margin-top:10px" onclick="ir(\'passaporte\')">Configurar</button></div>';
if(!E.tutorHist.length){h+='<div class="carta"><div class="rotulo">Sugestoes</div>'+['Hi! My name is Victor.','How are you today?','I work with car glass.','Can you help me practice '+un.g.t+'?'].map(s=>'<button class="btn secundario pequeno" style="margin:6px 6px 0 0" onclick="sugerir(\''+s.replace(/'/g,"\\'")+'\')">'+esc(s)+'</button>').join('')+'</div>';}
h+='<div class="conversa">'+E.tutorHist.map(m=>{if(m.role==='user')return '<div class="bolha eu">'+esc(m.content)+'</div>';const en=(m.content.match(/EN:\s*([\s\S]*?)(?=\nPT:|$)/)||[,m.content])[1].trim();const pt=(m.content.match(/PT:\s*([\s\S]*)/)||[,''])[1].trim();return '<div class="bolha ia">'+esc(en)+'<button class="btn azul pequeno" style="display:block;margin-top:7px;padding:5px 10px;font-size:11.5px" onclick="falar(\''+en.replace(/'/g,"\\'").replace(/\n/g,' ')+'\')">Ouvir</button>'+(pt?'<span class="traducao">'+esc(pt)+'</span>':'')+'</div>';}).join('')+(tutorPensando?'<div class="escrevendo">Escrevendo...</div>':'')+'<div id="fimConversa"></div></div>';
h+='<div class="envio"><textarea class="campo" id="tutorTexto" style="min-height:50px" placeholder="escreva em ingles, mesmo errado"></textarea><button class="btn laranja" onclick="enviarTutor()" '+(tutorPensando?'disabled':'')+'>Enviar</button></div>';return h;}
function sugerir(s){$('#tutorTexto').value=s;$('#tutorTexto').focus();}

let eventoInstall=null;window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();eventoInstall=e;if(!localStorage.getItem('ingles30:installDismissed'))$('#installBanner').classList.remove('oculto');});
async function instalarPWA(){if(!eventoInstall)return;eventoInstall.prompt();const{outcome}=await eventoInstall.userChoice;if(outcome==='accepted')fecharInstall();}
function fecharInstall(){$('#installBanner').classList.add('oculto');localStorage.setItem('ingles30:installDismissed','1');}
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}

function render(){try{renderTopo();renderNav();const fn={painel:telaPainel,sessao:telaSessao,passaporte:telaPassaporte,tutor:telaTutor}[tela]||telaPainel;$('#tela').innerHTML=fn()||'<div class="carta">Algo deu errado.</div>';$('#rodape').innerHTML=tela==='painel'?'<span>5 sessoes de 30 min por semana</span>':'';const c=$('#campoResp');if(c&&!c.disabled)c.focus();}catch(e){console.error(e);}}
setInterval(()=>{if(tela!=='sessao'||!S||S.fim)return;const d=Math.floor((Date.now()-S.inicio)/1000),el=$('#crono');if(el)el.textContent=String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0');},1000);
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const ex=S&&!S.fim?exAtual():null;if(!ex||S.resposta!==null)return;if(ex.t==='digitar'&&document.activeElement&&document.activeElement.id==='campoResp'){e.preventDefault();responderDigitar();}});

(async()=>{await carregar();render();})();
</script>
