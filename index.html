<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Aprenda inglês em 30 minutos por dia. 9 níveis, do zero ao trabalho.">
<title>Inglês em 30 minutos</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C3AED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inglês 30">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  /* Paleta B — Arco-íris suave estilo Spotify */
  --roxo:#7C3AED;
  --roxo2:#A78BFA;
  --rosa:#EC4899;
  --rosa2:#F472B6;
  --laranja:#F97316;
  --laranja2:#FB923C;
  --amarelo:#FACC15;
  --verde:#10B981;
  --verde2:#34D399;
  --azul:#3B82F6;
  --azul2:#60A5FA;
  --ciano:#06B6D4;
  --preto:#0F0F1A;
  --cinza1:#1A1A2E;
  --cinza2:#25253D;
  --cinza3:#34344F;
  --branco:#FFFFFF;
  --texto:#F4F4F5;
  --texto2:#A1A1AA;
  --grad-principal:linear-gradient(135deg,#7C3AED 0%,#EC4899 50%,#F97316 100%);
  --grad-azul:linear-gradient(135deg,#3B82F6,#06B6D4);
  --grad-verde:linear-gradient(135deg,#10B981,#06B6D4);
  --grad-rosa:linear-gradient(135deg,#EC4899,#A78BFA);
  --grad-laranja:linear-gradient(135deg,#F97316,#FACC15);
  --disp:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --corpo:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--preto);
  color:var(--texto);
  font-family:var(--corpo);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  background-image:
    radial-gradient(circle at 20% 10%, rgba(124,58,237,.15), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(236,72,153,.12), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(249,115,22,.08), transparent 50%);
  background-attachment:fixed;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:16px}
.app{max-width:560px;margin:0 auto;padding:18px 16px 24px}
.oculto{display:none !important}

/* Tipografia */
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0 0 14px;line-height:1.1;color:var(--branco)}
h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2;color:var(--branco)}
h3{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0;color:var(--branco)}
.rotulo{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--texto2);font-weight:500}
.dado{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;color:var(--branco)}
.pt{color:var(--texto2);font-size:13.5px;line-height:1.45}

/* Topo */
.topo{display:flex;align-items:center;gap:11px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.06)}
.selo-nivel{background:var(--grad-principal);color:var(--branco);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;line-height:1.1;min-width:46px;box-shadow:0 4px 14px rgba(124,58,237,.4)}
.selo-nivel .n{font-family:var(--mono);font-size:16px;font-weight:700}
.selo-nivel .l{font-family:var(--mono);font-size:7.5px;letter-spacing:.12em;opacity:.85;margin-top:1px}
.topo-info{flex:1;min-width:0}
.topo-info .nome{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--branco)}
.metricas{display:flex;gap:14px;margin-top:4px;flex-wrap:wrap}
.metricas span{font-family:var(--mono);font-size:10.5px;color:var(--texto2)}
.metricas b{color:var(--branco);font-weight:700}

/* Cartões */
.carta{background:rgba(26,26,46,.6);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;margin-bottom:11px;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.carta.destaque{background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(236,72,153,.15));border-color:rgba(124,58,237,.4);box-shadow:0 8px 24px rgba(124,58,237,.2)}
.carta-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}

/* Botões */
.btn{display:block;width:100%;text-align:center;background:var(--grad-principal);color:var(--branco);border-radius:12px;padding:14px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(124,58,237,.35);transition:transform .15s ease,box-shadow .15s ease;letter-spacing:-.01em}
.btn:active{transform:scale(.97);box-shadow:0 3px 10px rgba(124,58,237,.25)}
.btn:disabled{opacity:.4;cursor:default}
.btn.secundario{background:rgba(255,255,255,.05);color:var(--branco);border:1px solid rgba(255,255,255,.12);box-shadow:none;font-weight:600}
.btn.secundario:active{background:rgba(255,255,255,.1)}
.btn.verde{background:var(--grad-verde);box-shadow:0 6px 18px rgba(16,185,129,.35)}
.btn.azul{background:var(--grad-azul);box-shadow:0 6px 18px rgba(59,130,246,.35)}
.btn.rosa{background:var(--grad-rosa);box-shadow:0 6px 18px rgba(236,72,153,.35)}
.btn.laranja{background:var(--grad-laranja);box-shadow:0 6px 18px rgba(249,115,22,.35)}
.btn.pequeno{padding:9px 14px;font-size:13px;width:auto;display:inline-block}
button:focus-visible{outline:2.5px solid var(--roxo2);outline-offset:2px}

/* Barras */
.barra{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--grad-principal);border-radius:99px;transition:width .4s ease}

/* Semana */
.semana{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.dia{aspect-ratio:1;border-radius:8px;border:1.5px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;color:var(--texto2);background:rgba(255,255,255,.02)}
.dia.feito{background:var(--grad-verde);border-color:transparent;color:var(--branco);font-weight:700;box-shadow:0 3px 10px rgba(16,185,129,.3)}
.dia.hoje{border-color:var(--laranja);border-width:2px;color:var(--branco)}

/* Sessão */
.sessao-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.blocos{display:flex;gap:4px;margin-bottom:16px}
.blocos i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.08)}
.blocos i.ativo{background:var(--grad-principal)}
.blocos i.pronto{background:var(--grad-verde)}
.cronometro{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--texto2);background:rgba(255,255,255,.05);padding:5px 10px;border-radius:8px}
.cronometro.estourou{color:var(--rosa);background:rgba(236,72,153,.15)}

.pergunta{font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.25;margin:6px 0 4px;color:var(--branco)}
.pergunta.en{font-size:24px;font-family:var(--mono)}
.opcoes{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opc{text-align:left;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:10px;padding:13px 14px;font-size:15px;color:var(--texto);transition:all .15s;width:100%}
.opc:active{background:rgba(255,255,255,.08);transform:scale(.99)}
.opc.certa{background:rgba(16,185,129,.18);border-color:var(--verde);color:var(--branco);animation:pulseOk .5s}
.opc.errada{background:rgba(236,72,153,.18);border-color:var(--rosa);color:var(--branco);animation:shakeErr .4s}
.opc.revelada{background:rgba(16,185,129,.1);border-color:var(--verde);border-style:dashed}
.opc:disabled{cursor:default;opacity:1}

@keyframes pulseOk{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.02)}
}
@keyframes shakeErr{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

.campo{width:100%;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;padding:13px;font-size:15px;color:var(--branco);outline:none;transition:border-color .15s}
.campo:focus{border-color:var(--roxo2);background:rgba(255,255,255,.06)}
textarea.campo{min-height:90px;resize:vertical;line-height:1.45}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:8px;padding:9px 13px;font-size:14.5px;color:var(--texto);transition:all .12s}
.chip:active{background:rgba(255,255,255,.12);transform:scale(.97)}
.chip.usado{opacity:.25;pointer-events:none}
.linha-montada{min-height:48px;border-bottom:1.5px dashed rgba(255,255,255,.15);display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px;align-items:flex-start}

.retorno{border-radius:10px;padding:12px 14px;margin-top:13px;font-size:14px;line-height:1.45}
.retorno.ok{background:rgba(16,185,129,.15);border-left:3px solid var(--verde)}
.retorno.nao{background:rgba(236,72,153,.15);border-left:3px solid var(--rosa)}
.retorno .t{font-weight:700;display:block;margin-bottom:4px;color:var(--branco);font-size:13px;letter-spacing:.02em}

.som{width:104px;height:104px;border-radius:50%;background:var(--grad-azul);color:var(--branco);display:flex;align-items:center;justify-content:center;margin:16px auto;font-size:36px;box-shadow:0 8px 24px rgba(59,130,246,.4);transition:transform .15s}
.som:active{transform:scale(.92)}

/* Passaporte */
.estampas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.estampa{position:relative;border:1.5px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 12px;background:rgba(255,255,255,.03);min-height:110px;display:flex;flex-direction:column;justify-content:space-between;transition:all .2s}
.estampa .num{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--texto2);font-weight:500}
.estampa .tit{font-weight:700;font-size:14.5px;letter-spacing:-.01em;margin-top:5px;color:var(--branco)}
.estampa.carimbada{border-color:var(--amarelo);border-style:double;border-width:3px;background:linear-gradient(135deg,rgba(250,204,21,.12),rgba(249,115,22,.08));animation:carimboPop .6s}
.estampa.carimbada .carimbo{position:absolute;right:8px;bottom:8px;transform:rotate(-12deg);border:1.5px solid var(--amarelo);color:var(--amarelo);border-radius:5px;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:3px 6px;text-transform:uppercase;background:rgba(250,204,21,.1)}
.estampa.atual{border-color:var(--roxo2);border-width:2px;background:linear-gradient(135deg,rgba(124,58,237,.1),rgba(236,72,153,.1))}
.estampa.travada{opacity:.4}

@keyframes carimboPop{
  0%{transform:scale(.85) rotate(-3deg);opacity:.5}
  60%{transform:scale(1.05) rotate(1deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}

/* Tutor */
.conversa{display:flex;flex-direction:column;gap:9px;margin-bottom:13px}
.bolha{max-width:88%;padding:11px 14px;border-radius:14px;font-size:14.5px;line-height:1.45}
.bolha.eu{align-self:flex-end;background:var(--grad-principal);color:var(--branco);border-bottom-right-radius:5px;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.bolha.ia{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-bottom-left-radius:5px;color:var(--texto)}
.bolha .traducao{display:block;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:var(--texto2)}
.escrevendo{font-family:var(--mono);font-size:11.5px;color:var(--texto2);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.envio{display:flex;gap:8px;align-items:flex-end}
.envio .campo{flex:1}
.envio .btn{width:auto;padding:13px 18px}

/* Navegação */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,15,26,.85);border-top:1px solid rgba(255,255,255,.08);display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(20px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--texto2);min-height:48px;transition:color .15s}
.nav button .ic{font-size:18px;line-height:1;transition:transform .2s}
.nav button .tx{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.nav button.ativo{color:var(--branco)}
.nav button.ativo .ic{transform:scale(1.15)}
.nav button.ativo.painel{color:var(--azul2)}
.nav button.ativo.sessao{color:var(--roxo2)}
.nav button.ativo.passaporte{color:var(--verde2)}
.nav button.ativo.tutor{color:var(--laranja2)}
.nav button:focus-visible{outline:2px solid var(--roxo2);outline-offset:-2px}

/* Conquistas */
.grid-conquistas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;margin-top:11px}
.conquista{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:11px;padding:11px 6px;text-align:center;transition:all .2s}
.conquista.bloq{opacity:.35}
.conquista.desb{border-color:var(--amarelo);background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(249,115,22,.1));box-shadow:0 4px 14px rgba(250,204,21,.2);animation:desbloqueia .7s}
.conquista .ico{font-size:24px;line-height:1;margin-bottom:6px}
.conquista .nm{font-weight:700;font-size:11px;letter-spacing:-.01em;color:var(--branco)}
@keyframes desbloqueia{
  0%{transform:scale(.7) rotate(-10deg);opacity:0}
  60%{transform:scale(1.15) rotate(5deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}

/* Dashboard */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:11px}
.stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:12px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad-principal)}
.stat.verde::before{background:var(--grad-verde)}
.stat.azul::before{background:var(--grad-azul)}
.stat.rosa::before{background:var(--grad-rosa)}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--branco)}
.stat .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--texto2);margin-top:3px;text-transform:uppercase;font-weight:500}

/* Toast */
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--grad-principal);color:var(--branco);padding:11px 18px;border-radius:12px;font-size:14px;z-index:100;max-width:90%;text-align:center;font-weight:700;box-shadow:0 10px 30px rgba(124,58,237,.4);animation:toastIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-15px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

/* Confete */
.confetti{position:fixed;top:-10px;width:10px;height:14px;pointer-events:none;z-index:99;animation:fallConf 2.5s linear forwards}
@keyframes fallConf{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

.rodape{text-align:center;margin-top:22px;color:var(--texto2);font-size:11.5px;font-family:var(--mono)}
.aviso{background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(249,115,22,.1));border:1px solid rgba(250,204,21,.3);border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.4;color:var(--texto)}

.install-banner{position:fixed;bottom:72px;left:10px;right:10px;max-width:540px;margin:0 auto;background:var(--grad-principal);color:var(--branco);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;z-index:15;box-shadow:0 8px 24px rgba(124,58,237,.4)}
.install-banner button{background:var(--branco);color:var(--roxo);border-radius:8px;padding:7px 12px;font-weight:700;font-size:12px}
.install-banner .x{padding:4px 8px;background:transparent;color:var(--branco)}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="app">
  <div class="topo" id="topo"></div>
  <div id="tela"></div>
  <div class="rodape" id="rodape"></div>
</div>

<div id="installBanner" class="install-banner oculto">
  <div style="flex:1;font-size:13px;line-height:1.3;font-weight:600">📱 Instale pra estudar offline!</div>
  <button onclick="instalarPWA()">Instalar</button>
  <button class="x" onclick="fecharInstall()">✕</button>
</div>

<nav class="nav" id="nav"></nav>

<script>
/* ============================================================
   🔊 SISTEMA DE SONS (Web Audio API — sintetizado, sem downloads)
   ============================================================ */
let audioCtx=null;
let configSom={ligado:true,vibrar:true,toque:true};

function initAudio(){
  if(!audioCtx){
    try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  }
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function beep(freq,dur,tipo,vol){
  if(!configSom.ligado||!audioCtx)return;
  try{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type=tipo||'sine';
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(vol||.15,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function tocarToque(){
  if(configSom.toque)beep(800,.04,'square',.04);
}
function somAcerto(perfeito){
  if(!configSom.ligado||!audioCtx)return;
  if(configSom.vibrar&&navigator.vibrate)navigator.vibrate(15);
  if(perfeito){
    // Acorde maior ascendente — satisfatório
    beep(523,.1,'sine',.18); // C5
    setTimeout(()=>beep(659,.1,'sine',.18),80); // E5
    setTimeout(()=>beep(784,.15,'sine',.18),160); // G5
  } else {
    beep(523,.12,'sine',.15);
    setTimeout(()=>beep(659,.15,'sine',.15),100);
  }
}
function somErro(){
  if(!configSom.ligado||!audioCtx)return;
  if(configSom.vibrar&&navigator.vibrate)navigator.vibrate([0,30,30,30]);
  beep(220,.1,'sawtooth',.1);
  setTimeout(()=>beep(180,.15,'sawtooth',.1),100);
}
function somConquista(){
  if(!configSom.ligado||!audioCtx)return;
  if(configSom.vibrar&&navigator.vibrate)navigator.vibrate([0,50,50,50,50,100]);
  beep(523,.1,'sine',.2);
  setTimeout(()=>beep(659,.1,'sine',.2),100);
  setTimeout(()=>beep(784,.1,'sine',.2),200);
  setTimeout(()=>beep(1047,.25,'sine',.2),300);
}
function somNivel(){
  if(!configSom.ligado||!audioCtx)return;
  if(configSom.vibrar&&navigator.vibrate)navigator.vibrate([0,80,40,80]);
  beep(392,.1,'sine',.18); // G4
  setTimeout(()=>beep(523,.1,'sine',.18),120); // C5
  setTimeout(()=>beep(659,.1,'sine',.18),240); // E5
  setTimeout(()=>beep(784,.1,'sine',.18),360); // G5
  setTimeout(()=>beep(1047,.4,'sine',.2),480); // C6
}

/* 🎊 Confete */
function soltarConfete(){
  const cores=['#7C3AED','#EC4899','#F97316','#FACC15','#10B981','#3B82F6','#06B6D4'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=cores[Math.floor(Math.random()*cores.length)];
    c.style.animationDelay=Math.random()*.5+'s';
    c.style.animationDuration=(1.8+Math.random()*1.5)+'s';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    if(Math.random()>.5)c.style.borderRadius='50%';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3500);
  }
}

{n:1,nome:"Primeiras palavras",desc:"Cumprimentar, se apresentar, falar de pessoas e números.",u:[
 {t:"Cumprimentos",
  v:[["hello","olá","Hello! How are you?","Olá! Como você está?"],["good morning","bom dia","Good morning, everyone.","Bom dia, pessoal."],["my name is","meu nome é","My name is Victor.","Meu nome é Victor."],["nice to meet you","prazer em conhecer você","Nice to meet you, Ana.","Prazer em conhecer você, Ana."],["thank you","obrigado","Thank you very much.","Muito obrigado."],["goodbye","tchau / adeus","Goodbye, see you tomorrow.","Tchau, até amanhã."]],
  g:{t:"Verbo TO BE (ser/estar)",e:"Em inglês todo mundo precisa do verbo TO BE. São três formas no presente: I am (eu sou/estou), you are (você é/está), he/she/it is (ele/ela é/está). É como o cinto de segurança do carro: quase nenhuma frase sai sem ele.",
     ex:[["I am Victor.","Eu sou o Victor."],["You are my friend.","Você é meu amigo."],["She is tired.","Ela está cansada."]]},
  d:[["I ___ from Brazil.",["am","is","are"],0,"Eu sou do Brasil."],["She ___ my sister.",["am","is","are"],1,"Ela é minha irmã."],["You ___ very kind.",["am","is","are"],2,"Você é muito gentil."],["It ___ a good day.",["am","is","are"],1,"É um bom dia."]],
  p:{pt:"Escreva em inglês: Olá, meu nome é Victor. Prazer em conhecer você.",en:"Hello, my name is Victor. Nice to meet you."}},
 {t:"Pessoas e família",
  v:[["mother","mãe","My mother works here.","Minha mãe trabalha aqui."],["father","pai","His father is a driver.","O pai dele é motorista."],["brother","irmão","I have one brother.","Eu tenho um irmão."],["sister","irmã","My sister is a student.","Minha irmã é estudante."],["friend","amigo","She is my best friend.","Ela é minha melhor amiga."],["family","família","My family is big.","Minha família é grande."]],
  g:{t:"Artigos A / AN",e:"A e AN significam 'um/uma'. Use AN antes de som de vogal (a, e, i, o, u): an apple. Use A antes de consoante: a car. É só uma questão de a boca não tropeçar.",
     ex:[["a car","um carro"],["an apple","uma maçã"],["an hour","uma hora (o H é mudo)"]]},
  d:[["I have ___ brother.",["a","an"],0,"Eu tenho um irmão."],["She is ___ engineer.",["a","an"],1,"Ela é engenheira."],["This is ___ house.",["a","an"],0,"Esta é uma casa."],["He wants ___ orange.",["a","an"],1,"Ele quer uma laranja."]],
  p:{pt:"Escreva em inglês: Minha família é grande. Eu tenho um irmão e uma irmã.",en:"My family is big. I have one brother and one sister."}},
 {t:"Números e cores",
  v:[["one","um","I need one ticket.","Eu preciso de um bilhete."],["two","dois","Two coffees, please.","Dois cafés, por favor."],["three","três","Three days a week.","Três dias por semana."],["red","vermelho","The red car is mine.","O carro vermelho é meu."],["blue","azul","I like the blue one.","Eu gosto do azul."],["black","preto","A black phone.","Um telefone preto."]],
  g:{t:"Plural com -S",e:"Para falar de mais de um, coloca -s no fim: car → cars. Palavras terminadas em s, x, ch, sh ganham -es: box → boxes. Diferente do português, o adjetivo NÃO muda: two red cars (não 'two reds cars').",
     ex:[["one car / two cars","um carro / dois carros"],["one box / three boxes","uma caixa / três caixas"],["two blue doors","duas portas azuis"]]},
  d:[["I have two ___.",["car","cars"],1,"Eu tenho dois carros."],["Three ___ are here.",["boxes","boxs"],0,"Três caixas estão aqui."],["She has one ___.",["sister","sisters"],0,"Ela tem uma irmã."],["Two ___ phones.",["black","blacks"],0,"Dois telefones pretos."]],
  p:{pt:"Escreva em inglês: Eu tenho dois carros. Um é vermelho e um é azul.",en:"I have two cars. One is red and one is blue."}}
]},
{n:2,nome:"O dia a dia",desc:"Objetos, verbos básicos, rotina e perguntas simples.",u:[
 {t:"Objetos do dia a dia",
  v:[["phone","telefone","My phone is on the table.","Meu telefone está na mesa."],["car","carro","The car is new.","O carro é novo."],["house","casa","Their house is near.","A casa deles é perto."],["key","chave","I lost my key.","Eu perdi minha chave."],["water","água","I want water, please.","Eu quero água, por favor."],["money","dinheiro","I need more money.","Eu preciso de mais dinheiro."]],
  g:{t:"THIS / THAT / THESE / THOSE",e:"THIS = este (perto, um). THAT = aquele (longe, um). THESE = estes (perto, vários). THOSE = aqueles (longe, vários). Pense em braço: o que você alcança é this/these; o que precisa apontar é that/those.",
     ex:[["This phone is mine.","Este telefone é meu."],["That car is fast.","Aquele carro é rápido."],["These keys are old.","Estas chaves são velhas."]]},
  d:[["___ phone here is mine.",["This","That"],0,"Este telefone aqui é meu."],["___ cars over there are new.",["These","Those"],1,"Aqueles carros ali são novos."],["___ keys in my hand.",["These","Those"],0,"Estas chaves na minha mão."],["___ house is far.",["That","These"],0,"Aquela casa é longe."]],
  p:{pt:"Escreva em inglês: Este é meu telefone. Aquele carro é novo.",en:"This is my phone. That car is new."}},
 {t:"Verbos básicos",
  v:[["to eat","comer","I eat at noon.","Eu como ao meio-dia."],["to drink","beber","She drinks coffee.","Ela bebe café."],["to work","trabalhar","I work with glass.","Eu trabalho com vidro."],["to live","morar","They live in Rio.","Eles moram no Rio."],["to want","querer","I want a break.","Eu quero uma pausa."],["to have","ter","We have two cars.","Nós temos dois carros."]],
  g:{t:"Presente simples e o -S do he/she/it",e:"O verbo só muda numa pessoa: he, she, it ganham -S. I work, you work, WE work, mas HE workS. Chame de 'imposto do he/she/it': só eles pagam a letra extra.",
     ex:[["I work every day.","Eu trabalho todo dia."],["He works every day.","Ele trabalha todo dia."],["She has a car.","Ela tem um carro."]]},
  d:[["He ___ coffee every morning.",["drink","drinks"],1,"Ele bebe café toda manhã."],["I ___ in São Paulo.",["live","lives"],0,"Eu moro em São Paulo."],["She ___ two brothers.",["have","has"],1,"Ela tem dois irmãos."],["We ___ at 8 o'clock.",["start","starts"],0,"Nós começamos às 8 horas."]],
  p:{pt:"Escreva em inglês: Eu trabalho todo dia e minha irmã trabalha no sábado.",en:"I work every day and my sister works on Saturday."}},
 {t:"Tempo e rotina",
  v:[["morning","manhã","I run in the morning.","Eu corro de manhã."],["night","noite","I study at night.","Eu estudo à noite."],["today","hoje","Today is Monday.","Hoje é segunda-feira."],["tomorrow","amanhã","See you tomorrow.","Até amanhã."],["always","sempre","I always drink coffee.","Eu sempre bebo café."],["never","nunca","He never arrives late.","Ele nunca chega atrasado."]],
  g:{t:"Perguntas com DO / DOES",e:"Para perguntar no presente, o inglês precisa de um ajudante na frente: DO (I/you/we/they) ou DOES (he/she/it). E atenção: quando DOES entra, o verbo perde o -S. O ajudante carrega o peso: Does he work? (não 'Does he works').",
     ex:[["Do you work here?","Você trabalha aqui?"],["Does she like coffee?","Ela gosta de café?"],["I don't understand.","Eu não entendo."]]},
  d:[["___ you live in Brazil?",["Do","Does"],0,"Você mora no Brasil?"],["___ he work on Sunday?",["Do","Does"],1,"Ele trabalha no domingo?"],["Does she ___ coffee?",["drink","drinks"],0,"Ela bebe café?"],["I ___ have time today.",["don't","doesn't"],0,"Eu não tenho tempo hoje."]],
  p:{pt:"Escreva em inglês: Você trabalha de manhã? Eu sempre trabalho à noite.",en:"Do you work in the morning? I always work at night."}}
]},
{n:3,nome:"Lugares e direções",desc:"Se virar na cidade, dizer onde as coisas estão e dar instruções.",u:[
 {t:"Na cidade",
  v:[["street","rua","The store is on this street.","A loja fica nesta rua."],["store","loja","The store opens at nine.","A loja abre às nove."],["restaurant","restaurante","A good restaurant nearby.","Um bom restaurante perto."],["bank","banco","I go to the bank on Friday.","Eu vou ao banco na sexta."],["hospital","hospital","The hospital is far.","O hospital é longe."],["airport","aeroporto","My flight leaves from the airport.","Meu voo sai do aeroporto."]],
  g:{t:"THERE IS / THERE ARE",e:"É o 'há / tem' do inglês. THERE IS para um (there is a bank). THERE ARE para vários (there are two banks). Note que o inglês separa o 'ter posse' (have) do 'ter existência' (there is) — em português usamos 'tem' para os dois.",
     ex:[["There is a store here.","Tem uma loja aqui."],["There are three restaurants.","Tem três restaurantes."],["Is there a bank near here?","Tem um banco perto daqui?"]]},
  d:[["___ a hospital on this street.",["There is","There are"],0,"Tem um hospital nesta rua."],["___ many cars outside.",["There is","There are"],1,"Tem muitos carros lá fora."],["___ a bank near here?",["Is there","Are there"],0,"Tem um banco perto daqui?"],["There ___ two stores.",["is","are"],1,"Tem duas lojas."]],
  p:{pt:"Escreva em inglês: Tem um bom restaurante nesta rua.",en:"There is a good restaurant on this street."}},
 {t:"Onde as coisas estão",
  v:[["in","dentro de / em","The key is in my bag.","A chave está na minha bolsa."],["on","sobre / em cima","The phone is on the table.","O telefone está na mesa."],["at","em (ponto)","I am at work.","Eu estou no trabalho."],["near","perto","The store is near my house.","A loja é perto da minha casa."],["between","entre","Between the bank and the store.","Entre o banco e a loja."],["behind","atrás","The car is behind the house.","O carro está atrás da casa."]],
  g:{t:"IN / ON / AT",e:"IN = dentro de um espaço (in the car, in Brazil). ON = em cima de uma superfície (on the table, on the street). AT = num ponto exato (at home, at work, at 8 o'clock). Pense em zoom: IN é a cidade, ON é a rua, AT é a porta.",
     ex:[["in the car","dentro do carro"],["on the table","em cima da mesa"],["at the airport","no aeroporto"]]},
  d:[["The keys are ___ the table.",["in","on","at"],1,"As chaves estão em cima da mesa."],["I live ___ Brazil.",["in","on","at"],0,"Eu moro no Brasil."],["She is ___ home now.",["in","on","at"],2,"Ela está em casa agora."],["My office is ___ the bank.",["near","in"],0,"Meu escritório é perto do banco."]],
  p:{pt:"Escreva em inglês: A chave está em cima da mesa, perto do telefone.",en:"The key is on the table, near the phone."}},
 {t:"Direções",
  v:[["left","esquerda","Turn left at the corner.","Vire à esquerda na esquina."],["right","direita","The store is on the right.","A loja fica à direita."],["straight","reto","Go straight for two blocks.","Siga reto por dois quarteirões."],["corner","esquina","Wait at the corner.","Espere na esquina."],["block","quarteirão","It is two blocks away.","Fica a dois quarteirões."],["far","longe","Is it far from here?","É longe daqui?"]],
  g:{t:"Imperativo (dar instruções)",e:"Para mandar ou instruir, use o verbo puro, sem sujeito: Turn left. Go straight. Para negar, coloque DON'T na frente: Don't turn here. É o modo mais curto do inglês — e o mais usado em placa, receita e manual.",
     ex:[["Turn right.","Vire à direita."],["Don't stop here.","Não pare aqui."],["Call me later.","Me ligue mais tarde."]]},
  d:[["___ left at the bank.",["Turn","Turns"],0,"Vire à esquerda no banco."],["___ open the door.",["Don't","Doesn't"],0,"Não abra a porta."],["___ straight for one block.",["Go","Goes"],0,"Siga reto por um quarteirão."],["Please ___ me tomorrow.",["call","calls"],0,"Por favor, me ligue amanhã."]],
  p:{pt:"Escreva em inglês: Siga reto e vire à direita na esquina.",en:"Go straight and turn right at the corner."}}
]},
{n:4,nome:"Trabalho e comunicação",desc:"Falar do seu trabalho, do que está acontecendo agora e do que você sabe fazer.",u:[
 {t:"No trabalho",
  v:[["job","emprego / trabalho","I like my job.","Eu gosto do meu trabalho."],["meeting","reunião","The meeting starts at ten.","A reunião começa às dez."],["team","time / equipe","My team has six people.","Meu time tem seis pessoas."],["report","relatório","I am writing the report.","Eu estou escrevendo o relatório."],["manager","gerente","My manager is in a meeting.","Meu gerente está em reunião."],["customer","cliente","The customer is waiting.","O cliente está esperando."]],
  g:{t:"Presente contínuo (agora)",e:"Para o que acontece NESTE momento: TO BE + verbo com -ING. I am working = eu estou trabalhando. É a diferença entre 'eu trabalho aqui' (rotina, present simple) e 'eu estou trabalhando agora' (contínuo).",
     ex:[["I am working now.","Eu estou trabalhando agora."],["She is writing a report.","Ela está escrevendo um relatório."],["They are not listening.","Eles não estão ouvindo."]]},
  d:[["I ___ working right now.",["am","is","are"],0,"Eu estou trabalhando agora."],["She is ___ the report.",["write","writing"],1,"Ela está escrevendo o relatório."],["They ___ waiting outside.",["is","are"],1,"Eles estão esperando lá fora."],["We ___ having a meeting.",["are","is"],0,"Nós estamos tendo uma reunião."]],
  p:{pt:"Escreva em inglês: Eu estou escrevendo o relatório agora. Meu gerente está em reunião.",en:"I am writing the report now. My manager is in a meeting."}},
 {t:"Comunicação",
  v:[["to call","ligar","I will call you later.","Eu te ligo mais tarde."],["to send","enviar","Can you send the file?","Você pode enviar o arquivo?"],["to ask","perguntar","Ask me anything.","Me pergunte qualquer coisa."],["to answer","responder","She answered my email.","Ela respondeu meu e-mail."],["to explain","explicar","Let me explain it again.","Deixa eu explicar de novo."],["to agree","concordar","I agree with you.","Eu concordo com você."]],
  g:{t:"CAN / CAN'T",e:"CAN = poder ou saber fazer. Vantagem: nunca muda de forma e o verbo vem puro depois. He can speak (nunca 'he cans' nem 'he can speaks'). Para negar: can't. Para perguntar, inverte: Can you help me?",
     ex:[["I can speak English.","Eu sei falar inglês."],["He can't come today.","Ele não pode vir hoje."],["Can you help me?","Você pode me ajudar?"]]},
  d:[["___ you send the file?",["Can","Cans"],0,"Você pode enviar o arquivo?"],["He can ___ Spanish.",["speak","speaks"],0,"Ele sabe falar espanhol."],["I ___ come tomorrow.",["can't","don't can"],0,"Eu não posso vir amanhã."],["She can ___ the report today.",["finish","finishes"],0,"Ela consegue terminar o relatório hoje."]],
  p:{pt:"Escreva em inglês: Você pode me enviar o relatório? Eu não consigo abrir o arquivo.",en:"Can you send me the report? I can't open the file."}},
 {t:"Quantidade",
  v:[["some","algum / um pouco","I need some help.","Eu preciso de alguma ajuda."],["any","algum (pergunta/negativa)","Do you have any questions?","Você tem alguma pergunta?"],["many","muitos","Many people are waiting.","Muitas pessoas estão esperando."],["much","muito (não contável)","We don't have much time.","Nós não temos muito tempo."],["a few","alguns poucos","A few customers called.","Alguns clientes ligaram."],["enough","suficiente","We have enough money.","Nós temos dinheiro suficiente."]],
  g:{t:"Contável x não contável",e:"O inglês separa o que você consegue contar no dedo (cars, people, questions) do que só se mede (water, time, money, information). Contável usa many/a few; não contável usa much/a little. E cuidado: information e advice NÃO têm plural em inglês.",
     ex:[["many cars","muitos carros"],["much water","muita água"],["I have a few questions.","Eu tenho algumas perguntas."]]},
  d:[["We don't have ___ time.",["many","much"],1,"Nós não temos muito tempo."],["___ customers called today.",["Many","Much"],0,"Muitos clientes ligaram hoje."],["Do you have ___ questions?",["some","any"],1,"Você tem alguma pergunta?"],["I need ___ help.",["some","any"],0,"Eu preciso de alguma ajuda."]],
  p:{pt:"Escreva em inglês: Nós não temos muito tempo, mas eu tenho algumas perguntas.",en:"We don't have much time, but I have a few questions."}}
]},
{n:5,nome:"Falar do passado",desc:"Contar o que aconteceu — verbos regulares, irregulares e perguntas.",u:[
 {t:"Passado regular",
  v:[["worked","trabalhou / trabalhei","I worked late yesterday.","Eu trabalhei até tarde ontem."],["lived","morou / morei","She lived in Canada.","Ela morou no Canadá."],["started","começou / comecei","The meeting started at ten.","A reunião começou às dez."],["finished","terminou / terminei","We finished the report.","Nós terminamos o relatório."],["called","ligou / liguei","He called me twice.","Ele me ligou duas vezes."],["needed","precisou / precisei","They needed more time.","Eles precisaram de mais tempo."]],
  g:{t:"Passado simples com -ED",e:"A boa notícia: no passado o verbo é igual para todo mundo. I worked, he worked, they worked — um único formato. Só acrescenta -ED (ou -D se já termina em E: live → lived).",
     ex:[["I worked yesterday.","Eu trabalhei ontem."],["She called me.","Ela me ligou."],["We started early.","Nós começamos cedo."]]},
  d:[["I ___ late yesterday.",["work","worked"],1,"Eu trabalhei até tarde ontem."],["She ___ in Canada in 2019.",["lived","lives"],0,"Ela morou no Canadá em 2019."],["They ___ the meeting at ten.",["start","started"],1,"Eles começaram a reunião às dez."],["He ___ me twice.",["called","calls"],0,"Ele me ligou duas vezes."]],
  p:{pt:"Escreva em inglês: Eu trabalhei até tarde ontem e terminei o relatório.",en:"I worked late yesterday and finished the report."}},
 {t:"Passado irregular",
  v:[["went","foi / fui","I went to the bank.","Eu fui ao banco."],["saw","viu / vi","She saw the customer.","Ela viu o cliente."],["had","teve / tive","We had a meeting.","Nós tivemos uma reunião."],["made","fez / fiz","He made a mistake.","Ele cometeu um erro."],["took","pegou / peguei","I took the car.","Eu peguei o carro."],["said","disse","She said no.","Ela disse não."]],
  g:{t:"Irregulares e o DIDN'T",e:"Alguns verbos muito usados não seguem regra: go→went, see→saw, have→had. São os 'teimosos', e só a repetição resolve. Mas na negativa eles voltam ao normal: I didn't GO (nunca 'didn't went') — o DIDN'T já carrega o passado.",
     ex:[["I went to the bank.","Eu fui ao banco."],["I didn't go to the bank.","Eu não fui ao banco."],["She didn't see him.","Ela não o viu."]]},
  d:[["I ___ to the airport yesterday.",["went","goed"],0,"Eu fui ao aeroporto ontem."],["He didn't ___ the file.",["send","sent"],0,"Ele não enviou o arquivo."],["We ___ a long meeting.",["had","haved"],0,"Nós tivemos uma reunião longa."],["She didn't ___ anything.",["say","said"],0,"Ela não disse nada."]],
  p:{pt:"Escreva em inglês: Eu fui ao banco ontem, mas não vi o gerente.",en:"I went to the bank yesterday, but I didn't see the manager."}},
 {t:"Contar uma história",
  v:[["yesterday","ontem","Yesterday was busy.","Ontem foi corrido."],["last week","semana passada","We met last week.","Nós nos encontramos semana passada."],["ago","atrás","Two days ago.","Dois dias atrás."],["then","então / aí","Then he called me.","Aí ele me ligou."],["after","depois de","After the meeting, I left.","Depois da reunião, eu saí."],["before","antes de","Before lunch, I finished it.","Antes do almoço, eu terminei."]],
  g:{t:"Perguntas no passado com DID",e:"Mesma lógica do DO/DOES, só que no passado e sem exceção: DID para todo mundo. E o verbo volta à forma pura: Did you go? Did she work? O DID já avisa que é passado — o verbo não precisa avisar de novo.",
     ex:[["Did you call him?","Você ligou para ele?"],["Did she finish the report?","Ela terminou o relatório?"],["What did you do yesterday?","O que você fez ontem?"]]},
  d:[["___ you call the customer?",["Did","Do"],0,"Você ligou para o cliente?"],["Did she ___ the report?",["finish","finished"],0,"Ela terminou o relatório?"],["What ___ you do yesterday?",["did","do"],0,"O que você fez ontem?"],["I saw him two days ___.",["ago","before"],0,"Eu o vi dois dias atrás."]],
  p:{pt:"Escreva em inglês: Você ligou para o cliente ontem? Eu liguei depois da reunião.",en:"Did you call the customer yesterday? I called after the meeting."}}
]},
{n:6,nome:"Futuro e planos",desc:"Falar de planos, previsões e compromissos.",u:[
 {t:"Planos",
  v:[["to plan","planejar","We plan to grow this year.","Nós planejamos crescer este ano."],["to travel","viajar","I am going to travel in July.","Eu vou viajar em julho."],["to move","mudar (de lugar)","They are going to move offices.","Eles vão mudar de escritório."],["to learn","aprender","I am going to learn English.","Eu vou aprender inglês."],["to try","tentar","I will try again.","Eu vou tentar de novo."],["to decide","decidir","We decided to wait.","Nós decidimos esperar."]],
  g:{t:"GOING TO (plano já decidido)",e:"Use TO BE + going to + verbo para o que já está decidido ou é visível no horizonte: I am going to study tonight. É o futuro 'com data marcada na cabeça' — bem parecido com o nosso 'eu vou estudar'.",
     ex:[["I am going to study tonight.","Eu vou estudar hoje à noite."],["She is going to travel.","Ela vai viajar."],["It is going to rain.","Vai chover."]]},
  d:[["I ___ going to study tonight.",["am","is"],0,"Eu vou estudar hoje à noite."],["She is going to ___ in July.",["travel","travels"],0,"Ela vai viajar em julho."],["They ___ going to move.",["are","is"],0,"Eles vão mudar."],["It is going ___ rain.",["to","for"],0,"Vai chover."]],
  p:{pt:"Escreva em inglês: Eu vou aprender inglês este ano.",en:"I am going to learn English this year."}},
 {t:"Previsões",
  v:[["maybe","talvez","Maybe he will come.","Talvez ele venha."],["probably","provavelmente","She will probably agree.","Ela provavelmente vai concordar."],["sure","certo / certeza","I am sure about that.","Eu tenho certeza disso."],["soon","logo","I will call you soon.","Eu te ligo logo."],["later","mais tarde","Let's talk later.","Vamos conversar mais tarde."],["next","próximo","Next week is better.","Semana que vem é melhor."]],
  g:{t:"WILL (decisão na hora e previsão)",e:"WILL é o futuro de quem acabou de decidir ou de quem acha que vai acontecer: I'll help you. Nunca muda de forma e o verbo vem puro. Comparando: 'going to' é plano de agenda; 'will' é palpite ou promessa do momento.",
     ex:[["I will help you.","Eu vou te ajudar."],["It will be fine.","Vai dar certo."],["He won't come today.","Ele não virá hoje."]]},
  d:[["I ___ call you later.",["will","am"],0,"Eu te ligo mais tarde."],["She will ___ tomorrow.",["arrive","arrives"],0,"Ela vai chegar amanhã."],["He ___ come today.",["won't","doesn't will"],0,"Ele não virá hoje."],["It ___ probably rain.",["will","wills"],0,"Provavelmente vai chover."]],

const CHAVE='ingles30:progresso';
const CHAVE_IA='ingles30:credencial';
const CHAVE_SOM='ingles30:som';
const PADRAO={v:2,nivel:1,unidade:0,xp:0,streak:0,streakFreeze:0,ultimoDia:null,itens:{},sessoes:[],carimbos:{},prova:false,recado:"",tutorHist:[],voz:'',vel:0.95,conquistas:[]};
let E=JSON.parse(JSON.stringify(PADRAO));
let tela='painel',salvando=null;
let IA={chave:'',modelo:'claude-sonnet-5'};

const MEM={};
const Guarda={
  onde:'memoria',
  async ler(k){
    if(typeof window.storage!=='undefined'){
      try{const r=await window.storage.get(k);this.onde='claude';return r&&r.value?r.value:null;}catch(e){}
    }
    try{const v=localStorage.getItem(k);this.onde='navegador';return v;}catch(e){}
    return MEM[k]||null;
  },
  async gravar(k,v){
    MEM[k]=v;
    if(typeof window.storage!=='undefined'){
      try{await window.storage.set(k,v);return true;}catch(e){return false;}
    }
    try{localStorage.setItem(k,v);return true;}catch(e){}
    return false;
  }
};

async function carregar(){
  const bruto=await Guarda.ler(CHAVE);
  if(bruto){try{E=Object.assign(JSON.parse(JSON.stringify(PADRAO)),migrar(JSON.parse(bruto)));}catch(e){}}
  const cred=await Guarda.ler(CHAVE_IA);
  if(cred){try{IA=Object.assign(IA,JSON.parse(cred));}catch(e){}}
  const som=await Guarda.ler(CHAVE_SOM);
  if(som){try{configSom=Object.assign(configSom,JSON.parse(som));}catch(e){}}
}
function migrar(p){
  if(!p||typeof p!=='object')return p;
  if(p.v===2)return p;
  return Object.assign({},p,{v:2,conquistas:p.conquistas||[],streakFreeze:p.streakFreeze||0});
}
function salvar(){
  clearTimeout(salvando);
  salvando=setTimeout(()=>Guarda.gravar(CHAVE,JSON.stringify(E)),400);
}
function salvarSom(){
  Guarda.gravar(CHAVE_SOM,JSON.stringify(configSom));
}
function temIA(){return !!IA.chave||typeof window.storage!=='undefined';}

const $=s=>document.querySelector(s);
const hoje=()=>new Date().toISOString().slice(0,10);
const embaralhar=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[.,!?;:'"()]/g,'').replace(/\s+/g,' ').trim();
function dist(a,b){
  const m=[];for(let i=0;i<=b.length;i++){m[i]=[i];for(let j=0;j<=a.length;j++){if(i===0)m[0][j]=j;
  else m[i][j]=b[i-1]===a[j-1]?m[i-1][j-1]:Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);}}
  return m[b.length][a.length];
}
function nivelObj(n){return CURSO[Math.min(n,CURSO.length)-1];}
function unidadeAtual(){return nivelObj(E.nivel).u[Math.min(E.unidade,2)];}
function segundaDaSemana(d){const x=new Date(d);const dia=(x.getDay()+6)%7;x.setDate(x.getDate()-dia);return x.toISOString().slice(0,10);}

/* Voz */
function vozesEN(){
  if(!('speechSynthesis' in window))return [];
  return speechSynthesis.getVoices().filter(v=>v.lang&&/^en/i.test(v.lang));
}
function notaVoz(v){
  const n=(v.name||'')+' '+(v.voiceURI||'');let p=0;
  if(/natural|neural|premium|enhanced|online/i.test(n))p+=6;
  if(/google/i.test(n))p+=4;
  if(/samantha|ava|siri|aria|jenny|allison|nicky/i.test(n))p+=3;
  if(/^en-US/i.test(v.lang))p+=2;else if(/^en-GB/i.test(v.lang))p+=1;
  if(/compact|espeak|david|zira|mark/i.test(n))p-=3;
  return p;
}
function melhorVoz(){
  const vs=vozesEN();if(!vs.length)return null;
  if(E.voz){const m=vs.find(v=>v.voiceURI===E.voz);if(m)return m;}
  return vs.slice().sort((a,b)=>notaVoz(b)-notaVoz(a))[0];
}
let filaVoz=null;
function falar(txt,taxa){
  initAudio();
  if(!('speechSynthesis' in window))return;
  clearTimeout(filaVoz);
  speechSynthesis.cancel();
  filaVoz=setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(String(txt).replace(/\s+/g,' ').trim());
    const v=melhorVoz();
    if(v){u.voice=v;u.lang=v.lang;}else{u.lang='en-US';}
    u.rate=taxa||E.vel||0.95;
    speechSynthesis.speak(u);
  },60);
}
if('speechSynthesis' in window){speechSynthesis.getVoices();setTimeout(()=>speechSynthesis.getVoices(),300);}

/* FSRS */
function novoItem(){return {reps:0,lapsos:0,estabilidade:1,dificuldade:5,intervalo:1,due:Date.now()};}
function agendar(it,acertou){
  it.reps++;
  if(!acertou){it.lapsos++;it.estabilidade=Math.max(.5,it.estabilidade*.5);it.intervalo=1;}
  else{it.dificuldade=Math.max(1,it.dificuldade-.1);it.estabilidade*=1+(10-it.dificuldade)/20;it.intervalo=Math.max(1,Math.round(it.estabilidade));}
  it.due=Date.now()+it.intervalo*864e5;
  return it;
}
function registrar(chave,acertou){
  let it=E.itens[chave];if(!it)it=novoItem();
  E.itens[chave]=agendar(it,!!acertou);
  salvar();
}
function devidos(){
  const agora=Date.now();
  return Object.keys(E.itens).filter(k=>E.itens[k].due<=agora).sort((a,b)=>E.itens[a].due-E.itens[b].due);
}
function palavrasAprendidas(){return Object.values(E.itens).filter(it=>it.reps>=3&&it.lapsos<it.reps/2).length;}
function taxaAcerto(){
  const t=Object.values(E.itens);if(!t.length)return 0;
  const tot=t.reduce((a,it)=>a+it.reps,0),err=t.reduce((a,it)=>a+it.lapsos,0);
  return tot?Math.round((1-err/tot)*100):0;
}
function itemPorChave(k){
  const p=k.split('.');const niv=CURSO[+p[0]-1];if(!niv)return null;
  const un=niv.u[+p[1]];if(!un)return null;
  if(p[2][0]==='g'){const d=un.d[+p[2].slice(1)];return d?{tipo:'g',d,un,niv}:null;}
  const v=un.v[+p[2]];return v?{tipo:'v',v,un,niv}:null;
}
function dominio(nivel){
  let tot=0,bons=0;
  CURSO[nivel-1].u.forEach((u,ui)=>u.v.forEach((v,vi)=>{
    tot++;const it=E.itens[nivel+'.'+ui+'.'+vi];
    if(it&&it.reps>=2&&it.lapsos<it.reps)bons++;
  }));
  return tot?bons/tot:0;
}

function toast(msg){
  const el=document.createElement('div');
  el.className='toast';
  el.setAttribute('role','status');
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

/* Exercícios */
function distratores(certo,fonte,n){
  const pool=embaralhar(fonte.filter(x=>x!==certo)).slice(0,n);
  return embaralhar(pool.concat([certo]));
}
function todasTrad(){const r=[];CURSO.forEach(n=>n.u.forEach(u=>u.v.forEach(v=>r.push(v[1]))));return r;}
function todasPal(){const r=[];CURSO.forEach(n=>n.u.forEach(u=>u.v.forEach(v=>r.push(v[0]))));return r;}

function exVocab(c,v,modo){
  if(modo==='pt2en'){
    const ops=distratores(v[0],todasPal(),3);
    return {t:'mc',chave:c,pergunta:v[1],rotulo:'Como se diz em inglês?',opcoes:ops,correta:ops.indexOf(v[0]),som:v[0],exemplo:v[2],exemploPt:v[3]};
  }
  if(modo==='en2pt'){
    const ops=distratores(v[1],todasTrad(),3);
    return {t:'mc',chave:c,pergunta:v[0],en:true,rotulo:'O que significa?',opcoes:ops,correta:ops.indexOf(v[1]),som:v[0],exemplo:v[2],exemploPt:v[3]};
  }
  return {t:'digitar',chave:c,pergunta:v[1],rotulo:'Escreva em inglês',resposta:v[0],som:v[0],exemplo:v[2],exemploPt:v[3]};
}
function exOuvir(c,v){
  const ops=distratores(v[1],todasTrad(),3);
  return {t:'ouvir',chave:c,frase:v[2],fraseTrad:v[3],rotulo:'Ouça e escolha',opcoes:ops,correta:ops.indexOf(v[1]),som:v[2],dica:v[0]};
}
function exGram(c,d){return {t:'mc',chave:c,pergunta:d[0],en:true,rotulo:'Complete a frase',opcoes:d[1].slice(),correta:d[2],traducao:d[3],som:d[0].replace('___',d[1][d[2]])};}
function exOrd(c,f,t){return {t:'ordenar',chave:c,frase:f,traducao:t,rotulo:'Monte a frase',som:f};}

/* Sessão */
let S=null;
function exRevisao(max){
  const dv=devidos().slice(0,max),out=[];
  dv.forEach(k=>{const it=itemPorChave(k);if(!it)return;
    if(it.tipo==='v')out.push(exVocab(k,it.v,Math.random()<.5?'pt2en':'en2pt'));
    else out.push(exGram(k,it.d));
  });
  return out;
}
function montarSessao(){
  const niv=E.nivel,ui=Math.min(E.unidade,2),un=nivelObj(niv).u[ui];
  const cv=i=>niv+'.'+ui+'.'+i,cg=i=>niv+'.'+ui+'.g'+i;
  let rev=exRevisao(8);
  if(rev.length<4){
    const extras=[];
    nivelObj(niv).u.forEach((u,x)=>{if(x<ui)u.v.forEach((v,i)=>extras.push(exVocab(niv+'.'+x+'.'+i,v,'en2pt')));});
    rev=rev.concat(embaralhar(extras).slice(0,4-rev.length));
  }
  const vocab=[];
  un.v.forEach((v,i)=>vocab.push({t:'ensinar',chave:cv(i),v}));
  un.v.forEach((v,i)=>vocab.push(exVocab(cv(i),v,'pt2en')));
  embaralhar(un.v.map((v,i)=>[v,i])).slice(0,4).forEach(p=>vocab.push(exVocab(cv(p[1]),p[0],'en2pt')));
  embaralhar(un.v.map((v,i)=>[v,i])).slice(0,3).forEach(p=>vocab.push(exVocab(cv(p[1]),p[0],'digitar')));
  const gram=[{t:'regra',g:un.g}];
  un.d.forEach((d,i)=>gram.push(exGram(cg(i),d)));
  un.g.ex.slice(0,2).forEach((e,i)=>gram.push(exOrd(cg(i),e[0],e[1])));
  const esc=embaralhar(un.v.map((v,i)=>[v,i])).slice(0,4).map(p=>exOuvir(cv(p[1]),p[0]));
  const prod=[{t:'escrever',pt:un.p.pt,en:un.p.en,chave:niv+'.'+ui+'.p'}];
  S={niv,ui,inicio:Date.now(),acertos:0,total:0,xp:0,
     blocos:[
      {nome:'Aquecimento',min:5,ex:rev.length?rev:[{t:'aviso',txt:'Primeira sessão — nada pra revisar.'}]},
      {nome:'Vocabulário',min:8,ex:vocab},{nome:'Gramática',min:7,ex:gram},
      {nome:'Escuta',min:5,ex:esc},{nome:'Produção',min:5,ex:prod}
     ],b:0,i:0,resposta:null};
}
function exAtual(){return S.blocos[S.b].ex[S.i];}
function avancar(){
  S.i++;
  if(S.i>=S.blocos[S.b].ex.length){S.b++;S.i=0;}
  if(S.b>=S.blocos.length){
    if(S.prova)finalizarProva();
    else if(S.revisao)finalizarRevisao();
    else finalizarSessao();
    return;
  }
  S.resposta=null;render();
}
function pontuar(ok,chave){S.total++;if(ok){S.acertos++;S.xp+=10;E.xp+=10;}if(chave)registrar(chave,ok);salvar();}

function finalizarSessao(){
  const min=Math.round((Date.now()-S.inicio)/60000);
  const prec=S.total?S.acertos/S.total:0;
  E.sessoes.push({d:hoje(),min,xp:S.xp,ac:S.acertos,tot:S.total,niv:S.niv,un:S.ui});
  const ontem=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(E.ultimoDia!==hoje()){
    if(E.ultimoDia===ontem)E.streak++;
    else if(E.streakFreeze>0){E.streakFreeze--;E.streak++;toast('❄️ Freeze usado');}
    else E.streak=1;
    E.ultimoDia=hoje();
  }
  let rec='';
  if(prec>=0.7){
    if(E.unidade<2){E.unidade++;rec='Unidade '+Math.round(prec*100)+'% ✓ Próxima liberada!';}
    else{E.prova=true;rec='Unidades fechadas! Teste liberado 🎉';}
  }else rec='Você fez '+Math.round(prec*100)+'%. Repetir é normal.';
  E.recado=rec;salvar();
  S.fim={min,prec,recado:rec};
  if(prec>=0.7){somNivel();setTimeout(soltarConfete,200);}
  render();verificarConquistas();
}

function finalizarRevisao(){
  const min=Math.round((Date.now()-S.inicio)/60000);
  const prec=S.total?S.acertos/S.total:0;
  E.sessoes.push({d:hoje(),min,xp:S.xp,ac:S.acertos,tot:S.total,niv:E.nivel,un:E.unidade,rev:1});
  const ontem=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(E.ultimoDia!==hoje()){
    E.streak=(E.ultimoDia===ontem)?E.streak+1:(E.streakFreeze>0?function(){E.streakFreeze--;return E.streak+1;}():1);
    E.ultimoDia=hoje();
  }
  E.recado='Revisão: '+Math.round(prec*100)+'%';
  salvar();S.fim={min,prec,recado:E.recado};render();
}

function montarProva(){
  const niv=E.nivel,itens=[];
  nivelObj(niv).u.forEach((u,ui)=>{
    u.v.forEach((v,i)=>itens.push(exVocab(niv+'.'+ui+'.'+i,v,Math.random()<.5?'pt2en':'en2pt')));
    u.d.forEach((d,i)=>itens.push(exGram(niv+'.'+ui+'.g'+i,d)));
  });
  S={prova:true,niv,inicio:Date.now(),acertos:0,total:0,xp:0,
     blocos:[{nome:'Teste',min:12,ex:embaralhar(itens).slice(0,16)}],b:0,i:0,resposta:null};
}
function finalizarProva(){
  const prec=S.total?S.acertos/S.total:0;
  if(prec>=0.8){
    E.carimbos[E.nivel]={d:hoje(),p:Math.round(prec*100)};E.xp+=200;
    if(E.nivel<CURSO.length){E.nivel++;E.unidade=0;E.prova=false;E.recado='Aprovado! Nível '+E.nivel+' ✕';}
    else{E.prova=false;E.recado='Curso completo! Parabens!';}
    setTimeout(()=>{somNivel();soltarConfete();},100);
  }else{
    let pior=0,piorTaxa=2;
    nivelObj(E.nivel).u.forEach((u,ui)=>{
      let a=0,t=0;u.v.forEach((v,i)=>{const it=E.itens[E.nivel+'.'+ui+'.'+i];if(it){a+=it.reps;t+=it.reps+it.lapsos;}});
      const tx=t?a/t:0;if(tx<piorTaxa){piorTaxa=tx;pior=ui;}
    });
    E.unidade=pior;E.prova=false;E.recado='Você fez '+Math.round(prec*100)+'%. Tente de novo.';
  }
  salvar();S.fim={prec,prova:true,recado:E.recado};render();verificarConquistas();
}

/* Tutor */
async function chamarIA(m,s){
  const cab={"Content-Type":"application/json"};
  let modelo="claude-sonnet-4-6";
  if(IA.chave){
    cab["x-api-key"]=IA.chave;cab["anthropic-version"]="2023-06-01";
    cab["anthropic-dangerous-direct-browser-access"]="true";
    modelo=IA.modelo||"claude-sonnet-5";
  }else if(typeof window.storage==='undefined')throw new Error("sem-credencial");
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:cab,body:JSON.stringify({model:modelo,max_tokens:1000,system:s,messages:m})});
  if(!r.ok){const t=await r.text();throw new Error(t.slice(0,200));}
  const d=await r.json();return d.content.filter(c=>c.type==="text").map(c=>c.text).join("\n").trim();
}
function sistemaTutor(){
  const niv=nivelObj(E.nivel),un=unidadeAtual();
  return "Tutor de inglês do Victor, brasileiro, nível "+E.nivel+" de 9 (tema: "+niv.nome+" — '"+un.t+"'). Converse EM INGLÊS bem simples. Responda no formato:\nEN: <resposta em inglês, máx 2 frases, terminando com pergunta>\nPT: <tradução>\nSe houver erro de inglês, comece PT com [correção: '...' → '...']";
}
async function enviarTutor(){
  const cx=$('#tutorTexto');const txt=cx.value.trim();if(!txt)return;
  initAudio();
  E.tutorHist.push({role:"user",content:txt});cx.value='';salvar();
  tutorPensando=true;render();
  try{
    const resp=await chamarIA(E.tutorHist.slice(-16),sistemaTutor());
    E.tutorHist.push({role:"assistant",content:resp});
  }catch(e){
    E.tutorHist.push({role:"assistant",content:"EN: (offline)\nPT: "+(String(e.message||'').indexOf('sem-credencial')>-1?'Falta a chave da API.':'Tutor offline.')});
  }
  if(E.tutorHist.length>40)E.tutorHist=E.tutorHist.slice(-40);
  tutorPensando=false;salvar();render();verificarConquistas();
  setTimeout(()=>{const c=$('#fimConversa');if(c)c.scrollIntoView({block:'end'});},60);
}
let tutorPensando=false;

async function corrigirComTutor(pt,en,minha){
  const cx=$('#retornoIA');if(cx)cx.innerHTML='<span class="escrevendo">Conferindo…</span>';
  try{
    const r=await chamarIA([{role:"user",content:"Pedido: "+pt+"\nEsperado: "+en+"\nAluno: "+minha+"\n\nCorrija em português, máx 3 linhas."}],
      "Professor corrigindo aluno iniciante.");
    if(cx)cx.innerHTML='<div class="retorno ok"><span class="t">Tutor</span>'+esc(r).replace(/\n/g,'<br>')+'</div>';
  }catch(e){if(cx)cx.innerHTML='<div class="retorno nao">Tutor offline.</div>';}
}

  if(!S)return '<div class="carta">Nenhuma sessão aberta.<button class="btn secundario pequeno" style="margin-top:10px" onclick="ir(\'painel\')">Voltar</button></div>';
  if(S.fim)return telaFimSessao();
  const b=S.blocos[S.b],ex=exAtual();
  const dec=Math.floor((Date.now()-S.inicio)/1000);
  const mm=String(Math.floor(dec/60)).padStart(2,'0'),ss=String(dec%60).padStart(2,'0');
  const alvo=S.prova?12:30;
  let h='<div class="sessao-topo"><div><div class="rotulo">'+esc(b.nome)+(S.prova?'':' · '+b.min+' min')+'</div>'+
       '<div class="dado" style="font-size:12px;color:var(--texto2);margin-top:3px">'+(S.i+1)+' / '+b.ex.length+'</div></div>'+
       '<div class="cronometro'+(dec>alvo*60?' estourou':'')+'">✕ '+mm+':'+ss+'</div></div>';

  h+='<div class="carta">'+corpoEx(ex)+'</div>';
  return h;
}
function corpoEx(ex){
  if(!ex)return '';
  const r=S.resposta;
  if(ex.t==='aviso')return '<div class="pt">'+esc(ex.txt)+'</div><button class="btn" style="margin-top:14px" onclick="avancar()">Seguir</button>';
  if(ex.t==='ensinar'){
    return '<div class="rotulo">✨ Palavra nova</div>'+
      '<div class="pergunta en">'+esc(ex.v[0])+'</div>'+
      '<div class="pt" style="font-size:15.5px">'+esc(ex.v[1])+'</div>'+
      '<button class="btn azul pequeno" style="margin-top:12px" onclick="falar(\''+ex.v[0].replace(/'/g,"\\'")+'\')">✕ Ouvir</button>'+
      '<div class="carta" style="margin:14px 0 0;background:rgba(255,255,255,.04)"><div style="font-size:15.5px">'+esc(ex.v[2])+'</div><div class="pt" style="margin-top:5px">'+esc(ex.v[3])+'</div>'+
      '<button class="btn azul pequeno" style="margin-top:10px" onclick="falar(\''+ex.v[2].replace(/'/g,"\\'")+'\')">🔊 Frase</button></div>'+
      '<button class="btn verde" style="margin-top:14px" onclick="avancar()">✅ Aprendi</button>';
  }
  if(ex.t==='regra'){
    return '<div class="rotulo">📚 Gramática</div><h2 style="margin:8px 0 12px">'+esc(ex.g.t)+'</h2>'+
      '<div style="font-size:15px;line-height:1.55">'+esc(ex.g.e)+'</div>'+
      '<div style="margin-top:14px">'+ex.g.ex.map(e=>'<div style="padding:10px 0;border-top:1px solid rgba(255,255,255,.08)"><div style="font-size:15.5px">'+esc(e[0])+'</div><div class="pt">'+esc(e[1])+'</div></div>').join('')+'</div>'+
      '<button class="btn" style="margin-top:8px" onclick="avancar()">Entendi 💪</button>';
  }
  if(ex.t==='mc'){
    let h='<div class="rotulo">'+esc(ex.rotulo)+'</div><div class="pergunta'+(ex.en?' en':'')+'">'+esc(ex.pergunta)+'</div>';
    if(ex.traducao)h+='<div class="pt">'+esc(ex.traducao)+'</div>';
    h+='<div class="opcoes">'+ex.opcoes.map((o,i)=>{
      let cl='opc';
      if(r!==null){if(i===ex.correta)cl+=r.i===i?' certa':' revelada';else if(r.i===i)cl+=' errada';}

function contarUso(ex,p,i){let u=ex.montada.filter(x=>x===p).length;let a=ex.chips.slice(0,i).filter(x=>x===p).length;return a<u;}
function porChip(i){const ex=exAtual();if(S.resposta!==null)return;const p=ex.chips[i];if(contarUso(ex,p,i))return;ex.montada.push(p);render();}
function tirarChip(i){const ex=exAtual();if(S.resposta!==null)return;ex.montada.splice(i,1);render();}
function responderMC(i){
  initAudio();
  const ex=exAtual();if(S.resposta!==null)return;
  const ok=i===ex.correta;S.resposta={i,ok,perfeito:ok};
  if(ok)somAcerto(true);else somErro();
  pontuar(ok,ex.chave);if(ex.som&&ok)falar(ex.som);render();
}
function responderDigitar(){
  initAudio();
  const ex=exAtual();const v=$('#campoResp').value.trim();if(!v)return;
  const d=dist(norm(v),norm(ex.resposta));
  const ok=d<=1,quase=ok&&d===1;
  S.resposta={txt:v,ok,quase,perfeito:ok&&d===0};
  if(ok&&d===0)somAcerto(true);else if(ok)somAcerto(false);else somErro();
  pontuar(ok,ex.chave);if(ok)falar(ex.resposta);render();
}
function responderOrdenar(){
  initAudio();
  const ex=exAtual();const ok=norm(ex.montada.join(' '))===norm(ex.frase);
  S.resposta={ok,perfeito:ok};
  if(ok)somAcerto(true);else somErro();
  pontuar(ok,ex.chave);if(ok)falar(ex.frase);render();
}
function responderEscrever(){
  initAudio();
  const ex=exAtual();const v=$('#campoResp').value.trim();if(!v)return;
  const a=norm(v).split(' '),b=norm(ex.en).split(' ');
  const iguais=b.filter(w=>a.indexOf(w)>-1).length;
  const ok=iguais/b.length>=0.75;
  S.resposta={txt:v,ok};
  if(ok)somAcerto(false);else somErro();
  pontuar(ok,ex.chave);render();
}

function importar(ev){

  const l=new FileReader();
  l.onload=()=>{
    try{

      if(!dados||typeof dados.nivel!=='number')throw new Error();
      E=Object.assign(JSON.parse(JSON.stringify(PADRAO)),migrar(dados));
      salvar();render();
      const st=$('#statusBackup');if(st)st.innerHTML='<div class="retorno ok">✅ Restaurado!</div>';
    }catch(e){const st=$('#statusBackup');if(st)st.innerHTML='<div class="retorno nao">❌ Arquivo inválido.</div>';}
  };l.readAsText(f);
}

  if(ex.t==='digitar'&&document.activeElement&&document.activeElement.id==='campoResp'){e.preventDefault();responderDigitar();}
});

(async()=>{await carregar();render();})();
</script>
