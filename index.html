<style>
:root{
  --tinta:#0F2027;
  --fundo:#E5EAE9;
  --carta:#FFFFFF;
  --teal:#12525E;
  --teal2:#2E8494;
  --ambar:#E89005;
  --magenta:#B32357;
  --verde:#2F7D50;
  --linha:rgba(15,32,39,.14);
  --suave:rgba(15,32,39,.55);
  --disp:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --corpo:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --dado:'Space Mono',ui-monospace,monospace;
}
/* 🆕 Modo alto contraste */
.alto-contraste{ --tinta:#000; --fundo:#fff; --carta:#fff; --suave:#333; --linha:#000; --teal:#000; --teal2:#000066; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fundo);
  color:var(--tinta);
  font-family:var(--corpo);
  font-size:16px;line-height:1.5;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:16px}
.app{max-width:560px;margin:0 auto;padding:14px 14px 24px}
.oculto{display:none !important}

/* tipografia */
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.05}
h1{font-size:30px}
h2{font-size:22px}
h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.rotulo{font-family:var(--dado);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.dado{font-family:var(--dado);font-weight:700;font-variant-numeric:tabular-nums}
.pt{color:var(--suave);font-size:14px}

/* topo */
.topo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.selo-nivel{background:var(--teal);color:#fff;border-radius:11px;padding:7px 11px;display:flex;flex-direction:column;line-height:1.1;min-width:62px}
.selo-nivel .n{font-family:var(--dado);font-size:19px;font-weight:700}
.selo-nivel .l{font-family:var(--dado);font-size:9px;letter-spacing:.12em;opacity:.75}
.topo-info{flex:1;min-width:0}
.topo-info .nome{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metricas{display:flex;gap:12px;margin-top:2px}
.metricas span{font-family:var(--dado);font-size:11.5px;color:var(--suave)}
.metricas b{color:var(--tinta)}

/* cartões */
.carta{background:var(--carta);border:1px solid var(--linha);border-radius:16px;padding:16px;margin-bottom:12px}
.carta.destaque{border-color:var(--teal);border-width:1.5px}
.carta-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}

/* botões */
.btn{display:block;width:100%;text-align:center;background:var(--teal);color:#fff;border-radius:12px;padding:15px;font-weight:600;font-size:16px;transition:transform .12s ease,background .12s ease}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:default}
.btn.secundario{background:transparent;color:var(--teal);border:1.5px solid var(--linha);font-weight:500}
.btn.ambar{background:var(--ambar);color:#241700}
.btn.pequeno{padding:10px 14px;font-size:14px;width:auto;display:inline-block}
button:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--teal2);outline-offset:2px}
.btn:focus-visible{outline-offset:3px}

/* barras */
.barra{height:7px;background:rgba(15,32,39,.09);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--ambar);border-radius:99px;transition:width .35s ease}
.barra.teal i{background:var(--teal2)}

/* semana */
.semana{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.dia{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--linha);display:flex;align-items:center;justify-content:center;font-family:var(--dado);font-size:11px;color:var(--suave)}
.dia.feito{background:var(--teal);border:1.5px solid var(--teal);color:#fff}
.dia.hoje{border-style:solid;border-color:var(--ambar);color:var(--tinta)}

/* sessão */
.sessao-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.blocos{display:flex;gap:4px;margin-bottom:16px}
.blocos i{flex:1;height:4px;border-radius:99px;background:rgba(15,32,39,.12)}
.blocos i.ativo{background:var(--teal)}
.blocos i.pronto{background:var(--verde)}
.cronometro{font-family:var(--dado);font-weight:700;font-size:15px}
.cronometro.estourou{color:var(--magenta)}

.pergunta{font-family:var(--disp);font-weight:600;font-size:23px;letter-spacing:-.02em;line-height:1.25;margin:6px 0 4px}
.pergunta.en{font-size:26px}
.opcoes{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opc{text-align:left;background:var(--carta);border:1.5px solid var(--linha);border-radius:12px;padding:14px 15px;font-size:16.5px;transition:border-color .12s,background .12s;width:100%}
.opc:active{background:#f4f6f6}
.opc.certa{border-color:var(--verde);background:rgba(47,125,80,.09)}
.opc.errada{border-color:var(--magenta);background:rgba(179,35,87,.08)}
.opc.revelada{border-color:var(--verde);border-style:dashed}
.opc:disabled{cursor:default;opacity:1}

.campo{width:100%;background:var(--carta);border:1.5px solid var(--linha);border-radius:12px;padding:14px;font-size:17px;color:var(--tinta);outline:none}
.campo:focus{border-color:var(--teal2)}
textarea.campo{min-height:96px;resize:vertical;line-height:1.45}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--carta);border:1.5px solid var(--linha);border-radius:10px;padding:10px 13px;font-size:16px}
.chip.usado{opacity:.28;pointer-events:none}
.linha-montada{min-height:52px;border-bottom:2px solid var(--linha);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px;align-items:flex-start}

.retorno{border-radius:12px;padding:13px 14px;margin-top:14px;font-size:15px;line-height:1.45}
.retorno.ok{background:rgba(47,125,80,.1);border-left:3px solid var(--verde)}
.retorno.nao{background:rgba(179,35,87,.09);border-left:3px solid var(--magenta)}
.retorno .t{font-weight:600;display:block;margin-bottom:3px}

.som{width:112px;height:112px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;margin:16px auto;font-size:40px}
.som:active{background:var(--teal2)}

/* passaporte */
.estampas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}
.estampa{position:relative;border:2px solid var(--linha);border-radius:12px;padding:13px 12px;background:var(--carta);min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.estampa .num{font-family:var(--dado);font-size:10px;letter-spacing:.14em;color:var(--suave)}
.estampa .tit{font-family:var(--disp);font-weight:800;font-size:15.5px;letter-spacing:-.02em;margin-top:4px}
.estampa.carimbada{border-color:var(--magenta);border-style:double;border-width:3px}
.estampa.carimbada .carimbo{position:absolute;right:8px;bottom:8px;transform:rotate(-11deg);border:2px solid var(--magenta);color:var(--magenta);border-radius:6px;font-family:var(--dado);font-size:9px;font-weight:700;letter-spacing:.08em;padding:3px 6px;text-transform:uppercase;opacity:.85}
.estampa.atual{border-color:var(--teal);border-width:2.5px}
.estampa.travada{opacity:.42}

/* tutor */
.conversa{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.bolha{max-width:86%;padding:12px 14px;border-radius:15px;font-size:15.5px;line-height:1.45}
.bolha.eu{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:5px}
.bolha.ia{align-self:flex-start;background:var(--carta);border:1px solid var(--linha);border-bottom-left-radius:5px}
.bolha .traducao{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed var(--linha);font-size:13.5px;color:var(--suave)}
.escrevendo{font-family:var(--dado);font-size:12px;color:var(--suave)}
.envio{display:flex;gap:8px;align-items:flex-end}
.envio .campo{flex:1}
.envio .btn{width:auto;padding:14px 18px}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--linha);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(8px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--suave);min-height:48px}
.nav button .ic{font-size:19px;line-height:1}
.nav button .tx{font-family:var(--dado);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase}
.nav button.ativo{color:var(--teal)}
.nav button:focus-visible{outline:2.5px solid var(--teal2);outline-offset:-2px}

/* 🆕 conquistas */
.grid-conquistas{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:10px}
.conquista{background:var(--carta);border:1.5px solid var(--linha);border-radius:12px;padding:12px 8px;text-align:center;transition:transform .2s}
.conquista.bloq{opacity:.35;filter:grayscale(1)}
.conquista.desb{border-color:var(--ambar);background:rgba(232,144,5,.08)}
.conquista .ico{font-size:28px;line-height:1;margin-bottom:6px}
.conquista .nm{font-family:var(--disp);font-weight:800;font-size:11.5px;letter-spacing:-.01em}
.conquista .dt{font-family:var(--dado);font-size:9px;color:var(--suave);margin-top:2px}

/* 🆕 dashboard stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.stat{background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:13px}
.stat .v{font-family:var(--dado);font-size:24px;font-weight:700}
.stat .l{font-family:var(--dado);font-size:9px;letter-spacing:.12em;color:var(--suave);margin-top:2px}

/* 🆕 toast / anúncio */
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90%;text-align:center;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

.rodape{text-align:center;margin-top:22px}
.link{color:var(--teal);text-decoration:underline;font-size:13.5px}
.aviso{background:rgba(232,144,5,.13);border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.4}

/* 🆕 instalação PWA banner */
.install-banner{position:fixed;bottom:74px;left:10px;right:10px;max-width:540px;margin:0 auto;background:var(--teal);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:15;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.install-banner button{background:#fff;color:var(--teal);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px}
.install-banner .x{padding:4px 8px;background:transparent;color:#fff}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* 🆕 sr-only — só para leitores de tela */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="app">
  <div class="topo" id="topo"></div>
  <div id="tela"></div>
  <div class="rodape" id="rodape"></div>
</div>

<!-- 🆕 banner PWA -->
<div id="installBanner" class="install-banner oculto" role="region" aria-label="Instalar app">
  <div style="flex:1;font-size:13.5px;line-height:1.3">📱 Instale o app na tela inicial pra estudar offline.</div>
  <button onclick="instalarPWA()" aria-label="Instalar">Instalar</button>
  <button class="x" onclick="fecharInstall()" aria-label="Fechar">✕</button>
</div>

<nav class="nav" id="nav" role="navigation" aria-label="Navegação principal"></nav>

<script>
/* ============================================================
   CURRÍCULO — 9 níveis x 3 unidades
   ============================================================ */
const CURSO = [
{n:1,nome:"Primeiras palavras",desc:"Cumprimentar, se apresentar, falar de pessoas e números.",u:[
 {t:"Cumprimentos",
  v:[["hello","olá","Hello! How are you?","Olá! Como você está?"],["good morning","bom dia","Good morning, everyone.","Bom dia, pessoal."],["my name is","meu nome é","My name is Victor.","Meu nome é Victor."],["nice to meet you","prazer em conhecer você","Nice to meet you, Ana.","Prazer em conhecer você, Ana."],["thank you","obrigado","Thank you very much.","Muito obrigado."],["goodbye","tchau / adeus","Goodbye, see you tomorrow.","Tchau, até amanhã."]],
  g:{t:"Verbo TO BE (ser/estar)",e:"Em inglês todo mundo precisa do verbo TO BE. São três formas no presente: I am (eu sou/estou), you are (você é/está), he/she/it is (ele/ela é/está). É como o cinto de segurança do carro: quase nenhuma frase sai sem ele.",
     ex:[["I am Victor.","Eu sou o Victor."],["You are my friend.","Você é meu amigo."],["She is tired.","Ela está cansada."]]},
  d:[["I ___ from Brazil.",["am","is","are"],0,"Eu sou do Brasil."],["She ___ my sister.",["am","is","are"],1,"Ela é minha irmã."],["You ___ very kind.",["am","is","are"],2,"Você é muito gentil."],["It ___ a good day.",["am","is","are"],1,"É um bom dia."]],
  p:{pt:"Escreva em inglês: Olá, meu nome é Victor. Prazer em conhecer você.",en:"Hello, my name is Victor. Nice to meet you."}},
 {t:"Pessoas e família",
  v:[["mother","mãe","My mother works here.","Minha mãe trabalha aqui."],["father","pai","His father is a driver.","O pai dele é motorista."],["brother","irmão","I have one brother.","Eu tenho um irmão."],["sister","irmã","My sister is a student.","Minha irmã é estudante."],["friend","amigo","She is my best friend.","Ela é minha melhor amiga."],["family","família","My family is big.","Minha família é grande."]],
  g:{t:"Artigos A / AN",e:"A e AN significam 'um/uma'. Use AN antes de som de vogal (a, e, i, o, u): an apple. Use A antes de consoante: a car. É só uma questão de a boca não tropeçar.",
     ex:[["a car","um carro"],["an apple","uma maçã"],["an hour","uma hora (o H é mudo)"]]},
  d:[["I have ___ brother.",["a","an"],0,"Eu tenho um irmão."],["She is ___ engineer.",["a","an"],1,"Ela é engenheira."],["This is ___ house.",["a","an"],0,"Esta é uma casa."],["He wants ___ orange.",["a","an"],1,"Ele quer uma laranja."]],
  p:{pt:"Escreva em inglês: Minha família é grande. Eu tenho um irmão e uma irmã.",en:"My family is big. I have one brother and one sister."}},
 {t:"Números e cores",
  v:[["one","um","I need one ticket.","Eu preciso de um bilhete."],["two","dois","Two coffees, please.","Dois cafés, por favor."],["three","três","Three days a week.","Três dias por semana."],["red","vermelho","The red car is mine.","O carro vermelho é meu."],["blue","azul","I like the blue one.","Eu gosto do azul."],["black","preto","A black phone.","Um telefone preto."]],
  g:{t:"Plural com -S",e:"Para falar de mais de um, coloca -s no fim: car → cars. Palavras terminadas em s, x, ch, sh ganham -es: box → boxes. Diferente do português, o adjetivo NÃO muda: two red cars (não 'two reds cars').",
     ex:[["one car / two cars","um carro / dois carros"],["one box / three boxes","uma caixa / três caixas"],["two blue doors","duas portas azuis"]]},
  d:[["I have two ___.",["car","cars"],1,"Eu tenho dois carros."],["Three ___ are here.",["boxes","boxs"],0,"Três caixas estão aqui."],["She has one ___.",["sister","sisters"],0,"Ela tem uma irmã."],["Two ___ phones.",["black","blacks"],0,"Dois telefones pretos."]],
  p:{pt:"Escreva em inglês: Eu tenho dois carros. Um é vermelho e um é azul.",en:"I have two cars. One is red and one is blue."}}
]},
{n:2,nome:"O dia a dia",desc:"Objetos, verbos básicos, rotina e perguntas simples.",u:[
 {t:"Objetos do dia a dia",
  v:[["phone","telefone","My phone is on the table.","Meu telefone está na mesa."],["car","carro","The car is new.","O carro é novo."],["house","casa","Their house is near.","A casa deles é perto."],["key","chave","I lost my key.","Eu perdi minha chave."],["water","água","I want water, please.","Eu quero água, por favor."],["money","dinheiro","I need more money.","Eu preciso de mais dinheiro."]],
  g:{t:"THIS / THAT / THESE / THOSE",e:"THIS = este (perto, um). THAT = aquele (longe, um). THESE = estes (perto, vários). THOSE = aqueles (longe, vários). Pense em braço: o que você alcança é this/these; o que precisa apontar é that/those.",
     ex:[["This phone is mine.","Este telefone é meu."],["That car is fast.","Aquele carro é rápido."],["These keys are old.","Estas chaves são velhas."]]},
  d:[["___ phone here is mine.",["This","That"],0,"Este telefone aqui é meu."],["___ cars over there are new.",["These","Those"],1,"Aqueles carros ali são novos."],["___ keys in my hand.",["These","Those"],0,"Estas chaves na minha mão."],["___ house is far.",["That","These"],0,"Aquela casa é longe."]],
  p:{pt:"Escreva em inglês: Este é meu telefone. Aquele carro é novo.",en:"This is my phone. That car is new."}},
 {t:"Verbos básicos",
  v:[["to eat","comer","I eat at noon.","Eu como ao meio-dia."],["to drink","beber","She drinks coffee.","Ela bebe café."],["to work","trabalhar","I work with glass.","Eu trabalho com vidro."],["to live","morar","They live in Rio.","Eles moram no Rio."],["to want","querer","I want a break.","Eu quero uma pausa."],["to have","ter","We have two cars.","Nós temos dois carros."]],
  g:{t:"Presente simples e o -S do he/she/it",e:"O verbo só muda numa pessoa: he, she, it ganham -S. I work, you work, WE work, mas HE workS. Chame de 'imposto do he/she/it': só eles pagam a letra extra.",
     ex:[["I work every day.","Eu trabalho todo dia."],["He works every day.","Ele trabalha todo dia."],["She has a car.","Ela tem um carro."]]},
  d:[["He ___ coffee every morning.",["drink","drinks"],1,"Ele bebe café toda manhã."],["I ___ in São Paulo.",["live","lives"],0,"Eu moro em São Paulo."],["She ___ two brothers.",["have","has"],1,"Ela tem dois irmãos."],["We ___ at 8 o'clock.",["start","starts"],0,"Nós começamos às 8 horas."]],
  p:{pt:"Escreva em inglês: Eu trabalho todo dia e minha irmã trabalha no sábado.",en:"I work every day and my sister works on Saturday."}},
 {t:"Tempo e rotina",
  v:[["morning","manhã","I run in the morning.","Eu corro de manhã."],["night","noite","I study at night.","Eu estudo à noite."],["today","hoje","Today is Monday.","Hoje é segunda-feira."],["tomorrow","amanhã","See you tomorrow.","Até amanhã."],["always","sempre","I always drink coffee.","Eu sempre bebo café."],["never","nunca","He never arrives late.","Ele nunca chega atrasado."]],
  g:{t:"Perguntas com DO / DOES",e:"Para perguntar no presente, o inglês precisa de um ajudante na frente: DO (I/you/we/they) ou DOES (he/she/it). E atenção: quando DOES entra, o verbo perde o -S. O ajudante carrega o peso: Does he work? (não 'Does he works').",
     ex:[["Do you work here?","Você trabalha aqui?"],["Does she like coffee?","Ela gosta de café?"],["I don't understand.","Eu não entendo."]]},
  d:[["___ you live in Brazil?",["Do","Does"],0,"Você mora no Brasil?"],["___ he work on Sunday?",["Do","Does"],1,"Ele trabalha no domingo?"],["Does she ___ coffee?",["drink","drinks"],0,"Ela bebe café?"],["I ___ have time today.",["don't","doesn't"],0,"Eu não tenho tempo hoje."]],
  p:{pt:"Escreva em inglês: Você trabalha de manhã? Eu sempre trabalho à noite.",en:"Do you work in the morning? I always work at night."}}
]},
{n:3,nome:"Lugares e direções",desc:"Se virar na cidade, dizer onde as coisas estão e dar instruções.",u:[
 {t:"Na cidade",
  v:[["street","rua","The store is on this street.","A loja fica nesta rua."],["store","loja","The store opens at nine.","A loja abre às nove."],["restaurant","restaurante","A good restaurant nearby.","Um bom restaurante perto."],["bank","banco","I go to the bank on Friday.","Eu vou ao banco na sexta."],["hospital","hospital","The hospital is far.","O hospital é longe."],["airport","aeroporto","My flight leaves from the airport.","Meu voo sai do aeroporto."]],
  g:{t:"THERE IS / THERE ARE",e:"É o 'há / tem' do inglês. THERE IS para um (there is a bank). THERE ARE para vários (there are two banks). Note que o inglês separa o 'ter posse' (have) do 'ter existência' (there is) — em português usamos 'tem' para os dois.",
     ex:[["There is a store here.","Tem uma loja aqui."],["There are three restaurants.","Tem três restaurantes."],["Is there a bank near here?","Tem um banco perto daqui?"]]},
  d:[["___ a hospital on this street.",["There is","There are"],0,"Tem um hospital nesta rua."],["___ many cars outside.",["There is","There are"],1,"Tem muitos carros lá fora."],["___ a bank near here?",["Is there","Are there"],0,"Tem um banco perto daqui?"],["There ___ two stores.",["is","are"],1,"Tem duas lojas."]],
  p:{pt:"Escreva em inglês: Tem um bom restaurante nesta rua.",en:"There is a good restaurant on this street."}},
 {t:"Onde as coisas estão",
  v:[["in","dentro de / em","The key is in my bag.","A chave está na minha bolsa."],["on","sobre / em cima","The phone is on the table.","O telefone está na mesa."],["at","em (ponto)","I am at work.","Eu estou no trabalho."],["near","perto","The store is near my house.","A loja é perto da minha casa."],["between","entre","Between the bank and the store.","Entre o banco e a loja."],["behind","atrás","The car is behind the house.","O carro está atrás da casa."]],
  g:{t:"IN / ON / AT",e:"IN = dentro de um espaço (in the car, in Brazil). ON = em cima de uma superfície (on the table, on the street). AT = num ponto exato (at home, at work, at 8 o'clock). Pense em zoom: IN é a cidade, ON é a rua, AT é a porta.",
     ex:[["in the car","dentro do carro"],["on the table","em cima da mesa"],["at the airport","no aeroporto"]]},
  d:[["The keys are ___ the table.",["in","on","at"],1,"As chaves estão em cima da mesa."],["I live ___ Brazil.",["in","on","at"],0,"Eu moro no Brasil."],["She is ___ home now.",["in","on","at"],2,"Ela está em casa agora."],["My office is ___ the bank.",["near","in"],0,"Meu escritório é perto do banco."]],
  p:{pt:"Escreva em inglês: A chave está em cima da mesa, perto do telefone.",en:"The key is on the table, near the phone."}},
 {t:"Direções",
  v:[["left","esquerda","Turn left at the corner.","Vire à esquerda na esquina."],["right","direita","The store is on the right.","A loja fica à direita."],["straight","reto","Go straight for two blocks.","Siga reto por dois quarteirões."],["corner","esquina","Wait at the corner.","Espere na esquina."],["block","quarteirão","It is two blocks away.","Fica a dois quarteirões."],["far","longe","Is it far from here?","É longe daqui?"]],
  g:{t:"Imperativo (dar instruções)",e:"Para mandar ou instruir, use o verbo puro, sem sujeito: Turn left. Go straight. Para negar, coloque DON'T na frente: Don't turn here. É o modo mais curto do inglês — e o mais usado em placa, receita e manual.",
     ex:[["Turn right.","Vire à direita."],["Don't stop here.","Não pare aqui."],["Call me later.","Me ligue mais tarde."]]},
  d:[["___ left at the bank.",["Turn","Turns"],0,"Vire à esquerda no banco."],["___ open the door.",["Don't","Doesn't"],0,"Não abra a porta."],["___ straight for one block.",["Go","Goes"],0,"Siga reto por um quarteirão."],["Please ___ me tomorrow.",["call","calls"],0,"Por favor, me ligue amanhã."]],
  p:{pt:"Escreva em inglês: Siga reto e vire à direita na esquina.",en:"Go straight and turn right at the corner."}}
]},
{n:4,nome:"Trabalho e comunicação",desc:"Falar do seu trabalho, do que está acontecendo agora e do que você sabe fazer.",u:[
 {t:"No trabalho",
  v:[["job","emprego / trabalho","I like my job.","Eu gosto do meu trabalho."],["meeting","reunião","The meeting starts at ten.","A reunião começa às dez."],["team","time / equipe","My team has six people.","Meu time tem seis pessoas."],["report","relatório","I am writing the report.","Eu estou escrevendo o relatório."],["manager","gerente","My manager is in a meeting.","Meu gerente está em reunião."],["customer","cliente","The customer is waiting.","O cliente está esperando."]],
  g:{t:"Presente contínuo (agora)",e:"Para o que acontece NESTE momento: TO BE + verbo com -ING. I am working = eu estou trabalhando. É a diferença entre 'eu trabalho aqui' (rotina, present simple) e 'eu estou trabalhando agora' (contínuo).",
     ex:[["I am working now.","Eu estou trabalhando agora."],["She is writing a report.","Ela está escrevendo um relatório."],["They are not listening.","Eles não estão ouvindo."]]},
  d:[["I ___ working right now.",["am","is","are"],0,"Eu estou trabalhando agora."],["She is ___ the report.",["write","writing"],1,"Ela está escrevendo o relatório."],["They ___ waiting outside.",["is","are"],1,"Eles estão esperando lá fora."],["We ___ having a meeting.",["are","is"],0,"Nós estamos tendo uma reunião."]],
  p:{pt:"Escreva em inglês: Eu estou escrevendo o relatório agora. Meu gerente está em reunião.",en:"I am writing the report now. My manager is in a meeting."}},
 {t:"Comunicação",
  v:[["to call","ligar","I will call you later.","Eu te ligo mais tarde."],["to send","enviar","Can you send the file?","Você pode enviar o arquivo?"],["to ask","perguntar","Ask me anything.","Me pergunte qualquer coisa."],["to answer","responder","She answered my email.","Ela respondeu meu e-mail."],["to explain","explicar","Let me explain it again.","Deixa eu explicar de novo."],["to agree","concordar","I agree with you.","Eu concordo com você."]],
  g:{t:"CAN / CAN'T",e:"CAN = poder ou saber fazer. Vantagem: nunca muda de forma e o verbo vem puro depois. He can speak (nunca 'he cans' nem 'he can speaks'). Para negar: can't. Para perguntar, inverte: Can you help me?",
     ex:[["I can speak English.","Eu sei falar inglês."],["He can't come today.","Ele não pode vir hoje."],["Can you help me?","Você pode me ajudar?"]]},
  d:[["___ you send the file?",["Can","Cans"],0,"Você pode enviar o arquivo?"],["He can ___ Spanish.",["speak","speaks"],0,"Ele sabe falar espanhol."],["I ___ come tomorrow.",["can't","don't can"],0,"Eu não posso vir amanhã."],["She can ___ the report today.",["finish","finishes"],0,"Ela consegue terminar o relatório hoje."]],
  p:{pt:"Escreva em inglês: Você pode me enviar o relatório? Eu não consigo abrir o arquivo.",en:"Can you send me the report? I can't open the file."}},
 {t:"Quantidade",
  v:[["some","algum / um pouco","I need some help.","Eu preciso de alguma ajuda."],["any","algum (pergunta/negativa)","Do you have any questions?","Você tem alguma pergunta?"],["many","muitos","Many people are waiting.","Muitas pessoas estão esperando."],["much","muito (não contável)","We don't have much time.","Nós não temos muito tempo."],["a few","alguns poucos","A few customers called.","Alguns clientes ligaram."],["enough","suficiente","We have enough money.","Nós temos dinheiro suficiente."]],
  g:{t:"Contável x não contável",e:"O inglês separa o que você consegue contar no dedo (cars, people, questions) do que só se mede (water, time, money, information). Contável usa many/a few; não contável usa much/a little. E cuidado: information e advice NÃO têm plural em inglês.",
     ex:[["many cars","muitos carros"],["much water","muita água"],["I have a few questions.","Eu tenho algumas perguntas."]]},
  d:[["We don't have ___ time.",["many","much"],1,"Nós não temos muito tempo."],["___ customers called today.",["Many","Much"],0,"Muitos clientes ligaram hoje."],["Do you have ___ questions?",["some","any"],1,"Você tem alguma pergunta?"],["I need ___ help.",["some","any"],0,"Eu preciso de alguma ajuda."]],
  p:{pt:"Escreva em inglês: Nós não temos muito tempo, mas eu tenho algumas perguntas.",en:"We don't have much time, but I have a few questions."}}
]},
{n:5,nome:"Falar do passado",desc:"Contar o que aconteceu — verbos regulares, irregulares e perguntas.",u:[
 {t:"Passado regular",
  v:[["worked","trabalhou / trabalhei","I worked late yesterday.","Eu trabalhei até tarde ontem."],["lived","morou / morei","She lived in Canada.","Ela morou no Canadá."],["started","começou / comecei","The meeting started at ten.","A reunião começou às dez."],["finished","terminou / terminei","We finished the report.","Nós terminamos o relatório."],["called","ligou / liguei","He called me twice.","Ele me ligou duas vezes."],["needed","precisou / precisei","They needed more time.","Eles precisaram de mais tempo."]],
  g:{t:"Passado simples com -ED",e:"A boa notícia: no passado o verbo é igual para todo mundo. I worked, he worked, they worked — um único formato. Só acrescenta -ED (ou -D se já termina em E: live → lived).",
     ex:[["I worked yesterday.","Eu trabalhei ontem."],["She called me.","Ela me ligou."],["We started early.","Nós começamos cedo."]]},
  d:[["I ___ late yesterday.",["work","worked"],1,"Eu trabalhei até tarde ontem."],["She ___ in Canada in 2019.",["lived","lives"],0,"Ela morou no Canadá em 2019."],["They ___ the meeting at ten.",["start","started"],1,"Eles começaram a reunião às dez."],["He ___ me twice.",["called","calls"],0,"Ele me ligou duas vezes."]],
  p:{pt:"Escreva em inglês: Eu trabalhei até tarde ontem e terminei o relatório.",en:"I worked late yesterday and finished the report."}},
 {t:"Passado irregular",
  v:[["went","foi / fui","I went to the bank.","Eu fui ao banco."],["saw","viu / vi","She saw the customer.","Ela viu o cliente."],["had","teve / tive","We had a meeting.","Nós tivemos uma reunião."],["made","fez / fiz","He made a mistake.","Ele cometeu um erro."],["took","pegou / peguei","I took the car.","Eu peguei o carro."],["said","disse","She said no.","Ela disse não."]],
  g:{t:"Irregulares e o DIDN'T",e:"Alguns verbos muito usados não seguem regra: go→went, see→saw, have→had. São os 'teimosos', e só a repetição resolve. Mas na negativa eles voltam ao normal: I didn't GO (nunca 'didn't went') — o DIDN'T já carrega o passado.",
     ex:[["I went to the bank.","Eu fui ao banco."],["I didn't go to the bank.","Eu não fui ao banco."],["She didn't see him.","Ela não o viu."]]},
  d:[["I ___ to the airport yesterday.",["went","goed"],0,"Eu fui ao aeroporto ontem."],["He didn't ___ the file.",["send","sent"],0,"Ele não enviou o arquivo."],["We ___ a long meeting.",["had","haved"],0,"Nós tivemos uma reunião longa."],["She didn't ___ anything.",["say","said"],0,"Ela não disse nada."]],
  p:{pt:"Escreva em inglês: Eu fui ao banco ontem, mas não vi o gerente.",en:"I went to the bank yesterday, but I didn't see the manager."}},
 {t:"Contar uma história",
  v:[["yesterday","ontem","Yesterday was busy.","Ontem foi corrido."],["last week","semana passada","We met last week.","Nós nos encontramos semana passada."],["ago","atrás","Two days ago.","Dois dias atrás."],["then","então / aí","Then he called me.","Aí ele me ligou."],["after","depois de","After the meeting, I left.","Depois da reunião, eu saí."],["before","antes de","Before lunch, I finished it.","Antes do almoço, eu terminei."]],
  g:{t:"Perguntas no passado com DID",e:"Mesma lógica do DO/DOES, só que no passado e sem exceção: DID para todo mundo. E o verbo volta à forma pura: Did you go? Did she work? O DID já avisa que é passado — o verbo não precisa avisar de novo.",
     ex:[["Did you call him?","Você ligou para ele?"],["Did she finish the report?","Ela terminou o relatório?"],["What did you do yesterday?","O que você fez ontem?"]]},
  d:[["___ you call the customer?",["Did","Do"],0,"Você ligou para o cliente?"],["Did she ___ the report?",["finish","finished"],0,"Ela terminou o relatório?"],["What ___ you do yesterday?",["did","do"],0,"O que você fez ontem?"],["I saw him two days ___.",["ago","before"],0,"Eu o vi dois dias atrás."]],
  p:{pt:"Escreva em inglês: Você ligou para o cliente ontem? Eu liguei depois da reunião.",en:"Did you call the customer yesterday? I called after the meeting."}}
]},
{n:6,nome:"Futuro e planos",desc:"Falar de planos, previsões e compromissos.",u:[
 {t:"Planos",
  v:[["to plan","planejar","We plan to grow this year.","Nós planejamos crescer este ano."],["to travel","viajar","I am going to travel in July.","Eu vou viajar em julho."],["to move","mudar (de lugar)","They are going to move offices.","Eles vão mudar de escritório."],["to learn","aprender","I am going to learn English.","Eu vou aprender inglês."],["to try","tentar","I will try again.","Eu vou tentar de novo."],["to decide","decidir","We decided to wait.","Nós decidimos esperar."]],
  g:{t:"GOING TO (plano já decidido)",e:"Use TO BE + going to + verbo para o que já está decidido ou é visível no horizonte: I am going to study tonight. É o futuro 'com data marcada na cabeça' — bem parecido com o nosso 'eu vou estudar'.",
     ex:[["I am going to study tonight.","Eu vou estudar hoje à noite."],["She is going to travel.","Ela vai viajar."],["It is going to rain.","Vai chover."]]},
  d:[["I ___ going to study tonight.",["am","is"],0,"Eu vou estudar hoje à noite."],["She is going to ___ in July.",["travel","travels"],0,"Ela vai viajar em julho."],["They ___ going to move.",["are","is"],0,"Eles vão mudar."],["It is going ___ rain.",["to","for"],0,"Vai chover."]],
  p:{pt:"Escreva em inglês: Eu vou aprender inglês este ano.",en:"I am going to learn English this year."}},
 {t:"Previsões",
  v:[["maybe","talvez","Maybe he will come.","Talvez ele venha."],["probably","provavelmente","She will probably agree.","Ela provavelmente vai concordar."],["sure","certo / certeza","I am sure about that.","Eu tenho certeza disso."],["soon","logo","I will call you soon.","Eu te ligo logo."],["later","mais tarde","Let's talk later.","Vamos conversar mais tarde."],["next","próximo","Next week is better.","Semana que vem é melhor."]],
  g:{t:"WILL (decisão na hora e previsão)",e:"WILL é o futuro de quem acabou de decidir ou de quem acha que vai acontecer: I'll help you. Nunca muda de forma e o verbo vem puro. Comparando: 'going to' é plano de agenda; 'will' é palpite ou promessa do momento.",
     ex:[["I will help you.","Eu vou te ajudar."],["It will be fine.","Vai dar certo."],["He won't come today.","Ele não virá hoje."]]},
  d:[["I ___ call you later.",["will","am"],0,"Eu te ligo mais tarde."],["She will ___ tomorrow.",["arrive","arrives"],0,"Ela vai chegar amanhã."],["He ___ come today.",["won't","doesn't will"],0,"Ele não virá hoje."],["It ___ probably rain.",["will","wills"],0,"Provavelmente vai chover."]],
  p:{pt:"Escreva em inglês: Eu te ligo mais tarde. Provavelmente vamos terminar amanhã.",en:"I will call you later. We will probably finish tomorrow."}},
 {t:"Compromissos e viagem",
  v:[["appointment","compromisso / consulta","I have an appointment at three.","Eu tenho um compromisso às três."],["ticket","passagem / bilhete","I bought the ticket online.","Eu comprei a passagem online."],["flight","voo","My flight is at seven.","Meu voo é às sete."],["hotel","hotel","The hotel is near the airport.","O hotel é perto do aeroporto."],["schedule","agenda / cronograma","Check my schedule, please.","Confira minha agenda, por favor."],["luggage","bagagem","My luggage is heavy.","Minha bagagem está pesada."]],
  g:{t:"Contínuo com valor de futuro",e:"Para compromisso já marcado, o inglês usa o presente contínuo: I am meeting the client at 3. Soa mais natural que 'will' aqui. É o futuro que já está na agenda, com hora e tudo.",
     ex:[["I am meeting him at three.","Eu vou encontrá-lo às três."],["We are flying on Monday.","Nós voamos na segunda."],["She is arriving tonight.","Ela chega hoje à noite."]]},
  d:[["I ___ meeting the client at three.",["am","will"],0,"Eu vou encontrar o cliente às três."],["We are ___ on Monday.",["flying","fly"],0,"Nós voamos na segunda."],["My flight ___ at seven.",["is","are"],0,"Meu voo é às sete."],["She is ___ tonight.",["arriving","arrive"],0,"Ela chega hoje à noite."]],
  p:{pt:"Escreva em inglês: Meu voo é às sete. Eu vou encontrar o cliente amanhã.",en:"My flight is at seven. I am meeting the client tomorrow."}}
]},
{n:7,nome:"Comparar e opinar",desc:"Descrever, comparar, dar opinião e falar de sentimentos.",u:[
 {t:"Adjetivos úteis",
  v:[["cheap","barato","This one is cheaper.","Este é mais barato."],["expensive","caro","That car is expensive.","Aquele carro é caro."],["easy","fácil","The test was easy.","A prova foi fácil."],["difficult","difícil","English is not difficult.","Inglês não é difícil."],["fast","rápido","He works fast.","Ele trabalha rápido."],["slow","devagar / lento","The system is slow.","O sistema está lento."]],
  g:{t:"Comparativo (-ER / MORE)",e:"Palavra curta ganha -ER: cheap → cheaper. Palavra longa (3+ sílabas) usa MORE na frente: expensive → more expensive. E o 'do que' é THAN. Regra do bolso: se a palavra é curta, ela mesma carrega o peso; se é longa, pede ajuda.",
     ex:[["This is cheaper than that.","Este é mais barato que aquele."],["It is more expensive.","É mais caro."],["Better than yesterday.","Melhor que ontem."]]},
  d:[["This car is ___ than mine.",["faster","more fast"],0,"Este carro é mais rápido que o meu."],["That hotel is ___ expensive.",["more","most"],0,"Aquele hotel é mais caro."],["Today is better ___ yesterday.",["than","that"],0,"Hoje está melhor que ontem."],["The test was ___ than I thought.",["easier","more easy"],0,"A prova foi mais fácil do que eu pensava."]],
  p:{pt:"Escreva em inglês: Este carro é mais rápido, mas aquele é mais barato.",en:"This car is faster, but that one is cheaper."}},
 {t:"Dar opinião",
  v:[["I think","eu acho","I think it works.","Eu acho que funciona."],["in my opinion","na minha opinião","In my opinion, it is late.","Na minha opinião, está tarde."],["I agree","eu concordo","I agree with Ana.","Eu concordo com a Ana."],["I disagree","eu discordo","I disagree, sorry.","Eu discordo, desculpe."],["because","porque","Because we need time.","Porque nós precisamos de tempo."],["however","porém","However, it is expensive.","Porém, é caro."]],
  g:{t:"Superlativo (THE -EST / THE MOST)",e:"Para dizer 'o mais de todos', use THE: the cheapest, the most expensive. O THE é obrigatório — se só existe um campeão, o inglês exige o artigo definido.",
     ex:[["the cheapest option","a opção mais barata"],["the most expensive car","o carro mais caro"],["the best solution","a melhor solução"]]},
  d:[["This is ___ option we have.",["the cheapest","cheapest"],0,"Esta é a opção mais barata que temos."],["It is the ___ expensive one.",["most","more"],0,"É o mais caro."],["He is ___ person on the team.",["the best","best"],0,"Ele é a melhor pessoa do time."],["I think it is ___ way.",["the fastest","the most fast"],0,"Eu acho que é o jeito mais rápido."]],
  p:{pt:"Escreva em inglês: Na minha opinião, esta é a melhor opção porque é mais barata.",en:"In my opinion, this is the best option because it is cheaper."}},
 {t:"Sentimentos",
  v:[["tired","cansado","I am tired today.","Eu estou cansado hoje."],["worried","preocupado","She is worried about it.","Ela está preocupada com isso."],["excited","animado","We are excited about the trip.","Nós estamos animados com a viagem."],["bored","entediado","He was bored in the meeting.","Ele ficou entediado na reunião."],["proud","orgulhoso","I am proud of my team.","Eu tenho orgulho do meu time."],["upset","chateado","The customer was upset.","O cliente ficou chateado."]],
  g:{t:"-ED x -ING nos adjetivos",e:"-ED descreve como VOCÊ está: I am bored (eu estou entediado). -ING descreve como a COISA é: the meeting is boring (a reunião é chata). Trocar isso gera a frase mais engraçada do inglês: 'I am boring' = eu sou chato.",
     ex:[["I am bored.","Eu estou entediado."],["The movie is boring.","O filme é chato."],["She is interested in the project.","Ela está interessada no projeto."]]},
  d:[["I am ___ today.",["tired","tiring"],0,"Eu estou cansado hoje."],["This meeting is ___.",["boring","bored"],0,"Esta reunião é chata."],["We are ___ about the trip.",["excited","exciting"],0,"Nós estamos animados com a viagem."],["The news was ___.",["surprising","surprised"],0,"A notícia foi surpreendente."]],
  p:{pt:"Escreva em inglês: Eu estou cansado, mas estou animado com o projeto.",en:"I am tired, but I am excited about the project."}}
]},
{n:8,nome:"Experiências",desc:"Present perfect, phrasal verbs e o inglês que soa natural.",u:[
 {t:"Já / nunca / ainda",
  v:[["ever","alguma vez","Have you ever been to the US?","Você já esteve nos EUA?"],["never","nunca","I have never seen that.","Eu nunca vi isso."],["already","já","I have already sent it.","Eu já enviei."],["yet","ainda","He hasn't answered yet.","Ele ainda não respondeu."],["just","acabou de","She has just arrived.","Ela acabou de chegar."],["since","desde","I have worked here since 2020.","Eu trabalho aqui desde 2020."]],
  g:{t:"Present perfect (HAVE + particípio)",e:"HAVE/HAS + verbo no particípio (done, seen, been). Serve para experiência de vida sem data (I have been to Chile) e para o que começou antes e continua (I have worked here since 2020). Pense numa ponte: liga o passado ao agora. Se você disser a data exata, a ponte cai e vira past simple.",
     ex:[["I have finished the report.","Eu terminei o relatório."],["She has never seen it.","Ela nunca viu isso."],["Have you ever worked abroad?","Você já trabalhou fora?"]]},
  d:[["I ___ already sent the file.",["have","has"],0,"Eu já enviei o arquivo."],["She ___ never seen it.",["has","have"],0,"Ela nunca viu isso."],["He hasn't answered ___.",["yet","already"],0,"Ele ainda não respondeu."],["Have you ___ been to London?",["ever","never"],0,"Você já esteve em Londres?"]],
  p:{pt:"Escreva em inglês: Eu já enviei o relatório, mas ele ainda não respondeu.",en:"I have already sent the report, but he hasn't answered yet."}},
 {t:"Phrasal verbs",
  v:[["look for","procurar","I am looking for my keys.","Eu estou procurando minhas chaves."],["give up","desistir","Don't give up now.","Não desista agora."],["find out","descobrir","We found out yesterday.","Nós descobrimos ontem."],["come back","voltar","She comes back on Monday.","Ela volta na segunda."],["turn on","ligar (aparelho)","Turn on the light, please.","Acenda a luz, por favor."],["take care of","cuidar de","I take care of the reports.","Eu cuido dos relatórios."]],
  g:{t:"Phrasal verbs separáveis",e:"Verbo + preposição forma um significado novo: look = olhar, mas look for = procurar. Alguns aceitam o objeto no meio: turn the light on = turn on the light. Mas se o objeto for pronome, ele SEMPRE fica no meio: turn it on (nunca 'turn on it').",
     ex:[["Turn on the TV. / Turn it on.","Ligue a TV. / Ligue ela."],["I am looking for my phone.","Estou procurando meu telefone."],["Don't give up.","Não desista."]]},
  d:[["I am looking ___ my keys.",["for","at"],0,"Estou procurando minhas chaves."],["Turn ___ the light, please.",["on","in"],0,"Acenda a luz, por favor."],["Please turn ___ on.",["it","on it"],0,"Por favor, ligue ele."],["Don't give ___ now.",["up","out"],0,"Não desista agora."]],

const CHAVE='ingles30:progresso';
const CHAVE_IA='ingles30:credencial';
const CHAVE_VER='ingles30:versao';
const VERSAO=2;
const PADRAO={v:2,nome:"",nivel:1,unidade:0,xp:0,streak:0,streakFreeze:0,ultimoDia:null,itens:{},sessoes:[],carimbos:{},prova:false,recado:"",tutorHist:[],voz:'',vel:0.95,conquistas:[],config:{altoContraste:false,lembrete:false,horarioLembrete:"19:00"}};
let E=JSON.parse(JSON.stringify(PADRAO));
let tela='painel', memoriaOk=true, salvando=null;
let IA={chave:'',modelo:'claude-sonnet-5'};

const MEM={};
const Guarda={
  onde:'memoria',
  async ler(k){
    if(typeof window.storage!=='undefined'){
      try{ const r=await window.storage.get(k); this.onde='claude'; return r&&r.value?r.value:null; }catch(e){ this.onde='claude'; return null; }
    }
    try{ const v=localStorage.getItem(k); this.onde='navegador'; return v; }catch(e){}
    return MEM[k]||null;
  },
  async gravar(k,v){
    MEM[k]=v;
    if(typeof window.storage!=='undefined'){
      try{ await window.storage.set(k,v); this.onde='claude'; return true; }catch(e){ return false; }
    }
    try{ localStorage.setItem(k,v); this.onde='navegador'; return true; }catch(e){}
    this.onde='memoria'; return false;
  }
};

async function carregar(){
  const bruto=await Guarda.ler(CHAVE);
  if(bruto){
    try{
      const parsed=JSON.parse(bruto);
      // migração v1 -> v2: converte formato antigo se necessário
      const migrado=migrarProgresso(parsed);
      E=Object.assign(JSON.parse(JSON.stringify(PADRAO)),migrado);
    }catch(e){}
  }
  const cred=await Guarda.ler(CHAVE_IA);
  if(cred){ try{ IA=Object.assign(IA,JSON.parse(cred)); }catch(e){} }
  await Guarda.gravar(CHAVE_VER,String(VERSAO));
  memoriaOk = Guarda.onde!=='memoria';
  aplicarTema();
}

// 🆕 Migração: aceita tanto formato v1 quanto v2
function migrarProgresso(p){
  if(!p||typeof p!=='object')return p;
  // se já tem v=2, está ok
  if(p.v===2)return p;
  // v1 não tinha v nem conquistas — só garantir campos novos
  return Object.assign({},p,{
    v:2,
    conquistas:p.conquistas||[],
    streakFreeze:p.streakFreeze||0,
    config:p.config||{altoContraste:false,lembrete:false,horarioLembrete:"19:00"},
    itens:p.itens||{},
    sessoes:p.sessoes||[],
    carimbos:p.carimbos||{},
    tutorHist:p.tutorHist||[]
  });
}

function salvar(){
  clearTimeout(salvando);
  salvando=setTimeout(async()=>{
    const ok=await Guarda.gravar(CHAVE,JSON.stringify(E));
    if(!ok){ memoriaOk=false; }
  },400);
}
async function salvarCredencial(){
  IA.chave=$('#campoChave').value.trim();
  IA.modelo=($('#campoModelo').value.trim())||'claude-sonnet-5';

  $('#statusIA').innerHTML='<div class="retorno ok">Credencial guardada neste computador. O tutor já pode ser usado.</div>';

function aplicarTema(){

}

function dist(a,b){
  const m=[];for(let i=0;i<=b.length;i++){m[i]=[i];for(let j=0;j<=a.length;j++){if(i===0)m[0][j]=j;
  else m[i][j]=b[i-1]===a[j-1]?m[i-1][j-1]:Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);}}
  return m[b.length][a.length];
}

  if(!('speechSynthesis' in window))return [];
  return speechSynthesis.getVoices().filter(v=>v.lang&&/^en/i.test(v.lang));

function notaVoz(v){
  const n=(v.name||'')+' '+(v.voiceURI||''); let p=0;
  if(/natural|neural|premium|enhanced|online/i.test(n))p+=6;
  if(/google/i.test(n))p+=4;
  if(/samantha|ava|siri|aria|jenny|allison|nicky/i.test(n))p+=3;
  if(/^en-US/i.test(v.lang))p+=2; else if(/^en-GB/i.test(v.lang))p+=1;
  if(/compact|espeak|david|zira|mark/i.test(n))p-=3;
  if(v.localService===false)p+=1;
  return p;
}
function melhorVoz(){
  const vs=vozesEN(); if(!vs.length)return null;
  if(E.voz){ const m=vs.find(v=>v.voiceURI===E.voz); if(m)return m; }
  return vs.slice().sort((a,b)=>notaVoz(b)-notaVoz(a))[0];
}

  if(!('speechSynthesis' in window))return;
  clearTimeout(filaVoz);

  filaVoz=setTimeout(()=>{

/* ============================================================
   🆕 FSRS — Repetição Espaçada Inteligente
   Substitui o SRS simples por um modelo baseado em estabilidade/dificuldade
   inspirado no FSRS do Anki. Muito mais eficiente na retenção real.
   ============================================================ */
function novoItemFSRS(){
  return { tipo:'novo', estabilidade:1, dificuldade:5, intervalo:1, reps:0, lapsos:0, due:Date.now(), criado:Date.now() };
}
function agendarFSRS(item, acertou, qualidade){
  // qualidade: 1=fácil, 2=difícil (didigitar com erro conta como difícil)
  item.reps++;
  if(!acertou) item.lapsos++;
  
  if(qualidade===2){
    // resposta difícil: aumenta dificuldade, reduz estabilidade
    item.dificuldade = Math.min(10, item.dificuldade + 0.5);
    item.estabilidade = Math.max(0.5, item.estabilidade * 0.5);
    item.intervalo = 1;
  } else {
    // acerto fácil: cresce a estabilidade baseado na dificuldade atual
    item.dificuldade = Math.max(1, item.dificuldade - 0.1);
    const fator = 1 + (10 - item.dificuldade) / 20;
    item.estabilidade = Math.max(1, item.estabilidade * fator);
    item.intervalo = Math.max(1, Math.round(item.estabilidade));
  }
  
  item.due = Date.now() + item.intervalo * 864e5;
  item.tipo = 'revisao';
  return item;
}
function registrar(chave,acertou,qualidade){
  let it=E.itens[chave];
  if(!it) it=novoItemFSRS();
  agendarFSRS(it, !!acertou, qualidade||(acertou?1:2));
  E.itens[chave]=it; salvar();
  verificarConquistas('registrar');
}
function devidos(){
  const agora=Date.now();
  return Object.keys(E.itens).filter(k=>E.itens[k].due<=agora)
    .sort((a,b)=>E.itens[a].due-E.itens[b].due);
}
function devidosHoje(){
  return devidos().length;
}
function palavrasAprendidas(){
  // considera aprendida se já foi vista 3+ vezes com mais acertos que erros
  return Object.values(E.itens).filter(it => it.reps>=3 && it.lapsos < it.reps/2).length;
}
function totalEstudado(){
  return Object.values(E.itens).reduce((acc,it)=>acc+it.reps,0);
}
function taxaAcertoGlobal(){
  const itens=Object.values(E.itens);
  if(!itens.length)return 0;
  const tot=itens.reduce((a,it)=>a+it.reps,0);
  const err=itens.reduce((a,it)=>a+it.lapsos,0);
  return tot?Math.round((1-err/tot)*100):0;
}
function itemPorChave(k){
  const p=k.split('.'); const niv=CURSO[+p[0]-1]; if(!niv)return null;
  const un=niv.u[+p[1]]; if(!un)return null;
  if(p[2][0]==='g'){ const d=un.d[+p[2].slice(1)]; return d?{tipo:'g',d:d,un:un,niv:niv,chave:k}:null; }
  const v=un.v[+p[2]]; return v?{tipo:'v',v:v,un:un,niv:niv,chave:k}:null;
}
function dominio(nivel){
  let tot=0,bons=0;
  CURSO[nivel-1].u.forEach((u,ui)=>u.v.forEach((v,vi)=>{
    tot++; const it=E.itens[nivel+'.'+ui+'.'+vi];
    if(it&&it.reps>=2&&it.lapsos<it.reps)bons++;
  }));
  return tot?bons/tot:0;
}

/* ============================================================

   ============================================================ */
function distratores(certo,fonte,n){
  const pool=embaralhar(fonte.filter(x=>x!==certo)).slice(0,n);
  return embaralhar(pool.concat([certo]));
}
function todasTraducoes(){const r=[];CURSO.forEach(n=>n.u.forEach(u=>u.v.forEach(v=>r.push(v[1]))));return r;}
function todasPalavras(){const r=[];CURSO.forEach(n=>n.u.forEach(u=>u.v.forEach(v=>r.push(v[0]))));return r;}

function exVocab(chave,v,modo){
  if(modo==='pt2en'){
    const ops=distratores(v[0],todasPalavras(),3);
    return {t:'mc',chave:chave,pergunta:v[1],rotulo:'Como se diz em inglês?',opcoes:ops,correta:ops.indexOf(v[0]),som:v[0],exemplo:v[2],exemploPt:v[3]};
  }
  if(modo==='en2pt'){
    const ops=distratores(v[1],todasTraducoes(),3);
    return {t:'mc',chave:chave,pergunta:v[0],en:true,rotulo:'O que significa?',opcoes:ops,correta:ops.indexOf(v[1]),som:v[0],exemplo:v[2],exemploPt:v[3]};
  }
  return {t:'digitar',chave:chave,pergunta:v[1],rotulo:'Escreva em inglês',resposta:v[0],som:v[0],exemplo:v[2],exemploPt:v[3]};
}
function exOuvir(chave,v){
  const ops=distratores(v[1],todasTraducoes(),3);
  return {t:'ouvir',chave:chave,frase:v[2],fraseTraducao:v[3],rotulo:'Ouça e escolha o sentido',opcoes:ops,correta:ops.indexOf(v[1]),som:v[2],dica:v[0]};
}
function exGram(chave,d){
  return {t:'mc',chave:chave,pergunta:d[0],en:true,rotulo:'Complete a frase',opcoes:d[1].slice(),correta:d[2],traducao:d[3],som:d[0].replace('___',d[1][d[2]])};
}
function exOrdenar(chave,frase,trad){
  return {t:'ordenar',chave:chave,frase:frase,traducao:trad,rotulo:'Monte a frase na ordem certa',som:frase};
}

let S=null;

function exerciciosRevisao(max){
  const dv=devidos().slice(0,max), out=[];
  dv.forEach(k=>{
    const it=itemPorChave(k); if(!it)return;
    if(it.tipo==='v') out.push(exVocab(k,it.v,Math.random()<.5?'pt2en':'en2pt'));
    else out.push(exGram(k,it.d));
  });
  return out;
}
function montarSessao(){
  const niv=E.nivel, ui=Math.min(E.unidade,2), un=nivelObj(niv).u[ui];
  const cv=i=>niv+'.'+ui+'.'+i, cg=i=>niv+'.'+ui+'.g'+i;

  let rev=exerciciosRevisao(8);
  if(rev.length<4){
    const extras=[];
    nivelObj(niv).u.forEach((u,x)=>{ if(x<ui) u.v.forEach((v,i)=>extras.push(exVocab(niv+'.'+x+'.'+i,v,'en2pt'))); });
    rev=rev.concat(embaralhar(extras).slice(0,4-rev.length));
  }

  const vocab=[];
  un.v.forEach((v,i)=>vocab.push({t:'ensinar',chave:cv(i),v:v}));
  un.v.forEach((v,i)=>vocab.push(exVocab(cv(i),v,'pt2en')));
  embaralhar(un.v.map((v,i)=>[v,i])).slice(0,4).forEach(p=>vocab.push(exVocab(cv(p[1]),p[0],'en2pt')));
  embaralhar(un.v.map((v,i)=>[v,i])).slice(0,3).forEach(p=>vocab.push(exVocab(cv(p[1]),p[0],'digitar')));

  const gram=[{t:'regra',g:un.g}];
  un.d.forEach((d,i)=>gram.push(exGram(cg(i),d)));
  un.g.ex.slice(0,2).forEach((e,i)=>gram.push(exOrdenar(cg(i),e[0],e[1])));

  const escuta=embaralhar(un.v.map((v,i)=>[v,i])).slice(0,4).map(p=>exOuvir(cv(p[1]),p[0]));

  const prod=[{t:'escrever',pt:un.p.pt,en:un.p.en,chave:niv+'.'+ui+'.p'}];

  S={
    niv:niv,ui:ui,inicio:Date.now(),acertos:0,total:0,xp:0,
    blocos:[
      {nome:'Aquecimento',min:5,ex:rev.length?rev:[{t:'aviso',txt:'Primeira sessão do curso — nada para revisar ainda. Bora direto para o novo.'}]},
      {nome:'Vocabulário',min:8,ex:vocab},
      {nome:'Gramática',min:7,ex:gram},
      {nome:'Escuta',min:5,ex:escuta},
      {nome:'Produção',min:5,ex:prod}
    ],
    b:0,i:0,resposta:null
  };
}
function exAtual(){ const b=S.blocos[S.b]; return b?b.ex[S.i]:null; }
function avancar(){
  S.i++;
  if(S.i>=S.blocos[S.b].ex.length){ S.b++; S.i=0; }
  if(S.b>=S.blocos.length){
    if(S.prova) finalizarProva();
    else if(S.revisao) finalizarRevisao();
    else finalizarSessao();
    return;
  }
  S.resposta=null; render();
}
function pontuar(acertou,chave,qualidade){
  S.total++; if(acertou){S.acertos++;S.xp+=10;E.xp+=10;}
  if(chave) registrar(chave,acertou,qualidade);
  salvar();
}

/* ============================================================
   FIM DE SESSÃO
   ============================================================ */
function finalizarSessao(){
  const min=Math.round((Date.now()-S.inicio)/60000);
  const prec=S.total?S.acertos/S.total:0;
  E.sessoes.push({d:hoje(),min:min,xp:S.xp,ac:S.acertos,tot:S.total,niv:S.niv,un:S.ui});
  
  //   streak com freeze
  const ontem=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(E.ultimoDia!==hoje()){
    if(E.ultimoDia===ontem){
      E.streak++;
    } else if(E.streakFreeze>0){
      // perdeu um dia mas tem freeze — usa
      E.streakFreeze--;
      E.streak++;
      toast('❄️ Streak freeze usado. Você tem '+E.streakFreeze+' restantes.', 4000);
    } else {
      E.streak=1;
    }
    E.ultimoDia=hoje();
  }

  let recado='';
  if(prec>=0.7){
    if(E.unidade<2){ E.unidade++; recado='Unidade concluída com '+Math.round(prec*100)+'% de acerto. Próxima unidade liberada.'; }
    else { E.prova=true; recado='Você fechou as três unidades do nível '+E.nivel+'. O teste de nível está liberado.'; }
  } else {
    recado='Você fez '+Math.round(prec*100)+'% de acerto — abaixo dos 70% necessários. Vamos repetir esta unidade na próxima sessão. Isso é normal e é assim que fixa.';
  }
  E.recado=recado; salvar();
  S.fim={min:min,prec:prec,recado:recado}; render();
  verificarConquistas('sessao');
}

function finalizarRevisao(){
  const min=Math.round((Date.now()-S.inicio)/60000);
  const prec=S.total?S.acertos/S.total:0;
  E.sessoes.push({d:hoje(),min:min,xp:S.xp,ac:S.acertos,tot:S.total,niv:E.nivel,un:E.unidade,rev:1});
  const ontem=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(E.ultimoDia!==hoje()){
    E.streak = (E.ultimoDia===ontem)?E.streak+1:(E.streakFreeze>0?function(){E.streakFreeze--;return E.streak+1;}():1);
    E.ultimoDia=hoje();
  }
  const rec='Revisão feita: '+Math.round(prec*100)+'% de acerto. O que você errou volta amanhã; o que acertou volta mais para frente. Seu nível e sua unidade continuam onde estavam.';
  E.recado=rec; salvar();
  S.fim={min:min,prec:prec,recado:rec}; render();
}

function montarProva(){
  const niv=E.nivel, itens=[];
  nivelObj(niv).u.forEach((u,ui)=>{
    u.v.forEach((v,i)=>itens.push(exVocab(niv+'.'+ui+'.'+i,v,Math.random()<.5?'pt2en':'en2pt')));
    u.d.forEach((d,i)=>itens.push(exGram(niv+'.'+ui+'.g'+i,d)));
  });
  S={prova:true,niv:niv,inicio:Date.now(),acertos:0,total:0,xp:0,
     blocos:[{nome:'Teste de nível',min:12,ex:embaralhar(itens).slice(0,16)}],b:0,i:0,resposta:null};
}
function finalizarProva(){
  const prec=S.total?S.acertos/S.total:0;
  if(prec>=0.8){
    E.carimbos[E.nivel]={d:hoje(),p:Math.round(prec*100)};
    E.xp+=200;
    if(E.nivel<CURSO.length){ E.nivel++; E.unidade=0; E.prova=false;
      E.recado='Nível aprovado com '+Math.round(prec*100)+'%. Carimbo no passaporte e bem-vindo ao nível '+E.nivel+'.'; }
    else { E.prova=false; E.recado='Você terminou o nível 9 — o curso inteiro. Daqui em diante, use o Tutor e a revisão para manter.'; }
  } else {
    let pior=0,piorTaxa=2;
    nivelObj(E.nivel).u.forEach((u,ui)=>{
      let a=0,t=0;
      u.v.forEach((v,i)=>{const it=E.itens[E.nivel+'.'+ui+'.'+i];if(it){a+=it.reps;t+=it.reps+it.lapsos;}});
      const taxa=t?a/t:0; if(taxa<piorTaxa){piorTaxa=taxa;pior=ui;}
    });
    E.unidade=pior; E.prova=false;
    E.recado='Você fez '+Math.round(prec*100)+'% no teste (precisa de 80%). Voltamos para a unidade "'+nivelObj(E.nivel).u[pior].t+'", que foi a mais frágil.';
  }
  salvar(); S.fim={prec:prec,prova:true,recado:E.recado}; render();
  verificarConquistas('prova');
}

async function chamarIA(mensagens,sistema){
  const cab={"Content-Type":"application/json"};
  let modelo="claude-sonnet-4-6";
  if(IA.chave){
    cab["x-api-key"]=IA.chave;
    cab["anthropic-version"]="2023-06-01";
    cab["anthropic-dangerous-direct-browser-access"]="true";
    modelo=IA.modelo||"claude-sonnet-5";
  } else if(typeof window.storage==='undefined'){
    throw new Error("sem-credencial");
  }
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:cab,
    body:JSON.stringify({model:modelo,max_tokens:1000,system:sistema,messages:mensagens})
  });
  if(!r.ok){ const t=await r.text(); throw new Error(t.slice(0,200)); }
  const d=await r.json();
  return d.content.filter(c=>c.type==="text").map(c=>c.text).join("\n").trim();
}
function sistemaTutor(){
  const niv=nivelObj(E.nivel), un=unidadeAtual();
  return "Você é o tutor de inglês do Victor, brasileiro, nível "+E.nivel+" de 9 no curso dele (tema atual: "+niv.nome+" — unidade '"+un.t+"', gramática: "+un.g.t+")."
  +" Converse EM INGLÊS bem simples, usando só estruturas até o nível dele. Frases curtas."
  +" Sempre responda neste formato exato, duas linhas:\nEN: <sua resposta em inglês, no máximo 2 frases, terminando com uma pergunta simples>\nPT: <tradução da sua resposta em português>"
  +" Se a mensagem dele tiver erro de inglês, comece a linha PT com a correção entre colchetes, assim: [correção: 'I go' → 'I went'] e depois a tradução."
  +" Nunca escreva nada fora dessas duas linhas.";
}
async function enviarTutor(){
  const cx=$('#tutorTexto'); const txt=cx.value.trim(); if(!txt)return;
  E.tutorHist.push({role:"user",content:txt}); cx.value=''; salvar();
  tutorPensando=true; render();
  try{
    const resp=await chamarIA(E.tutorHist.slice(-16),sistemaTutor());
    E.tutorHist.push({role:"assistant",content:resp});
  }catch(e){
    const det=String(e.message||'').indexOf('sem-credencial')>-1
      ? 'Falta a chave da API. Configure no Passaporte.'
      : 'O tutor nao respondeu agora. Verifique a internet e tente de novo.';
    E.tutorHist.push({role:"assistant",content:"EN: (offline)\nPT: "+det+" Sua conversa foi salva."});
  }
  if(E.tutorHist.length>40)E.tutorHist=E.tutorHist.slice(-40);
  tutorPensando=false; salvar(); render();
  verificarConquistas('tutor');
  setTimeout(()=>{const c=$('#fimConversa'); if(c)c.scrollIntoView({block:'end'});},60);
}

async function corrigirComTutor(pt,en,minha){
  const cx=$('#retornoIA'); if(cx)cx.innerHTML='<span class="escrevendo">Tutor conferindo…</span>';

      "Você é um professor de inglês corrigindo um aluno brasileiro iniciante. Português claro, sem enrolação.");

      '<div style="font-size:15.5px;line-height:1.55">'+esc(ex.g.e)+'</div>'+

function contarUso(ex,p,i){
  let usados=ex.montada.filter(x=>x===p).length;
  let antes=ex.chips.slice(0,i).filter(x=>x===p).length;
  return antes<usados;
}
function porChip(i){const ex=exAtual();if(S.resposta!==null)return;const p=ex.chips[i];
  if(contarUso(ex,p,i))return; ex.montada.push(p); render();}
function tirarChip(i){const ex=exAtual();if(S.resposta!==null)return;ex.montada.splice(i,1);render();}
function responderMC(i){
  const ex=exAtual(); if(S.resposta!==null)return;
  const ok=i===ex.correta; S.resposta={i:i,ok:ok}; pontuar(ok,ex.chave, ok?1:2);
  if(ex.som&&ok) falar(ex.som);
  render();
}
function responderDigitar(){
  const ex=exAtual(); const v=$('#campoResp').value.trim();
  if(!v)return;
  const d=dist(norm(v),norm(ex.resposta));
  const ok=d<=1, quase=ok&&d===1;
  S.resposta={txt:v,ok:ok,quase:quase};
  // se digitou perfeitamente, qualidade 1 (fácil); se quase, qualidade 2 (difícil); se errou, qualidade 2
  pontuar(ok,ex.chave, ok?(d===0?1:2):2);
  if(ok)falar(ex.resposta);
  render();
}
function responderOrdenar(){
  const ex=exAtual(); const ok=norm(ex.montada.join(' '))===norm(ex.frase);
  S.resposta={ok:ok}; pontuar(ok,ex.chave, ok?1:2); if(ok)falar(ex.frase); render();
}
function responderEscrever(){
  const ex=exAtual(); const v=$('#campoResp').value.trim(); if(!v)return;
  const a=norm(v).split(' '), b=norm(ex.en).split(' ');
  const iguais=b.filter(w=>a.indexOf(w)>-1).length;
  const ok=iguais/b.length>=0.75;
  S.resposta={txt:v,ok:ok}; pontuar(ok,ex.chave, ok?1:2); render();
}

}

function trocarVel(v){ E.vel=parseFloat(v); salvar(); clearTimeout(window.tv); window.tv=setTimeout(()=>{falar('Nice to meet you.');render();},500); }
function exportar(){
  const pacote={app:'ingles30',versao:VERSAO,data:hoje(),progresso:E};
  const b=new Blob([JSON.stringify(pacote,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='ingles30-backup-'+hoje()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  const st=$('#statusBackup'); if(st)st.innerHTML='<div class="retorno ok">Backup baixado. Guarde esse arquivo — ele restaura tudo em qualquer computador.</div>';
}
function importar(ev){
  const f=ev.target.files[0]; if(!f)return;
  const l=new FileReader();
  l.onload=()=>{
    try{
      const p=JSON.parse(l.result);
      const dados=p.progresso||p;
      if(!dados||typeof dados.nivel!=='number') throw new Error('formato');
      E=migrarProgresso(dados);
      E=Object.assign(JSON.parse(JSON.stringify(PADRAO)),E);
      salvar(); render();
      const st=$('#statusBackup'); if(st)st.innerHTML='<div class="retorno ok">Progresso restaurado: nível '+E.nivel+', '+E.xp+' XP.</div>';
    }catch(e){
      const st=$('#statusBackup'); if(st)st.innerHTML='<div class="retorno nao">Esse arquivo não é um backup do curso. Escolha o .json baixado por este app.</div>';
    }
  };
  l.readAsText(f);
}
async function testarIA(){
  const st=$('#statusIA'); if(st)st.innerHTML='<span class="escrevendo">Testando…</span>';

    if(st)st.innerHTML='<div class="retorno ok">Conexão funcionando. Resposta: '+esc(r.slice(0,40))+'</div>';
  }catch(e){
    const msg=String(e.message||'').indexOf('sem-credencial')>-1
      ? 'Falta a chave. Cole a chave da API acima e salve.'
      : 'A API recusou: '+esc(String(e.message).slice(0,140));
    if(st)st.innerHTML='<div class="retorno nao">'+msg+'</div>';
  }
}

}
setInterval(()=>{
  if(tela!=='sessao'||!S||S.fim)return;
  const d=Math.floor((Date.now()-S.inicio)/1000), el=$('#crono');
  if(el)el.textContent=String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0');
},1000);
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const ex=S&&!S.fim?exAtual():null; if(!ex||S.resposta!==null)return;
  if(ex.t==='digitar'&&document.activeElement&&document.activeElement.id==='campoResp'){e.preventDefault();responderDigitar();}
});
if('speechSynthesis' in window){ speechSynthesis.getVoices(); setTimeout(()=>speechSynthesis.getVoices(),300); }

//   Lembrete diário (Notification API)
async function pedirLembrete(){
  if(!('Notification' in window)){ toast('Seu navegador não suporta notificações.',3000); return; }
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ toast('Permissão negada.',3000); return; }
  // agendamento simples: tenta avisar uma vez por dia se o streak não foi cumprido
  E.config.lembrete=true;
  salvar();
  toast('🔔 Lembrete ativado. Você será avisado se passar das 20h sem estudar.',4000);
  agendarChecagem();
}
function agendarChecagem(){
  // checa a cada 30min
  setInterval(()=>{
    if(!E.config.lembrete)return;
    if(Notification.permission!=='granted')return;
    const agora=new Date();
    const h=agora.getHours(), m=agora.getMinutes();
    const alvo=(E.config.horarioLembrete||'19:00').split(':').map(Number);
    if(h===alvo[0]&&m===alvo[1]&&E.ultimoDia!==hoje()){
      new Notification('Hora de estudar inglês  🇧',{
        body:'Sua ofensiva te espera. 30 minutos hoje.',
        icon:'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 64 64\'%3E%3Crect width=\'64\' height=\'64\' rx=\'12\' fill=\'%2312525E\'/%3E%3Ctext x=\'32\' y=\'44\' font-family=\'Georgia\' font-size=\'34\' font-weight=\'bold\' fill=\'%23fff\' text-anchor=\'middle\'%3EEN%3C/text%3E%3C/svg%3E',
        tag:'ingles30-lembrete'
      });
    }
  },30*60*1000);
}

(async()=>{ await carregar(); render(); })();
